            if (current == null || String(current).trim()==="")
            {
                const suggestedValue = field === "IPID" ? assistantNextFreeIpid() : "";
                pending.cursor={itemIndex:i,field,suggestedValue};
                return {source:"knowledge-ai", text:assistantGenericFieldPrompt(item.domain,field,item.value,suggestedValue), needsFollowUp:true};
            }
        }
    }
    assistantRuntime.conversationContext.pendingProposal=null;
    assistantRuntime.conversationContext.options=null;
    return assistantBuildGenericAddProposal(pending);
}

function assistantGenericAddKnowledge(plan)
{
    const operations=Array.isArray(plan?.operations)&&plan.operations.length?plan.operations:[plan];
    const adds=operations.filter(op=>op?.intent==="add"&&ASSISTANT_ADD_SPECS[op.domain]);
    if (!adds.length || adds.length!==operations.length) return null;
    const requestMode=plan.requestMode || (adds.some(op=>op.mode==="proposal")?"proposal":"guidance");
    if (requestMode!=="proposal") return null;
    const items=adds.map(op=>{
        const spec=ASSISTANT_ADD_SPECS[op.domain];
        const attrs={...(spec.defaults||{}),...(op.attributes||{})};
        if (!attrs.Name && op.target) attrs.Name=op.target;
        return {domain:op.domain,value:attrs,target:op.target};
    });
    return assistantPromptForPendingGenericAdd({kind:"genericAdd",items,cursor:null});
}

function assistantExtractNamedControlIds(text)
{
    const source=String(text||"").trim();
    const result={};
    const clean=value=>String(value||"").trim().replace(/^[`'"]+|[`'".,;:]+$/g,"");
    const patterns=[
        ["fader", /(?:^|\b)([A-Za-z_][A-Za-z0-9_.:-]*)\s+(?:for|as)\s+(?:the\s+)?(?:fader|level)(?:\b|$)/i],
        ["fader", /(?:fader|level)\s*(?:control\s*id|controlid|id)?\s*(?:is|=|:)?\s*([A-Za-z_][A-Za-z0-9_.:-]*)/i],
        ["button", /(?:^|\b)([A-Za-z_][A-Za-z0-9_.:-]*)\s+(?:for|as)\s+(?:the\s+)?(?:button|mute(?:\s+control)?)(?:\b|$)/i],
        ["button", /(?:button|mute(?:\s+control)?)\s*(?:control\s*id|controlid|id)?\s*(?:is|=|:)?\s*([A-Za-z_][A-Za-z0-9_.:-]*)/i]
    ];
    for (const [kind,re] of patterns)
    {
        if (result[kind]) continue;
        const match=source.match(re);
        if (match?.[1]) result[kind]=clean(match[1]);
    }
    return result;
}

function assistantApplyCompoundControlIdReply(pending, text)
{
    if (!pending || pending.kind!=="genericAdd") return false;
    const mapped=assistantExtractNamedControlIds(text);
    let changed=false;
    for (const item of pending.items||[])
    {
        if (item?.value?.ControlId) continue;
        if (item.domain==="fader" && mapped.fader) { item.value.ControlId=mapped.fader; changed=true; }
        if (item.domain==="button" && mapped.button) { item.value.ControlId=mapped.button; changed=true; }
    }
    return changed;
}

function assistantPendingGenericAddFollowUp(userText)
{
    const pending=assistantRuntime.conversationContext.pendingProposal;
    if (!pending || pending.kind!=="genericAdd" || !pending.cursor) return null;
    const text=String(userText||"").trim();
    const item=pending.items[pending.cursor.itemIndex];
    const field=pending.cursor.field;
    if (!item || !text) return null;

    // A natural-language reply may satisfy more than one pending DSP ControlId at once,
    // e.g. "alLevel for the fader and alMute for the button". Resolve those named
    // values before falling back to assigning the entire reply to the current field.
    if (field==="ControlId" && assistantApplyCompoundControlIdReply(pending,text))
        return assistantPromptForPendingGenericAdd(pending);

    if (field==="IPID")
    {
        const suggested = String(pending.cursor?.suggestedValue || "").trim();
        if (assistantIsAffirmativeReply(text) && suggested)
            item.value[field] = suggested;
        else if (/\bnext\s+free\s+ipid\b/i.test(text))
            item.value[field] = suggested || assistantNextFreeIpid();
        else
            item.value[field] = assistantParseExplicitIpid(text);
    }
    if (field==="IPID" && item.value[field] && assistantIpidIsReserved(item.value[field], pending.cursor?.suggestedValue || ""))
    {
        const conflict = item.value[field];
        item.value[field] = "";
        const suggestedValue = assistantNextFreeIpid();
        pending.cursor = {...pending.cursor, suggestedValue};
        const alternate = assistantAlternateFreeIpid(suggestedValue);
        return {
            source:"knowledge-ai",
            text:`${conflict} is already in use or reserved by another pending MAV change, so I will not assign or recommend it. ${suggestedValue ? `The next free IPID is ${suggestedValue}. Should I use that?` : "No free IPID is currently available."}${alternate ? ` Another currently free option is ${alternate}.` : ""}`,
            needsFollowUp:true
        };
    }
    else if (field==="TransportDeviceName")
    {
        const names=(state.definition?.MatrixSwitcher?.Encoders||[]).map(x=>x?.Name).filter(Boolean);
        const ordinal=assistantOrdinalIndex(text);
        item.value[field]=(Number.isInteger(ordinal)&&names[ordinal])?names[ordinal]:(names.find(x=>text.toLowerCase().includes(x.toLowerCase()))||text);
    }
    else item.value[field]=text;
    if (!item.value[field])
    {
        const suggestedValue = field === "IPID" ? (pending.cursor?.suggestedValue || assistantNextFreeIpid()) : "";
        pending.cursor = {...pending.cursor, suggestedValue};
        return {source:"knowledge-ai",text:assistantGenericFieldPrompt(item.domain,field,item.value,suggestedValue),needsFollowUp:true};
    }
    return assistantPromptForPendingGenericAdd(pending);
}

function assistantCompoundKnowledge(plan, userText)
{
    const operations = Array.isArray(plan?.operations) ? plan.operations : [];
    if (operations.length < 2) return null;

    const addDestination = operations.find(op => op.intent === "add" && op.domain === "destination");
    const addDisplay = operations.find(op => op.intent === "add" && op.domain === "display");
    if (!addDestination || !addDisplay) return null;

    const requestMode = plan.requestMode || (operations.some(op => op.mode === "proposal") ? "proposal" : "guidance");
    const destAttrs = addDestination.attributes || {};
    const displayAttrs = addDisplay.attributes || {};
    const name = destAttrs.Name || addDestination.target || addDisplay.target || "New Destination";
    const destinationType = destAttrs.Type || "Monitor";
    const ipid = destAttrs.IPID != null ? String(destAttrs.IPID) : "";
    const displayType = displayAttrs.Type || (destinationType === "Projector" ? "Projector" : "LCD");
    const brand = displayAttrs.Brand || assistantCatalogBrandFromText(userText) || "";
    const model = displayAttrs.Model != null ? String(displayAttrs.Model) : "";

    let models = [];
    if (brand)
    {
        models = [...(state.displayCatalog?.[displayType]?.[brand] || [])];
        if (!models.length)
        {
            Object.values(state.displayCatalog || {}).forEach(brandMap =>
                (brandMap?.[brand] || []).forEach(item => { if (!models.includes(item)) models.push(item); }));
        }
    }

    if (requestMode === "guidance")
    {
        const lines = [
            `To add ${name} as a new decoder/destination, open Destinations / Decoders and add a destination under MatrixSwitcher.Decoders[].`,
            `Set Name=${name} and Type=${destinationType}. Assign the decoder IPID used by the controller.`,
            `Enable/configure Controlled Display on that destination and set Type=${displayType}${brand ? `, Brand=${brand}` : ""}.`,
            "Run Validate, resolve any required fields, then Save through the existing workflow."
        ];
        if (brand && models.length) lines.push("", `${brand} models currently known to MAV:`, ...models.slice(0, 20).map((item, i) => `${i + 1}. ${item}`));
        return { source: "knowledge-ai", text: lines.join("\n") };
    }

    const pending = {
        kind: "destinationDisplay",
        name, destinationType, ipid, displayType, brand, model, models,
        comPort: displayAttrs.ComPort || 1,
        pollingIntervalMs: displayAttrs.PollingIntervalMs || 5000
    };
    return assistantPromptForPendingDestinationDisplay(pending);
}

function assistantKnowledgeFromIntent(intent, userText)
{
    if (!intent) return null;

    if (Array.isArray(intent.operations) && intent.operations.length > 1)
    {
        const compound = assistantCompoundKnowledge(intent, userText);
        if (compound) return compound;
    }

    const primary = Array.isArray(intent.operations) && intent.operations.length ? intent.operations[0] : intent;
    if (!primary || primary.intent === "unknown" || primary.domain === "unknown") return null;
    if (intent.operations?.length === 1) intent = { ...primary, operations: intent.operations, requestMode: intent.requestMode || primary.mode, confidence: intent.confidence, parseMode: intent.parseMode };

    const genericAdd = assistantGenericAddKnowledge(intent);
    if (genericAdd) return genericAdd;

    if (intent.domain === "fader") return assistantDspFaderKnowledge(intent);

    if (intent.intent === "validate")
    {
        const result = assistantDeterministicResponse("validate current configuration design");
        return result ? { source: "knowledge-ai", text: typeof result === "string" ? result : result.text, proposal: result.proposal || null } : null;
    }

    if (intent.intent === "review")
    {
        const result = assistantDeterministicResponse("summarize this systemdefinition configuration");
        return result ? { source: "knowledge-ai", text: typeof result === "string" ? result : result.text, proposal: result.proposal || null } : null;
    }

    if (intent.domain === "display")
    {
        let routed = String(userText || "");
        const target = intent.reference || intent.target;
        const property = assistantNormalizeProperty("display", intent.property);

        if (intent.intent === "list_options" && property === "Model")
        {
            routed = target && target !== "current display"
                ? `what models are available for ${target}`
                : "what models are available for the current display";
        }
        else if (intent.intent === "modify" && property === "Model")
        {
            if (intent.value != null)
            {
                routed = `change ${target || "current destination"} display model to ${intent.value}`;
            }
            else
            {
                routed = `help me modify the display model for ${target || "current destination"}`;
            }
        }

        const result = assistantDeterministicResponse(routed);
        if (result)
        {
            const normalized = typeof result === "string" ? { text: result } : result;
            return { ...normalized, source: "knowledge-ai" };
        }
    }

    const canonical = {
        system: intent.intent === "explain" ? "explain the systemdefinition" : "review configuration",
        source: `how do I ${intent.intent} source encoder ${intent.target || ""}`,
        destination: `how do I ${intent.intent} destination decoder ${intent.target || ""}`,
        camera: `how do I ${intent.intent} camera ${intent.target || ""}`,
        dsp: `how do I ${intent.intent} dsp ${intent.target || ""}`,
        button: `how do I ${intent.intent} dsp mute button ${intent.target || ""}`,
        dsp_device: `how do I ${intent.intent} dsp device ${intent.target || ""}`,
        vtc: `how do I ${intent.intent} vtc ${intent.target || ""}`,
        atc: `how do I ${intent.intent} atc ${intent.target || ""}`
    }[intent.domain];

    if (canonical)
    {
        const result = assistantDeterministicResponse(canonical);
        if (result)
        {
            const normalized = typeof result === "string" ? { text: result } : result;
            return { ...normalized, source: "knowledge-ai" };
        }
    }

    return null;
}

function assistantIntentClarification(intent)
{
    if (!intent)
    {
        return "I couldn't map that request to a supported MAV configuration operation. I won't invent a SystemDefinition path. Try naming the MAV object you mean (source, destination, display, camera, DSP fader, DSP button, VTC, or ATC) and what you want to inspect or change.";
    }

    const target = intent.target || intent.reference;
    return [
        `The local model interpreted this as ${intent.intent} → ${intent.domain}${target ? ` → ${target}` : ""}.`,
        "",
        "MAV Knowledge does not yet have an authoritative handler for that exact operation, so I am not going to invent configuration fields or JSON. Please name the specific MAV object/property you want to inspect or change."
    ].join("\n");
}

async function loadMavAssistant()
{
    const desired = await assistantResolveModelSelection();

    if (assistantRuntime.generator && assistantRuntime.loadedModel?.tier === desired.tier)
    {
        return assistantRuntime.generator;
    }

    if (assistantRuntime.generator && assistantRuntime.loadedModel?.tier !== desired.tier)
    {
        assistantResetLoadedModel();
    }

    if (assistantRuntime.loadingPromise)
    {
        return assistantRuntime.loadingPromise;
    }

    assistantRuntime.selectedModel = desired;
    assistantSetStatus("loading", `Loading ${desired.label}…`);

    assistantRuntime.loadingPromise = (async () =>
    {
        try
        {
            const transformers = await import(MAV_ASSISTANT_RUNTIME);
            const { env, pipeline } = transformers;

            env.allowLocalModels = true;
            env.allowRemoteModels = false;
            env.localModelPath = MAV_ASSISTANT_MODEL_ROOT;
            env.backends.onnx.wasm.wasmPaths = {
                mjs: MAV_ASSISTANT_WASM_MODULE,
                wasm: MAV_ASSISTANT_WASM_BINARY
            };
            env.backends.onnx.wasm.numThreads = 1;
            env.backends.onnx.wasm.proxy = true;

            const generator = await pipeline(
                "text-generation",
                desired.id,
                {
                    dtype: desired.dtype,
                    ...(desired.device ? { device: desired.device } : {}),
                    progress_callback: progress =>
                    {
                        if (progress?.status === "progress" && progress.total)
                        {
                            const pct = Math.round((progress.loaded / progress.total) * 100);
                            assistantSetStatus("loading", `Loading ${desired.label}…`, null, pct);
                        }
                    }
                });

            assistantRuntime.generator = generator;
            assistantRuntime.loadedModel = desired;
            assistantSetStatus("ready", assistantReadyLabel());
            return generator;
        }
        catch (error)
        {
            console.error("MAV Assistant load failure", error);
            assistantSetStatus("error", "AI assets unavailable", error);
            throw error;
        }
        finally
        {
            assistantRuntime.loadingPromise = null;
        }
    })();

    return assistantRuntime.loadingPromise;
}

function assistantSanitizeGeneratedText(text, prompt = "", userText = "")
{
    let value = String(text || "")
        .replace(/<\|endoftext\|>/gi, "")
        .replace(/<\|im_end\|>/gi, "")
        .trim();

    if (prompt && value.startsWith(prompt))
    {
        value = value.slice(prompt.length).trim();
    }

    // If a runtime returns the full ChatML transcript, keep only the final assistant turn.
    const assistantMarkers = [
        "<|im_start|>assistant\n",
        "<|im_start|>assistant\r\n"
    ];

    for (const marker of assistantMarkers)
    {
        const index = value.lastIndexOf(marker);
        if (index >= 0)
        {
            value = value.slice(index + marker.length).trim();
            break;
        }
    }

    // Some tiny models echo role labels without special tokens.
    if (/\bsystem\s+[\s\S]*\buser\s+[\s\S]*\bassistant\s+/i.test(value))
    {
        const matches = [...value.matchAll(/(?:^|\n)assistant\s*\n?/gi)];
        if (matches.length)
        {
            const last = matches[matches.length - 1];
            value = value.slice(last.index + last[0].length).trim();
        }
    }

    value = value
        .replace(/^assistant\s*[:\-]?\s*/i, "")
        .replace(/<\|im_start\|>[\s\S]*$/i, "")
        .trim();

    if (userText)
    {
        const escapedUser = userText.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        value = value.replace(new RegExp(`^${escapedUser}\\s*`, "i"), "").trim();
    }

    // Do not display an accidentally echoed raw context payload.
    const contextIndex = value.search(/CURRENT MAV CONTEXT\s*:/i);
    if (contextIndex >= 0)
    {
        const after = value.slice(contextIndex);
        const roleMatch = after.match(/(?:^|\n)assistant\s*\n?/i);
        value = roleMatch
            ? after.slice(roleMatch.index + roleMatch[0].length).trim()
            : "I could not produce a clean answer for that request. Please try a more specific question.";
    }

    // Collapse pathological repetition from a tiny model.
    const words = value.split(/\s+/);
    if (words.length > 180)
    {
        value = words.slice(0, 180).join(" ") + "…";
    }

    return value.trim();
}

function assistantFormatMessage(text)
{
    const lines = String(text || "")
        .replace(/\r\n/g, "\n")
        .split("\n")
        .map(line => line.trimEnd());

    const parts = [];
    let listType = null;
    let listItems = [];

    const flushList = () =>
    {
        if (!listItems.length) return;
        const tag = listType === "ol" ? "ol" : "ul";
        parts.push(`<${tag}>${listItems.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</${tag}>`);
        listItems = [];
        listType = null;
    };

    for (const line of lines)
    {
        const trimmed = line.trim();
        if (!trimmed)
        {
            flushList();
            continue;
        }

        const bullet = trimmed.match(/^[-*•]\s+(.+)$/);
        if (bullet)
        {
            if (listType && listType !== "ul") flushList();
            listType = "ul";
            listItems.push(bullet[1]);
            continue;
        }

        const numbered = trimmed.match(/^\d+[.)]\s+(.+)$/);
        if (numbered)
        {
            if (listType && listType !== "ol") flushList();
            listType = "ol";
            listItems.push(numbered[1]);
            continue;
        }

        flushList();

        if (/^[A-Za-z][A-Za-z0-9 /&_-]{1,40}:$/.test(trimmed))
        {
            parts.push(`<div class="assistant-inline-heading">${escapeHtml(trimmed)}</div>`);
        }
        else
        {
            parts.push(`<p>${escapeHtml(trimmed)}</p>`);
        }
    }

    flushList();
    return `<div class="assistant-message-body">${parts.join("")}</div>`;
}

function assistantParseProposal(text)
{
    const match = String(text || "").match(/<MAV_PROPOSAL>([\s\S]*?)<\/MAV_PROPOSAL>/i);
    if (!match) return { displayText: text, proposal: null };

    const displayText = String(text).replace(match[0], "").trim();

    try
    {
        const parsed = JSON.parse(match[1]);
        if (!parsed || !Array.isArray(parsed.changes) || !parsed.changes.length)
        {
            return { displayText, proposal: null };
        }

        const allowed = new Set(["add", "replace", "remove"]);
        const valid = parsed.changes.every(change =>
            change &&
            allowed.has(change.op) &&
            typeof change.path === "string" &&
            change.path.startsWith("/"));

        return {
            displayText,
            proposal: valid ? parsed : null
        };
    }
    catch
    {
        return { displayText, proposal: null };
    }
}

function assistantDecodePointerToken(token)
{
    return token.replace(/~1/g, "/").replace(/~0/g, "~");
}

function assistantApplyOnePatch(target, change)
{
    const tokens = change.path
        .split("/")
        .slice(1)
        .map(assistantDecodePointerToken);

    if (!tokens.length)
    {
        throw new Error("Root replacement is not allowed by MAV Assistant.");
    }

    let parent = target;
    for (let i = 0; i < tokens.length - 1; i++)
    {
        const token = tokens[i];
        const key = Array.isArray(parent) ? Number(token) : token;
        if (parent == null || !(key in parent))
        {
            throw new Error(`Proposal path does not exist: ${change.path}`);
        }
        parent = parent[key];
    }

    const last = tokens[tokens.length - 1];

    if (Array.isArray(parent))
    {
        if (change.op === "add" && last === "-")
        {
            parent.push(clone(change.value));
            return;
        }

        const index = Number(last);
        if (!Number.isInteger(index) || index < 0 || index >= parent.length + (change.op === "add" ? 1 : 0))
        {
            throw new Error(`Invalid array index in proposal: ${change.path}`);
        }

        if (change.op === "remove") parent.splice(index, 1);
        else if (change.op === "add") parent.splice(index, 0, clone(change.value));
        else parent[index] = clone(change.value);
        return;
    }

    if (!parent || typeof parent !== "object")
    {
        throw new Error(`Proposal parent is not an object: ${change.path}`);
    }

    if (change.op === "remove")
    {
        if (!(last in parent)) throw new Error(`Proposal path does not exist: ${change.path}`);
        delete parent[last];
    }
    else
    {
        parent[last] = clone(change.value);
    }
}

function assistantRecordProposalAudit(proposal)
{
    if (!proposal?.changes?.length) return proposal || null;
    const auditId = proposal.auditId || `proposal-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    proposal.auditId = auditId;
    if (assistantRuntime.history.some(entry => entry?.role === "proposal-audit" && entry.auditId === auditId))
        return proposal;
    assistantRuntime.history.push({
        role: "proposal-audit",
        auditId,
        status: "pending",
        proposal: JSON.parse(JSON.stringify(proposal))
    });
    return proposal;
}

function assistantMarkProposalAudit(proposal, status)
{
    const auditId = proposal?.auditId;
    if (!auditId) return;
    for (let i = assistantRuntime.history.length - 1; i >= 0; i--)
    {
        const entry = assistantRuntime.history[i];
        if (entry?.role === "proposal-audit" && entry.auditId === auditId)
        {
            entry.status = status;
            return;
        }
    }
}

function assistantSetActiveProposal(proposal)
{
    if (assistantRuntime.proposal?.changes?.length && assistantRuntime.proposal !== proposal)
        assistantMarkProposalAudit(assistantRuntime.proposal, "superseded");
    assistantRuntime.proposal = proposal?.changes?.length ? assistantRecordProposalAudit(proposal) : null;
}

function assistantRenderProposalAuditEntry(message)
{
    const proposal = message?.proposal;
    if (!proposal?.changes?.length) return "";
    const status = message.status === "applied" ? "Applied to working definition"
        : (message.status === "dismissed" ? "Dismissed by operator"
        : (message.status === "superseded" ? "Superseded by a later request"
        : (message.status === "apply-failed" ? "Apply failed; working definition was not changed"
        : "Awaiting operator decision at time of export")));
    return `
        <div class="assistant-proposal assistant-proposal-audit" data-proposal-audit="${escapeHtml(message.auditId || "")}">
            <strong>Proposal snapshot</strong>
            <div class="muted">${escapeHtml(proposal.summary || "Reviewable working-definition change")}</div>
            <div class="assistant-proposal-list">
                ${proposal.changes.map(change => `
                    <div class="assistant-proposal-item">
                        ${escapeHtml(change.op.toUpperCase())} ${escapeHtml(change.path)}
                        ${"value" in change ? `<br>${escapeHtml(JSON.stringify(change.value))}` : ""}
                    </div>`).join("")}
            </div>
            <div class="assistant-proposal-audit-status">Operator decision: ${escapeHtml(status)}</div>
        </div>`;
}

function assistantApplyProposal()
{
    const proposal = assistantRuntime.proposal;
    if (!proposal?.changes?.length) return;

    try
    {
        const working = clone(state.definition);
        proposal.changes.forEach(change => assistantApplyOnePatch(working, change));
        state.definition = normalizeDefinition(working);
        assistantMarkProposalAudit(proposal, "applied");
        assistantRuntime.proposal = null;
        markDirty();
        assistantRuntime.history.push({
            role: "assistant",
            source: "knowledge",
            text: "Proposal applied to the working definition. It has NOT been saved or deployed. Run Validate, review the JSON, then Save when you are satisfied."
        });
        render();
    }
    catch (error)
    {
        assistantMarkProposalAudit(proposal, "apply-failed");
        assistantRuntime.history.push({ role: "assistant", source: "knowledge", text: `I could not apply that proposal safely: ${error.message}` });
        assistantRuntime.proposal = null;
        render();
    }
}

function assistantDismissProposal()
{
    assistantMarkProposalAudit(assistantRuntime.proposal, "dismissed");
    assistantRuntime.proposal = null;
    renderPage();
}

function assistantResolveDestinationReference(userText, decoders)
{
    const text = String(userText || "").toLowerCase();
    const items = Array.isArray(decoders) ? decoders : [];
    if (!items.length) return null;

    const ordinalWords = {
        first: 0,
        second: 1,
        third: 2,
        fourth: 3,
        fifth: 4,
        sixth: 5,
        seventh: 6,
        eighth: 7,
        ninth: 8,
        tenth: 9
    };

    for (const [word, index] of Object.entries(ordinalWords))
    {
        if (new RegExp(`\\b${word}\\s+(?:destination|decoder)\\b`).test(text) && index < items.length)
        {
            return { index, destination: items[index], matchedBy: word };
        }
    }

    const numbered = text.match(/\b(?:destination|decoder)\s*#?\s*(\d+)\b/);
    if (numbered)
    {
        const index = Number(numbered[1]) - 1;
        if (Number.isInteger(index) && index >= 0 && index < items.length)
        {
            return { index, destination: items[index], matchedBy: numbered[0] };
        }
    }

    // Prefer exact configured names mentioned by the operator.
    let best = null;
    items.forEach((item, index) =>
    {
        const name = String(item?.Name || "").trim();
        if (!name) return;
        const lowered = name.toLowerCase();
        if (text.includes(lowered) && (!best || lowered.length > best.nameLength))
        {
            best = { index, destination: item, matchedBy: name, nameLength: lowered.length };
        }
    });

    if (best)
    {
        delete best.nameLength;
        return best;
    }

    return null;
}

function assistantExtractRequestedDisplayModel(userText)
{
    const text = String(userText || "").trim();

    const quoted = text.match(/\bmodel\b[\s\S]{0,32}?\b(?:to|as|=|be)\b\s*["']([^"']+)["']/i);
    if (quoted) return quoted[1].trim();

    const direct = text.match(/\bmodel\b\s+(?:to|as|=|be|is)\s+([A-Za-z0-9][A-Za-z0-9._\-\/ ]{0,48}?)(?:\s+(?:for|on|of)\b|[?.!,]|$)/i);
    if (direct) return direct[1].trim();

    const changeTo = text.match(/\b(?:change|set|update)\b[\s\S]{0,48}?\bdisplay\s+model\b[\s\S]{0,24}?\bto\b\s+([A-Za-z0-9][A-Za-z0-9._\-\/ ]{0,48}?)(?:[?.!,]|$)/i);
    if (changeTo) return changeTo[1].trim();

    return "";
}

function assistantRememberDisplayTarget(target)
{
    if (!target?.destination) return;
    const display = target.destination.Display || null;
    assistantRuntime.conversationContext.subject = {
        kind: "display",
        decoderIndex: target.index,
        destinationName: target.destination.Name || `Destination ${target.index + 1}`,
        displayType: display?.Type || "",
        brand: display?.Brand || "",
        model: display?.Model || ""
    };
    assistantRuntime.conversationContext.options = null;
}

function assistantCurrentDisplaySubject(decoders)
{
    const subject = assistantRuntime.conversationContext.subject;
    if (!subject || subject.kind !== "display") return null;
    const destination = decoders?.[subject.decoderIndex];
    if (!destination) return null;
    return {
        index: subject.decoderIndex,
        destination,
        matchedBy: subject.destinationName || `destination ${subject.decoderIndex + 1}`
    };
}

function assistantCatalogModelsForDisplay(display)
{
    if (!display) return [];
    const type = display.Type || "";
    const brand = display.Brand || "";
    const exact = state.displayCatalog?.[type]?.[brand] || [];
    if (exact.length) return [...exact];

    // If type is absent/legacy, search the catalog for the configured brand.
    const byBrand = [];
    Object.values(state.displayCatalog || {}).forEach(brands =>
    {
        (brands?.[brand] || []).forEach(model =>
        {
            if (!byBrand.includes(model)) byBrand.push(model);
        });
    });
    return byBrand;
}

function assistantDisplayCatalogFollowUp(userText, decoders)
{
    const query = String(userText || "").toLowerCase();
    const asksModels = /\b(?:what|which|show|list|available)\b[\s\S]{0,40}\bmodels?\b/.test(query) ||
        /\bmodels?\b[\s\S]{0,24}\b(?:available|select|choose|options?)\b/.test(query);
    if (!asksModels) return null;

    const explicit = assistantResolveDestinationReference(userText, decoders);
    const target = explicit || assistantCurrentDisplaySubject(decoders);
    if (!target?.destination?.Display) return null;

    assistantRememberDisplayTarget(target);
    const display = target.destination.Display;
    const models = assistantCatalogModelsForDisplay(display);
    const destinationName = target.destination.Name || `Destination ${target.index + 1}`;

    if (!models.length)
    {
        return {
            source: "knowledge",
            text: [
                `I resolved the current subject to ${destinationName}.`,
                "",
                `Its configured display is ${display.Brand || "unbranded"} ${display.Model || "model not set"} (${display.Type || "type not set"}).`,
                "",
                "MAV's loaded display catalog does not currently contain selectable models for that Brand/Type combination. I will not invent model names."
            ].join("\n")
        };
    }

    assistantRuntime.conversationContext.options = {
        kind: "displayModel",
        decoderIndex: target.index,
        values: models
    };

    return {
        source: "knowledge",
        text: [
            `For ${destinationName}, MAV's loaded catalog has these ${display.Brand || "display"} model options:`,
            "",
            ...models.map((model, index) => `${index + 1}. ${model}`),
            "",
            "You can reply with the model name, the list number, or an ordinal phrase such as “use the second one.” I will prepare a working-definition proposal rather than saving it automatically."
        ].join("\n")
    };
}

function assistantOrdinalIndex(text)
{
    const query = String(text || "").toLowerCase();
    const words = { first: 0, second: 1, third: 2, fourth: 3, fifth: 4, sixth: 5, seventh: 6, eighth: 7, ninth: 8, tenth: 9 };
    for (const [word, index] of Object.entries(words))
    {
        if (new RegExp(`\\b${word}\\b`).test(query)) return index;
    }
    const number = query.match(/\b(?:option|model|number|#)?\s*(\d+)\b/);
    return number ? Number(number[1]) - 1 : null;
}

function assistantDisplayOptionSelection(userText, decoders)
{
    const options = assistantRuntime.conversationContext.options;
    if (!options || options.kind !== "displayModel" || !Array.isArray(options.values)) return null;

    const query = String(userText || "").toLowerCase();
    const exactOptionIndex = options.values.findIndex(value => query.trim() === String(value).toLowerCase());
    const isSelection = /\b(?:use|pick|choose|select|set|change|make)\b/.test(query) || exactOptionIndex >= 0;
    if (!isSelection) return null;

    let index = exactOptionIndex >= 0 ? exactOptionIndex : assistantOrdinalIndex(userText);
    if (index == null)
    {
        index = options.values.findIndex(value => query.includes(String(value).toLowerCase()));
    }
    if (!Number.isInteger(index) || index < 0 || index >= options.values.length) return null;

    const destination = decoders?.[options.decoderIndex];
    const display = destination?.Display;
    if (!display) return null;

    const newModel = options.values[index];
    const currentModel = display.Model || "not set";
    const destinationName = destination.Name || `Destination ${options.decoderIndex + 1}`;
    assistantRuntime.conversationContext.options = null;

    return {
        source: "knowledge",
        text: [
            `I resolved that selection to ${newModel} for ${destinationName}.`,
            "",
            `Current model: ${currentModel}.`,
            `Proposed model: ${newModel}.`,
            `Path: /MatrixSwitcher/Decoders/${options.decoderIndex}/Display/Model`,
            "",
            "I prepared the change below. Apply changes only the in-memory working definition; Validate and Save remain separate operator actions."
        ].join("\n"),
        proposal: {
            summary: `Change ${destinationName} display model from ${currentModel} to ${newModel}`,
            changes: [{
                op: Object.prototype.hasOwnProperty.call(display, "Model") ? "replace" : "add",
                path: `/MatrixSwitcher/Decoders/${options.decoderIndex}/Display/Model`,
                value: newModel
            }]
        }
    };
}

function assistantStructuredDisplayModelResponse(userText, decoders)
{
    const query = String(userText || "").toLowerCase();
    const isDisplayModelRequest =
        /\bdisplay\b/.test(query) &&
        /\bmodel\b/.test(query) &&
        /\b(help|edit|change|modify|set|update|what|show|current)\b/.test(query);

    if (!isDisplayModelRequest) return null;

    const target = assistantResolveDestinationReference(userText, decoders);
    if (!target)
    {
        const names = decoders.map((item, index) => `${index + 1}. ${item?.Name || `Destination ${index + 1}`}`).join("; ");
        return {
            text: [
                "I can modify a display model, but I need to know which destination you mean.",
                "",
                `Configured destinations: ${names || "none"}.`,
                "",
                "You can refer to one by name (for example, Front Display) or by position (for example, first destination or destination 1)."
            ].join("\n"),
            source: "knowledge"
        };
    }

    assistantRememberDisplayTarget(target);

    const destination = target.destination || {};
    const display = destination.Display;
    const destinationName = destination.Name || `Destination ${target.index + 1}`;
    const pointerBase = `/MatrixSwitcher/Decoders/${target.index}/Display`;

    if (!display)
    {
        return {
            text: [
                `${destinationName} is destination ${target.index + 1}, but it does not currently have a Display object attached.`,
                "",
                `Its configuration path is /MatrixSwitcher/Decoders/${target.index}.`,
                "",
                "Use the Displays page to enable/configure Controlled Display on that destination first. Once a Display object exists, I can propose specific Brand/Model edits safely."
            ].join("\n"),
            source: "knowledge"
        };
    }

    const currentBrand = display.Brand || "not set";
    const currentModel = display.Model || "not set";
    const requestedModel = assistantExtractRequestedDisplayModel(userText);

    if (!requestedModel)
    {
        return {
            text: [
                `I resolved “${target.matchedBy}” to ${destinationName} (destination ${target.index + 1}).`,
                "",
                `Current display: ${currentBrand} ${currentModel}.`,
                `Model path: ${pointerBase}/Model`,
                "",
                "Tell me the exact new model value you want, for example: “change the first destination display model to M651.” I’ll prepare the working-definition change for review rather than saving it automatically."
            ].join("\n"),
            source: "knowledge"
        };
    }

    const catalogModels = assistantCatalogModelsForDisplay(display);
    if (catalogModels.length && !catalogModels.some(model => String(model).toLowerCase() === requestedModel.toLowerCase()))
    {
        assistantRuntime.conversationContext.options = {
            kind: "displayModel",
            decoderIndex: target.index,
            values: catalogModels
        };

        return {
            source: "knowledge",
            text: [
                `${requestedModel} is not listed in MAV's loaded catalog for ${currentBrand} ${display.Type || "display"}.`,
                "",
                "Available models:",
                ...catalogModels.map((model, index) => `${index + 1}. ${model}`),
                "",
                "I did not prepare a patch because MAV should not silently accept an unlisted model when catalog data is available. You can choose one of the listed models, or edit Advanced JSON if this is intentionally a new/unlisted driver entry."
            ].join("\n")
        };
    }

    const op = Object.prototype.hasOwnProperty.call(display, "Model") ? "replace" : "add";
    return {
        text: [
            `I resolved the target to ${destinationName} (destination ${target.index + 1}).`,
            "",
            `Current display model: ${currentModel}.`,
            `Proposed display model: ${requestedModel}.`,
            `Path: ${pointerBase}/Model`,
            "",
            "I prepared this as a working-definition proposal. Review it below; Apply only changes the in-memory working copy. Validate and Save remain separate operator actions."
        ].join("\n"),
        source: "knowledge",
        proposal: {
            summary: `Change ${destinationName} display model from ${currentModel} to ${requestedModel}`,
            changes: [{
                op,
                path: `${pointerBase}/Model`,
                value: requestedModel
            }]
        }
    };
}

function assistantDeterministicResponse(userText)
{
    const query = String(userText || "").trim().toLowerCase();
    if (!query) return null;

    const definition = state.definition || {};
    const matrix = definition.MatrixSwitcher || {};
    const encoders = Array.isArray(matrix.Encoders) ? matrix.Encoders : [];
    const decoders = Array.isArray(matrix.Decoders) ? matrix.Decoders : [];
    const cameras = Array.isArray(definition.Cameras) ? definition.Cameras : [];
    const dsp = definition.Dsp || null;

    const selectedOption = assistantDisplayOptionSelection(userText, decoders);
    if (selectedOption) return selectedOption;

    const catalogFollowUp = assistantDisplayCatalogFollowUp(userText, decoders);
    if (catalogFollowUp) return catalogFollowUp;

    const generalDefinitionIntent =
        /explain .*systemdefinition/.test(query) ||
        /what (is|does) .*systemdefinition/.test(query) ||
        /systemdefinition .*to me/.test(query) ||
        /how .*modify .*system/.test(query) ||
        /how .*edit .*system/.test(query) ||
        /what can .*change/.test(query);

    if (generalDefinitionIntent)
    {
        return [
            "MAV SystemDefinition is the room's editable configuration contract. The UI changes a working copy of that contract; MAV validates it before Save writes/rebuilds the running configuration.",
            "",
            "Where changes live:",
            "• Sources / Encoders → MatrixSwitcher.Encoders[]",
            "• Destinations / Decoders → MatrixSwitcher.Decoders[]",
            "• Display control → MatrixSwitcher.Decoders[i].Display",
            "• Cameras → Cameras[]",
            "• VTC / ATC → VTC and ATC",
            "• DSP → Dsp, including Faders[], Buttons[], and Devices[].Functions[]",
            "",
            "Normal workflow: make the edit on the appropriate page → Validate → review the working definition/Advanced JSON → Save. Nothing is written to the processor until Save."
        ].join("\n");
    }

    const designValidationIntent =
        /\bvalidate\b.*\b(design|configuration|system|setup)\b/.test(query) ||
        /\bcheck\b.*\b(design|configuration|system|setup)\b/.test(query) ||
        /\bis .*configuration .*valid\b/.test(query);

    const validationIntent =
        designValidationIntent ||
        /\bvalidation\b/.test(query) ||
        /\b(errors?|warnings?)\b/.test(query) ||
        /what .*fix/.test(query) ||
        /fix .*first/.test(query);

    if (validationIntent)
    {
        const items = allValidationItems();
        const errors = items.filter(item => item._severity === "error");
        const warnings = items.filter(item => item._severity === "warning");

        const highLevel = [];
        const blankEncoderIpids = encoders.filter(item => !String(item?.IPID || "").trim());
        const blankDecoderIpids = decoders.filter(item => !String(item?.IPID || "").trim());
        const controlledDisplays = decoders.filter(item => !!item?.Display);

        if (blankEncoderIpids.length) highLevel.push(`${blankEncoderIpids.length} encoder(s) have no IP ID.`);
        if (blankDecoderIpids.length) highLevel.push(`${blankDecoderIpids.length} decoder(s) have no IP ID.`);
        if (!controlledDisplays.length && decoders.some(item => item?.Type !== "Audio")) highLevel.push("No decoder currently has a controlled Display object attached.");
        if (dsp && !String(dsp.IpAddress || "").trim()) highLevel.push("DSP is configured but its IP address is blank.");

        const lines = [
            `MAV validation currently reports ${errors.length} error${errors.length === 1 ? "" : "s"} and ${warnings.length} warning${warnings.length === 1 ? "" : "s"}.`
        ];

        if (items.length)
        {
            lines.push("");
            [...errors, ...warnings].slice(0, 12).forEach((item, index) =>
            {
                const severity = item._severity === "error" ? "ERROR" : "WARNING";
                const path = item.Path ? ` — ${item.Path}` : "";
                lines.push(`${index + 1}. ${severity}${path}: ${item.Message || item.Code || "Validation issue"}`);
            });
        }
        else
        {
            lines.push("", "The current validator has nothing that requires correction.");
        }

        if (highLevel.length)
        {
            lines.push("", "Additional configuration review:", ...highLevel.map(item => `• ${item}`));
        }
        else if (designValidationIntent)
        {
            lines.push("", "High-level configuration review did not find an obvious structural gap in the currently loaded definition.");
        }

        lines.push("", "This checks the SystemDefinition and MAV configuration rules exposed to the UI. It does not prove physical wiring, network reachability, or device behavior unless those live checks are exposed by MAV monitoring/testing.");
        return lines.join("\n");
    }

    const sourceIntent =
        /\b(source|encoder|nvx source)\b/.test(query) &&
        /\b(add|edit|change|modify|configure|remove|delete|how|what)\b/.test(query);

    if (sourceIntent)
    {
        const names = encoders.map(item => item?.Name).filter(Boolean).join(", ") || "none";
        return [
            "Sources / Encoders are edited on the Sources / Encoders page and are stored in MatrixSwitcher.Encoders[].",
            "",
            "For each source MAV can configure:",
            "• Name, Type and Crestron IPID",
            "• VideoStreamLocation and VideoMulticastAddress when Video is enabled",
            "• AudioSessionName when Audio is enabled",
            "• UsbLocalId when USB is enabled",
            "• Optional IPTV device settings for IPTV-backed sources",
            "",
            `Current sources: ${names}.`,
            "",
            "Use + Add Encoder for a new source, edit the fields/capability checkboxes, then Validate and Save."
        ].join("\n");
    }

    const destinationIntent =
        /\b(destination|decoder|nvx destination)\b/.test(query) &&
        /\b(add|edit|change|modify|configure|remove|delete|how|what)\b/.test(query);

    if (destinationIntent && !/display/.test(query))
    {
        const names = decoders.map(item => item?.Name).filter(Boolean).join(", ") || "none";
        return [
            "Destinations / Decoders are edited on the Destinations / Decoders page and are stored in MatrixSwitcher.Decoders[].",
            "",
            "Each destination has Name, Type and IPID. USB can be enabled with UsbLocalId. Controlled display configuration is attached directly to that destination as Destination.Display.",
            "",
            `Current destinations: ${names}.`,
            "",
            "Use + Add Decoder for a new destination, then configure its routing role and optional USB/display capabilities before Validate and Save."
        ].join("\n");
    }

    const structuredDisplayModel = assistantStructuredDisplayModelResponse(userText, decoders);
    if (structuredDisplayModel)
    {
        return structuredDisplayModel;
    }

    const addDisplayIntent =
        /\badd\b.*\bdisplay\b/.test(query) ||
        /\bconfigure\b.*\bdisplay\b/.test(query) ||
        /how .*display/.test(query) ||
        (/\bdisplay\b/.test(query) && /\b(edit|change|modify|remove|delete)\b/.test(query));

    if (addDisplayIntent)
    {
        const available = decoders.filter(destination =>
            destination && !destination.Display && destination.Type !== "Audio");
        const controlled = decoders.filter(destination => destination?.Display);

        const availableNames = available.map(destination => destination.Name || `IP ID ${destination.IPID || "unknown"}`).slice(0, 8);
        const controlledNames = controlled.map(destination => destination.Name || "Unnamed destination").slice(0, 8);

        return [
            "Display control in MAV is attached to the decoder/destination that physically feeds the display: MatrixSwitcher.Decoders[i].Display.",
            "",
            "To add or edit one:",
            "1. Open Displays (or Destinations / Decoders).",
            "2. Choose the destination and enable/configure Controlled Display.",
            "3. Set Display Type, Manufacturer, Model, Decoder COM Port and Polling Interval.",
            "4. For a projector, optionally configure Screen relay settings.",
            "5. Validate, review the working definition, then Save.",
            "",
            `Eligible unconfigured destinations: ${availableNames.length ? availableNames.join(", ") : "none"}.`,
            `Destinations already carrying display control: ${controlledNames.length ? controlledNames.join(", ") : "none"}.`
        ].join("\n");
    }

    const cameraIntent =
        /\bcamera\b/.test(query) &&
        /\b(add|edit|change|modify|configure|remove|delete|how|what)\b/.test(query);

    if (cameraIntent)
    {
        const names = cameras.map(item => item?.Name).filter(Boolean).join(", ") || "none";
        return [
            "Cameras are edited on the Cameras page and stored in Cameras[].",
            "",
            "A MAV camera definition uses Name, Type, Brand, TransportDeviceName and ComPort. TransportDeviceName identifies the transport/control device the camera uses.",
            "",
            `Current cameras: ${names}.`,
            "",
            "Use + Add Camera, fill in the transport/control fields, then Validate and Save."
        ].join("\n");
    }

    const communicationsIntent =
        /\b(vtc|atc|codec|voip|dialer|vtc farm)\b/.test(query) &&
        /\b(add|edit|change|modify|configure|remove|delete|how|what)\b/.test(query);

    if (communicationsIntent)
    {
        return [
            "VTC / ATC configuration is edited on the VTC / ATC page.",
            "",
            "• VTC is the room codec/control endpoint. MAV tracks Name, Type, Brand, ControlPath, CommunicationMethod, IP/Port or SerialPort, and polling settings.",
            "• VtcFarm is a separate shared-service reference with Enabled, IPID and IpAddress.",
            "• ATC is the room audio-conferencing/VoIP dialer definition, including communication method, serial/IP details, channel name and polling settings.",
            "",
            `Current VTC: ${definition.VTC ? `${definition.VTC.Name || "configured"} (${definition.VTC.Brand || definition.VTC.Type || "unknown"})` : "not configured"}.`,
            `Current ATC: ${definition.ATC ? `${definition.ATC.Name || "configured"} (${definition.ATC.Brand || definition.ATC.Type || "unknown"})` : "not configured"}.`,
            "",
            "Make the change on that page, then Validate and Save."
        ].join("\n");
    }

    const dspIntent =
        /\b(dsp|audio|fader|level|volume|mute|button|qsc|biamp|shure|mxa|channel)\b/.test(query) &&
        /\b(add|edit|change|modify|configure|remove|delete|how|what|list|show)\b/.test(query);

    if (dspIntent)
    {
        if (!dsp)
        {
            return [
                "No DSP is currently configured in this SystemDefinition.",
                "",
                "Open DSP and choose Add DSP. MAV will create a DSP definition with Name, Type, IpAddress, PollingIntervalMs, Faders, Buttons and Devices. Then add the named controls the room needs and Validate before Save."
            ].join("\n");
        }

        const faders = Array.isArray(dsp.Faders) ? dsp.Faders : [];
        const buttons = Array.isArray(dsp.Buttons) ? dsp.Buttons : [];
        const devices = Array.isArray(dsp.Devices) ? dsp.Devices : [];

        const faderList = faders.length
            ? faders.map(item => `${item.Name || "Unnamed"}${item.ControlId ? ` → ${item.ControlId}` : ""}`).join(", ")
            : "none";
        const buttonList = buttons.length
            ? buttons.map(item => `${item.Name || "Unnamed"}${item.ControlId ? ` → ${item.ControlId}` : ""}${item.Type ? ` (${item.Type})` : ""}`).join(", ")
            : "none";
        const deviceList = devices.length
            ? devices.map(item => `${item.Name || "Unnamed"} (${item.Type || "device"})`).join(", ")
            : "none";

        return [
            `The current DSP is ${dsp.Name || "DSP"}, type ${dsp.Type || "unknown"}${dsp.IpAddress ? ` at ${dsp.IpAddress}` : ""}.`,
            "",
            "MAV does not use a generic 'audio channel' object. DSP controls are modeled as:",
            "• Dsp.Faders[] — named level/volume controls with Name, ControlId and RepeatIntervalMs",
            "• Dsp.Buttons[] — mute/button actions with Name, ControlId and Type (Toggle, On, Off, FaderIncrement, FaderDecrement, Other)",
            "• Dsp.Devices[] — DSP-backed devices such as ShureMXA; each device has Functions[] with Name and ControlId",
            "",
            `Current faders: ${faderList}.`,
            `Current buttons/mutes: ${buttonList}.`,
            `Current DSP devices: ${deviceList}.`,
            "",
            "To modify these, open DSP, edit the existing control or use + Add Fader / + Add Mute / + Add Device. The ControlId must match the control exposed by the DSP integration. Then Validate and Save."
        ].join("\n");
    }

    const reviewIntent =
        /review .*configuration/.test(query) ||
        /summari[sz]e .*systemdefinition/.test(query) ||
        /summari[sz]e .*configuration/.test(query) ||
        /configuration summary/.test(query);

    if (reviewIntent)
    {
        const controlledDisplays = decoders.filter(item => !!item?.Display);
        const items = allValidationItems();
        const errors = items.filter(item => item._severity === "error").length;
        const warnings = items.filter(item => item._severity === "warning").length;

        const observations = [];
        if (!controlledDisplays.length && decoders.some(item => item?.Type !== "Audio")) observations.push("No physical display-control objects are configured on the decoder destinations.");
        if (!cameras.length) observations.push("No cameras are configured.");
        if (!dsp) observations.push("No DSP is configured.");
        if (errors || warnings) observations.push(`Validation currently reports ${errors} error(s) and ${warnings} warning(s).`);
        if (!observations.length) observations.push("Nothing obvious is missing from the high-level configuration summary.");

        return [
            `${definition.Name || "Current MAV system"} configuration summary:`,
            "",
            `• ${encoders.length} encoder/source${encoders.length === 1 ? "" : "s"}`,
            `• ${decoders.length} decoder/destination${decoders.length === 1 ? "" : "s"}`,
            `• ${controlledDisplays.length} controlled display${controlledDisplays.length === 1 ? "" : "s"}`,
            `• ${cameras.length} camera${cameras.length === 1 ? "" : "s"}`,
            `• DSP: ${dsp?.Type || "not configured"}`,
            `• Validation: ${errors} errors, ${warnings} warnings`,
            "",
            "Things to review:",
            ...observations.map(item => `• ${item}`)
        ].join("\n");
    }

    const structureIntent =
        /explain .*structure/.test(query) ||
        /how .*systemdefinition.*structured/.test(query) ||
        /systemdefinition structure/.test(query);

    if (structureIntent)
    {
        return [
            "MAV SystemDefinition is the room's configuration contract.",
            "",
            "• MatrixSwitcher describes NVX encoders/sources and decoders/destinations.",
            "• Display control is attached to the destination decoder as Destination.Display.",
            "• Cameras describes PTZ/control transports and room camera behavior.",
            "• Dsp describes the DSP platform plus named faders, buttons, and DSP-backed devices.",
            "• VTC / ATC sections describe conferencing/control endpoints and communication methods.",
            "• TouchPanel and room modes describe how the reusable UI should expose configured capabilities.",
            "",
            "The editor changes only the in-memory working copy until Validate/Save is used."
        ].join("\n");
    }

    return null;
}

async function assistantSendMessage(text)
{
    const userText = String(text || "").trim();
    if (!userText || assistantIsBusy()) return;

    const pendingFollowUp = assistantPendingProposalFollowUp(userText);
    if (pendingFollowUp)
    {
        assistantRuntime.history.push({ role: "user", text: userText });
        assistantRuntime.history.push({ role: "assistant", source: pendingFollowUp.source || "knowledge-ai", text: pendingFollowUp.text || "" });
        assistantSetActiveProposal(pendingFollowUp.proposal || null);
        assistantSetStatus("ready", assistantReadyLabel());
        if (state.page === "assistant") render();
        return;
    }

    assistantRuntime.history.push({ role: "user", text: userText });
    if (assistantRuntime.proposal?.changes?.length)
        assistantMarkProposalAudit(assistantRuntime.proposal, "superseded");
    assistantRuntime.proposal = null;
    renderPage();

    // Keep a deterministic candidate as a safety net, but let the local model act as
    // the natural-language front end first. MAV Knowledge remains authoritative.
    const deterministicCandidate = assistantDeterministicResponse(userText);
    let interpreted = null;

    // Insert the interpretation bubble immediately so the operator can see that
    // the local model is interpreting the request before MAV Knowledge answers.
    // The same entry is populated in-place when the structured intent arrives.
    assistantRuntime.lastIntent = null;
    assistantRuntime.lastInterpretation = null;
    const traceEntry = {
        role: "trace",
        trace: {
            modelId: assistantRuntime.loadedModel?.id || null,
            modelLabel: assistantRuntime.loadedModel?.label || assistantModelSettingLabel(),
            rawOutput: "",
            parsed: { requestMode: assistantInferRequestMode(userText), operations: [] },
            mavArea: "Awaiting interpreter output",
            route: "Local AI is mapping the request to MAV concepts.",
            outcome: "Pending",
            pending: true
        }
    };
    assistantRuntime.history.push(traceEntry);
    if (state.page === "assistant") render();

    try
    {
        interpreted = await assistantInterpretRequest(userText);

        // Populate the already-visible bubble before deterministic resolution.
        Object.assign(traceEntry.trace, assistantCreateInterpretationTrace(interpreted), {
            route: `${assistantIntentRoutingLabel(interpreted)} → MAV Knowledge resolution pending`,
            outcome: "Interpreter handoff complete; resolving against MAV Knowledge.",
            pending: false
        });
        if (state.page === "assistant") render();
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

        assistantSetStatus("thinking", "Resolving against MAV Knowledge…");
        renderAssistantRuntimeBits();
        assistantRefreshActivityUi();
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

        const knowledge = assistantKnowledgeFromIntent(interpreted, userText);
        assistantStopThinkingStatus();

        if (knowledge)
        {
            assistantUpdateInterpretationTrace(traceEntry, {
                mavArea: assistantIntentKnowledgeArea(interpreted),
                route: knowledge.proposal
                    ? "Local AI → MAV Knowledge → proposal ready for operator review"
                    : (knowledge.needsFollowUp
                        ? "Local AI → proposal workflow → clarification required before proposal"
                        : assistantIntentRoutingLabel(interpreted)),
                outcome: knowledge.proposal
                    ? "Resolved by MAV Knowledge; reviewable working-definition proposal prepared."
                    : (knowledge.needsFollowUp
                        ? "MAV Knowledge needs one or more required values; targeted follow-up requested."
                        : "Resolved by MAV Knowledge; guidance/information response returned.")
            });
            assistantRuntime.history.push({
                role: "assistant",
                source: knowledge.source || "knowledge-ai",
                text: knowledge.text || ""
            });
            assistantSetActiveProposal(knowledge.proposal || null);
            assistantSetStatus("ready", assistantReadyLabel());
            if (state.page === "assistant") render();
            return;
        }

        if (deterministicCandidate)
        {
            const fallback = typeof deterministicCandidate === "string"
                ? { text: deterministicCandidate, source: "knowledge", proposal: null }
                : deterministicCandidate;

            assistantUpdateInterpretationTrace(traceEntry, {
                mavArea: assistantIntentKnowledgeArea(interpreted),
                route: "Local AI → no matching intent handler → deterministic MAV fallback",
                outcome: "The interpreter result was not handled directly; the original request was routed through MAV's deterministic fallback."
            });
            assistantRuntime.history.push({
                role: "assistant",
                source: fallback.source || "knowledge",
                text: fallback.text || ""
            });
            assistantSetActiveProposal(fallback.proposal || null);
            assistantSetStatus("ready", assistantReadyLabel());
            if (state.page === "assistant") render();
            return;
        }

        assistantUpdateInterpretationTrace(traceEntry, {
            mavArea: assistantIntentKnowledgeArea(interpreted),
            route: "Local AI → MAV Knowledge",
            outcome: "No authoritative handler exists for this interpreted operation; clarification requested instead of inventing schema."
        });
        assistantRuntime.history.push({
            role: "assistant",
            source: interpreted ? "knowledge-ai" : "knowledge",
            text: assistantIntentClarification(interpreted)
        });
        assistantSetStatus("ready", assistantReadyLabel());
    }
    catch (error)
    {
        assistantStopThinkingStatus();
        console.warn("MAV Assistant intent interpretation failed; using deterministic fallback.", error);

        assistantUpdateInterpretationTrace(traceEntry, {
            pending: false,
            route: "Local AI interpreter error → deterministic MAV fallback",
            outcome: `Interpreter failed (${error?.message || error}); MAV did not trust or invent AI configuration output.`
        });

        if (deterministicCandidate)
        {
            const fallback = typeof deterministicCandidate === "string"
                ? { text: deterministicCandidate, source: "knowledge", proposal: null }
                : deterministicCandidate;
            assistantRuntime.history.push({
                role: "assistant",
                source: fallback.source || "knowledge",
                text: fallback.text || ""
            });
            assistantSetActiveProposal(fallback.proposal || null);
            assistantSetStatus("ready", assistantReadyLabel());
        }
        else
        {
            assistantRuntime.history.push({
                role: "assistant",
                source: "knowledge",
                text: "The local intent parser could not classify that request, and MAV Knowledge does not have a deterministic handler for it yet. I won't invent configuration details. Try naming the specific MAV object and property you want to inspect or change."
            });
            assistantSetStatus("ready", assistantReadyLabel());
        }
    }

    if (state.page === "assistant") render();
}

function renderAssistantProposal()
{
    const proposal = assistantRuntime.proposal;
    if (!proposal?.changes?.length) return "";

    return `
        <div class="assistant-proposal">
            <strong>Proposed working-definition change</strong>
            <div class="muted">${escapeHtml(proposal.summary || "Review these edits before applying them.")}</div>
            <div class="assistant-proposal-list">
                ${proposal.changes.map(change => `
                    <div class="assistant-proposal-item">
                        ${escapeHtml(change.op.toUpperCase())} ${escapeHtml(change.path)}
                        ${"value" in change ? `<br>${escapeHtml(JSON.stringify(change.value))}` : ""}
                    </div>`).join("")}
            </div>
            <div class="inline-actions">
                <button id="assistant-apply-proposal" class="btn good">Apply to Working Definition</button>
                <button id="assistant-dismiss-proposal" class="btn ghost">Dismiss</button>
            </div>
            <div class="muted">Applying marks the definition dirty only. It does not Save or deploy.</div>
        </div>`;
}

async function assistantCopyToClipboard(text, button)
{
    const value = String(text || "");
    if (!value) return;

    let copied = false;
    try
    {
        if (navigator.clipboard && window.isSecureContext)
        {
            await navigator.clipboard.writeText(value);
            copied = true;
        }
    }
    catch (_) { }

    if (!copied)
    {
        const fallback = document.createElement("textarea");
        fallback.value = value;
        fallback.setAttribute("readonly", "");
        fallback.style.position = "fixed";
        fallback.style.left = "-9999px";
        fallback.style.top = "0";
        document.body.appendChild(fallback);
        fallback.focus();
        fallback.select();
        try { copied = document.execCommand("copy"); }
        catch (_) { copied = false; }
        document.body.removeChild(fallback);
    }

    if (button)
    {
        const originalTitle = button.getAttribute("title") || "Copy";
        button.classList.toggle("copied", copied);
        button.setAttribute("title", copied ? "Copied" : "Copy failed");
        button.setAttribute("aria-label", copied ? "Copied" : "Copy failed");
        window.setTimeout(() =>
        {
            button.classList.remove("copied");
            button.setAttribute("title", originalTitle);
            const index = Number(button.dataset.assistantCopy);
            const message = Number.isInteger(index) ? assistantRuntime.history[index] : null;
            button.setAttribute("aria-label", message?.role === "assistant" ? "Copy response" : "Copy message");
        }, 1200);
    }
}

function bindAssistant()
{
    const input = document.getElementById("assistant-input");
    const send = document.getElementById("assistant-send");

    const submit = () =>
    {
        if (!input || !input.value.trim()) return;
        const text = input.value;
        input.value = "";
        assistantSendMessage(text);
    };

    if (send) send.onclick = submit;

    if (input)
    {
        input.onkeydown = event =>
        {
            if (event.key === "Enter" && !event.shiftKey)
            {
                event.preventDefault();
                submit();
            }
        };
    }

    document.querySelectorAll("[data-assistant-prompt]").forEach(button =>
    {
        button.onclick = () =>
        {
            if (input)
            {
                input.value = button.dataset.assistantPrompt || "";
                input.focus();
            }
        };
    });

    document.querySelectorAll("[data-assistant-copy]").forEach(button =>
    {
        button.onclick = () =>
        {
            const index = Number(button.dataset.assistantCopy);
            if (!Number.isInteger(index)) return;
            const message = assistantRuntime.history[index];
            if (!message) return;
            assistantCopyToClipboard(message.text, button);
        };
    });

    const apply = document.getElementById("assistant-apply-proposal");
    if (apply) apply.onclick = assistantApplyProposal;

    const dismiss = document.getElementById("assistant-dismiss-proposal");
    if (dismiss) dismiss.onclick = assistantDismissProposal;

    const transcript = document.getElementById("assistant-transcript");
    if (transcript) transcript.scrollTop = transcript.scrollHeight;
}

async function assistantSaveChatLogLocal()
{
    const filenameInput = document.getElementById("assistant-chat-export-name");
    const status = document.getElementById("assistant-chat-export-status");
    const saveButton = document.getElementById("assistant-chat-export-save");

    let filename = String(filenameInput?.value || assistantExportSuggestedFilename()).trim();
    if (!filename.toLowerCase().endsWith(".html")) filename += ".html";
    filename = filename.replace(/[\\/:*?"<>|]/g, "_");

    try
    {
        const html = assistantBuildChatExportHtml();
        const blob = new Blob([html], { type: "text/html;charset=utf-8" });

        if (saveButton) saveButton.disabled = true;
        if (status) status.textContent = "Preparing local file…";

        if (typeof window.showSaveFilePicker === "function")
        {
            try
            {
                const handle = await window.showSaveFilePicker({
                    suggestedName: filename,
                    types: [{
                        description: "MAV Assistant HTML chat log",
                        accept: { "text/html": [".html"] }
                    }]
                });
                const writable = await handle.createWritable();
                await writable.write(blob);
                await writable.close();
                if (status) status.textContent = "Saved locally. No cloud copy was created.";
                window.setTimeout(closeAssistantChatExport, 700);
                return;
            }
            catch (error)
            {
                if (error?.name === "AbortError")
                {
                    if (status) status.textContent = "Save canceled. No file was created.";
                    return;
                }
                console.warn("Local save picker unavailable; using browser download fallback.", error);
            }
        }

        // Fallback for browsers/secure-contexts without the File System Access API.
        // This still creates only a local browser download and performs no network request.
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        link.style.display = "none";
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1500);
        if (status) status.textContent = "Saved through the browser's local download flow. No cloud copy was created.";
        window.setTimeout(closeAssistantChatExport, 900);
    }
    catch (error)
    {
        console.error("MAV Assistant chat export failed.", error);
        if (status) status.textContent = `Could not save the local chat log: ${error?.message || error}`;
    }
    finally
    {
        if (saveButton && document.body.contains(saveButton)) saveButton.disabled = false;
    }
}

function escapeJsonEditorHtml(value)
{
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function highlightJsonLine(line, bracketState)
{
    let output = "";
    let index = 0;

    while (index < line.length)
    {
        const character = line[index];

        if (character === '"')
        {
            let end = index + 1;
            let escaped = false;

            while (end < line.length)
            {
                const current = line[end];

                if (escaped)
                {
                    escaped = false;
                }
                else if (current === "\\")
                {
                    escaped = true;
                }
                else if (current === '"')
                {
                    end += 1;
                    break;
                }

                end += 1;
            }

            const token = line.slice(index, end);
            let lookAhead = end;

            while (lookAhead < line.length && /\s/.test(line[lookAhead]))
            {
                lookAhead += 1;
            }

            const tokenClass =
                line[lookAhead] === ":"
                    ? "json-token-key"
                    : "json-token-string";

            output += `<span class="${tokenClass}">${escapeJsonEditorHtml(token)}</span>`;
            index = end;
            continue;
        }

        const numberMatch = line.slice(index).match(/^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?/);
        if (numberMatch)
        {
            output += `<span class="json-token-number">${numberMatch[0]}</span>`;
            index += numberMatch[0].length;
            continue;
        }

        const keywordMatch = line.slice(index).match(/^(?:true|false|null)\b/);
        if (keywordMatch)
        {
            output += `<span class="json-token-keyword">${keywordMatch[0]}</span>`;
            index += keywordMatch[0].length;
            continue;
        }

        if (character === "{" || character === "[")
        {
            const bracketClass =
                `json-token-bracket-${bracketState.depth % 3}`;

            output += `<span class="${bracketClass}">${character}</span>`;
            bracketState.depth += 1;
            index += 1;
            continue;
        }

        if (character === "}" || character === "]")
        {
            bracketState.depth = Math.max(0, bracketState.depth - 1);

            const bracketClass =
                `json-token-bracket-${bracketState.depth % 3}`;

            output += `<span class="${bracketClass}">${character}</span>`;
            index += 1;
            continue;
        }

        if (/^[,:]$/.test(character))
        {
            output += `<span class="json-token-punctuation">${escapeJsonEditorHtml(character)}</span>`;
            index += 1;
            continue;
        }

        output += escapeJsonEditorHtml(character);
        index += 1;
    }

    return output || "&nbsp;";
}

function highlightJsonDocumentLines(value)
{
    const bracketState = {depth: 0};

    return value
        .split("\n")
        .map(line => highlightJsonLine(line, bracketState));
}

function jsonEditorCursorPosition(textarea)
{
    const selectionStart = textarea.selectionStart || 0;
    const beforeCursor = textarea.value.slice(0, selectionStart);
    const line = beforeCursor.split("\n").length;
    const lastNewLine = beforeCursor.lastIndexOf("\n");
    const column = selectionStart - lastNewLine;

    return {
        line: line,
        column: column
    };
}

function syncJsonEditorScroll(textarea)
{
    const highlight = document.getElementById("json-highlight");
    const lineNumbers = document.getElementById("json-line-numbers");

    if (highlight)
    {
        highlight.scrollTop = textarea.scrollTop;
        highlight.scrollLeft = textarea.scrollLeft;
    }

    if (lineNumbers)
    {
        lineNumbers.scrollTop = textarea.scrollTop;
    }
}

function jsonEditorChangedLineIndexes(currentText)
{
    const baselineDefinition = state.baseline || state.processorBaseline;
    if (!baselineDefinition) return new Set();

    const baselineLines = JSON.stringify(baselineDefinition, null, 2).split("\n");
    const currentLines = String(currentText || "").split("\n");
    let prefix = 0;
    while (prefix < baselineLines.length && prefix < currentLines.length && baselineLines[prefix] === currentLines[prefix])
        prefix++;

    let baselineEnd = baselineLines.length - 1;
    let currentEnd = currentLines.length - 1;
    while (baselineEnd >= prefix && currentEnd >= prefix && baselineLines[baselineEnd] === currentLines[currentEnd])
    {
        baselineEnd--;
        currentEnd--;
    }

    const changed = new Set();
    if (currentEnd < prefix) return changed;

    const before = baselineLines.slice(prefix, baselineEnd + 1);
    const after = currentLines.slice(prefix, currentEnd + 1);

    // LCS keeps the change bar attached to the actual edited lines after insert/delete.
    // Large edits use a bounded fallback so typing in Advanced JSON never blocks the UI.
    if (before.length * after.length > 180000)
    {
        for (let line = prefix; line <= currentEnd; line++) changed.add(line);
        return changed;
    }

    const cols = after.length + 1;
    const table = Array.from({length: before.length + 1}, () => new Uint16Array(cols));
    for (let i = before.length - 1; i >= 0; i--)
    {
        for (let j = after.length - 1; j >= 0; j--)
        {
            table[i][j] = before[i] === after[j]
                ? table[i + 1][j + 1] + 1
                : Math.max(table[i + 1][j], table[i][j + 1]);
        }
    }

    const matchedCurrent = new Set();
    let i = 0;
    let j = 0;
    while (i < before.length && j < after.length)
    {
        if (before[i] === after[j])
        {
            matchedCurrent.add(j);
            i++;
            j++;
        }
        else if (table[i + 1][j] >= table[i][j + 1]) i++;
        else j++;
    }

    for (let local = 0; local < after.length; local++)
        if (!matchedCurrent.has(local)) changed.add(prefix + local);

    return changed;
}

function renderJsonChangeOverview(changedLines, totalLines)
{
    const overview = document.getElementById("json-change-overview");
    if (!overview) return;
    const indexes = [...changedLines].sort((a, b) => a - b);
    if (!indexes.length || !totalLines)
    {
        overview.innerHTML = "";
        return;
    }

    const ranges = [];
    let start = indexes[0];
    let end = start;
    for (let i = 1; i < indexes.length; i++)
    {
        if (indexes[i] === end + 1) end = indexes[i];
        else
        {
            ranges.push([start, end]);
            start = end = indexes[i];
        }
    }
    ranges.push([start, end]);

    overview.innerHTML = ranges.map(([from, to]) =>
    {
        const top = (from / totalLines) * 100;
        const height = ((to - from + 1) / totalLines) * 100;
        return `<span class="json-change-overview-marker" style="top:${top.toFixed(4)}%;height:max(2px,${height.toFixed(4)}%)"></span>`;
    }).join("");
}

function refreshJsonEditor(textarea)
{
    if (!textarea)
    {
        return;
    }

    const highlight = document.getElementById("json-highlight");
    const lineNumbers = document.getElementById("json-line-numbers");
    const cursorPosition = document.getElementById("json-cursor-position");

    if (!highlight || !lineNumbers)
    {
        return;
    }

    const cursor = jsonEditorCursorPosition(textarea);
    const lines = textarea.value.split("\n");
    const highlightedLines = highlightJsonDocumentLines(textarea.value);
    const changedLines = jsonEditorChangedLineIndexes(textarea.value);

    highlight.innerHTML = highlightedLines
        .map((line, index) =>
            `<span class="json-code-line ${index + 1 === cursor.line ? "active" : ""}">${line}</span>`)
        .join("");

    lineNumbers.innerHTML = lines
        .map((_, index) =>
        {
            const classes = ["json-line-number"];
            if (index + 1 === cursor.line) classes.push("active");
            if (changedLines.has(index)) classes.push("changed");
            return `<span class="${classes.join(" ")}"${changedLines.has(index) ? ` title="Changed from saved baseline"` : ""}>${index + 1}</span>`;
        })
        .join("");

    renderJsonChangeOverview(changedLines, lines.length);

    if (cursorPosition)
    {
        cursorPosition.textContent = `Ln ${cursor.line}, Col ${cursor.column}`;
    }

    syncJsonEditorScroll(textarea);
}
