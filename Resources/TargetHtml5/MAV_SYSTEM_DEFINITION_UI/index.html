/* =========================================================
   DISPLAYS
   ========================================================= */

function getConfiguredDisplays()
{
    return state.definition.MatrixSwitcher.Decoders
        .map((destination, index) => ({destination, index}))
        .filter(item => !!item.destination.Display);
}

function renderDisplays()
{
    const destinations = state.definition.MatrixSwitcher.Decoders;
    const configured = getConfiguredDisplays();
    const available = destinations
        .map((destination, index) => ({destination, index}))
        .filter(item => !item.destination.Display && item.destination.Type !== "Audio");

    const projectorCount = configured.filter(item =>
        (item.destination.Display.Type || "").toLowerCase() === "projector" ||
        item.destination.Type === "Projector").length;

    return `
        <div class="page-metrics">
            <div class="page-metric"><strong>${configured.length}</strong><span class="muted">Controlled displays</span></div>
            <div class="page-metric"><strong>${projectorCount}</strong><span class="muted">Projectors</span></div>
            <div class="page-metric"><strong>${available.length}</strong><span class="muted">Destinations without display control</span></div>
        </div>

        <div class="card">
            <div class="card-header">
                <div>
                    <h2>Displays</h2>
                    <div class="muted">
                        Physical display identity and control are stored on the destination decoder as Destination.Display.
                    </div>
                </div>
            </div>
            <div class="card-body">
                ${configured.length
                    ? `<div class="device-list">${configured.map(item => renderDisplayCard(item.destination, item.index)).join("")}</div>`
                    : `<div class="empty">No controlled displays are configured.</div>`}
            </div>
        </div>

        ${available.length ? `
        <div class="card">
            <div class="card-header"><h2>Available Destinations</h2></div>
            <div class="card-body">
                <div class="device-list">
                    ${available.map(item => `
                        <section class="device">
                            <header>
                                <strong>${escapeHtml(item.destination.Name || `Destination ${item.index + 1}`)}</strong>
                                <button class="btn primary small" data-attach-display="${item.index}">Configure Display</button>
                            </header>
                            <div class="device-body">
                                <div class="device-context">
                                    <span class="pill">${escapeHtml(item.destination.Type || "Destination")}</span>
                                    <span class="pill">IP ID ${escapeHtml(item.destination.IPID || "Not set")}</span>
                                </div>
                                <div class="muted">Attach physical display control to this decoder.</div>
                            </div>
                        </section>`).join("")}
                </div>
            </div>
        </div>` : ""}`;
}

function renderDisplayCard(destination, index)
{
    const display = destination.Display || {};
    const displayType = display.Type || (destination.Type === "Projector" ? "Projector" : "LCD");
    const brands = displayBrandsForType(displayType, display.Brand || "", display.Model || "");
    const brand = brands.includes(display.Brand) ? display.Brand : (brands[0] || "");
    const models = displayModelsForSelection(displayType, brand, display.Model || "");
    const model = display.Model && models.includes(display.Model) ? display.Model : "";
    const hasScreen = !!display.Screen;
    const basePath = `MatrixSwitcher.Decoders[${index}].Display`;

    return `
        <section class="device">
            <header>
                <strong>${escapeHtml(destination.Name || `Destination ${index + 1}`)}</strong>
                <div class="inline-actions">
                    <span class="pill">${escapeHtml(destination.Type || "Destination")}</span>
                    <span class="pill">IP ID ${escapeHtml(destination.IPID || "Not set")}</span>
                    <button class="btn danger small" data-detach-display="${index}">Remove Display Control</button>
                </div>
            </header>
            <div class="device-body">
                <div class="device-context">
                    <span class="pill good">Transport: decoder COM ${Number(display.ComPort || 1)}</span>
                    <span class="pill">Polling ${Number(display.PollingIntervalMs || 5000)} ms</span>
                </div>

                <div class="form-grid three">
                    <div class="field">
                        <label>Display Name</label>
                        <input data-display="${index}" data-key="Name" value="${escapeHtml(display.Name || destination.Name || "")}">
                        ${fieldValidation(`${basePath}.Name`)}
                    </div>
                    <div class="field">
                        <label>Display Type</label>
                        <select data-display="${index}" data-key="Type">${optionList(displayTypes, displayType)}</select>
                        ${fieldValidation(`${basePath}.Type`)}
                    </div>
                    <div class="field">
                        <label>Manufacturer</label>
                        <select data-display="${index}" data-key="Brand">${optionList(brands, brand)}</select>
                        ${fieldValidation(`${basePath}.Brand`)}
                    </div>
                    <div class="field">
                        <label>Model</label>
                        <select data-display="${index}" data-key="Model">${modelOptionList(models, model)}</select>
                        ${fieldValidation(`${basePath}.Model`)}
                    </div>
                    <div class="field">
                        <label>Exact / Unlisted Model</label>
                        <input data-display-model-custom="${index}" value="${escapeHtml(display.Model || "")}" placeholder="Enter exact model if not listed">
                        <div class="muted">Writing here sets Display.Model directly.</div>
                    </div>
                    <div class="field">
                        <label>Decoder COM Port</label>
                        <input type="number" min="1" max="8" data-display="${index}" data-key="ComPort" value="${Number(display.ComPort || 1)}">
                        ${fieldValidation(`${basePath}.ComPort`)}
                    </div>
                    <div class="field">
                        <label>Polling Interval (ms)</label>
                        <input type="number" min="250" step="250" data-display="${index}" data-key="PollingIntervalMs" value="${Number(display.PollingIntervalMs || 5000)}">
                        ${fieldValidation(`${basePath}.PollingIntervalMs`)}
                    </div>
                </div>

                ${displayType === "Projector" ? `
                    <div class="subsection">
                        <div class="subsection-title">Motorized Screen</div>
                        <label class="check">
                            <input type="checkbox" data-display-screen="${index}" ${hasScreen ? "checked" : ""}>
                            Configure screen relay control
                        </label>
                        ${hasScreen ? `
                            <div class="form-grid three" style="margin-top:12px">
                                <div class="field"><label>Screen Up Relay</label><input type="number" min="1" data-screen="${index}" data-key="UpRelay" value="${Number(display.Screen.UpRelay || 1)}"></div>
                                <div class="field"><label>Screen Down Relay</label><input type="number" min="1" data-screen="${index}" data-key="DownRelay" value="${Number(display.Screen.DownRelay || 2)}"></div>
                                <div class="field"><label>Relay Pulse (ms)</label><input type="number" min="100" step="100" data-screen="${index}" data-key="PulseMilliseconds" value="${Number(display.Screen.PulseMilliseconds || 500)}"></div>
                            </div>` : ""}
                    </div>` : ""}

                ${inlineValidationSummary(basePath)}
            </div>
        </section>`;
}


/* =========================================================
   CAMERAS
   ========================================================= */

function renderCameras()
{
    const cameras = state.definition.Cameras || [];
    const sources = state.definition.MatrixSwitcher.Encoders || [];
    const usedTransports = cameras.filter(camera => !!camera.TransportDeviceName).length;

    return `
        <div class="page-metrics">
            <div class="page-metric"><strong>${cameras.length}</strong><span class="muted">SDK cameras</span></div>
            <div class="page-metric"><strong>${usedTransports}</strong><span class="muted">Transport bindings</span></div>
            <div class="page-metric"><strong>${sources.length}</strong><span class="muted">Available source endpoints</span></div>
        </div>

        <div class="card">
            <div class="card-header">
                <div>
                    <h2>Cameras</h2>
                    <div class="muted">CameraDefinition fields: Name, Type, Brand, TransportDeviceName, control method, and transport settings.</div>
                </div>
                <button id="add-camera" class="btn primary">+ Add Camera</button>
            </div>
            <div class="card-body">
                ${cameras.length
                    ? `<div class="device-list">${cameras.map((camera, index) => renderCameraCard(camera, index)).join("")}</div>`
                    : `<div class="empty">No SDK cameras configured.<br><br><button id="add-camera-empty" class="btn primary">+ Add Camera</button></div>`}
            </div>
        </div>`;
}

function cameraTransportOptions(current)
{
    const names = (state.definition.MatrixSwitcher.Encoders || [])
        .map(source => source.Name)
        .filter(Boolean);
    if (current && !names.includes(current)) names.push(current);
    return names;
}

function renderCameraCard(camera, index)
{
    const basePath = `Cameras[${index}]`;
    const transports = cameraTransportOptions(camera.TransportDeviceName || "");
    const transportSource = (state.definition.MatrixSwitcher.Encoders || [])
        .find(source => source.Name === camera.TransportDeviceName);

    return `
        <section class="device">
            <header>
                <strong>${escapeHtml(camera.Name || `Camera ${index + 1}`)}</strong>
                <div class="inline-actions">
                    <span class="pill">${escapeHtml(camera.Type || "PTZ")}</span>
                    <span class="pill">${escapeHtml(camera.Brand || "Visca")}</span>
                    <button class="btn danger small" data-remove-camera="${index}">Delete</button>
                </div>
            </header>
            <div class="device-body">
                ${transportSource ? `
                <div class="device-context">
                    <span class="pill good">Transport source: ${escapeHtml(transportSource.Name)}</span>
                    <span class="pill">IP ID ${escapeHtml(transportSource.IPID || "Not set")}</span>
                    <span class="pill">COM ${Number(camera.ComPort || 1)}</span>
                </div>` : ""}

                <div class="form-grid three">
                    <div class="field">
                        <label>Name</label>
                        <input data-camera="${index}" data-key="Name" value="${escapeHtml(camera.Name || "")}">
                        ${fieldValidation(`${basePath}.Name`)}
                    </div>
                    <div class="field">
                        <label>Camera Type</label>
                        <select data-camera="${index}" data-key="Type">${optionList(["PTZ", "Fixed", "Tracking", "Other"], camera.Type || "PTZ")}</select>
                        ${fieldValidation(`${basePath}.Type`)}
                    </div>
                    <div class="field">
                        <label>Driver / Brand</label>
                        <select data-camera="${index}" data-key="Brand">${optionList(["Visca", "OneBeyond"], camera.Brand || "Visca")}</select>
                        ${fieldValidation(`${basePath}.Brand`)}
                    </div>
                    <div class="field">
                        <label>Transport Source</label>
                        <select data-camera="${index}" data-key="TransportDeviceName">
                            <option value="">Select source endpoint…</option>
                            ${optionList(transports, camera.TransportDeviceName || "")}
                        </select>
                        ${fieldValidation(`${basePath}.TransportDeviceName`)}
                    </div>
                    <div class="field">
                        <label>Control Method</label>
                        <select data-camera="${index}" data-key="ControlMethod">${optionList(["Serial", "IP"], camera.ControlMethod || "Serial")}</select>
                    </div>
                    ${(camera.ControlMethod || "Serial") === "IP" ? `
                    <div class="field">
                        <label>IP Address</label>
                        <input data-camera="${index}" data-key="IpAddress" value="${escapeHtml(camera.IpAddress || "")}" placeholder="192.168.1.100">
                    </div>
                    <div class="field">
                        <label>IP Port</label>
                        <input type="number" min="1" max="65535" data-camera="${index}" data-key="Port" value="${Number(camera.Port || 0) || ""}" placeholder="Optional">
                    </div>` : `
                    <div class="field">
                        <label>NVX COM Port</label>
                        <input type="number" min="1" max="8" data-camera="${index}" data-key="ComPort" value="${Number(camera.ComPort || 1)}">
                        ${fieldValidation(`${basePath}.ComPort`)}
                    </div>`}
                </div>
                ${inlineValidationSummary(basePath)}
            </div>
        </section>`;
}


/* =========================================================
   VTC / ATC
   ========================================================= */

function renderCommunications()
{
    const configured = [state.definition.VTC, state.definition.VtcFarm, state.definition.ATC].filter(Boolean).length;
    return `
        <div class="page-metrics">
            <div class="page-metric"><strong>${configured}</strong><span class="muted">Configured communications services</span></div>
            <div class="page-metric"><strong>${state.definition.VTC ? "Yes" : "No"}</strong><span class="muted">Local VTC</span></div>
            <div class="page-metric"><strong>${state.definition.VtcFarm?.Enabled ? "Yes" : "No"}</strong><span class="muted">VTC Farm</span></div>
            <div class="page-metric"><strong>${state.definition.ATC ? "Yes" : "No"}</strong><span class="muted">ATC</span></div>
        </div>
        ${renderVtcEditor()}
        ${renderVtcFarmEditor()}
        ${renderAtcEditor()}`;
}

function renderVtcEditor()
{
    const vtc = state.definition.VTC;
    if (!vtc)
    {
        return `
            <div class="card">
                <div class="card-header"><div><h2>Local VTC</h2><div class="muted">VTCDefinition</div></div></div>
                <div class="card-body"><div class="empty">No local VTC configured.<br><br><button id="add-vtc" class="btn primary">+ Configure VTC</button></div></div>
            </div>`;
    }

    const serial = vtc.SerialPort || {};
    const path = "VTC";
    const comm = vtc.CommunicationMethod || "Serial";

    return `
        <div class="card">
            <div class="card-header">
                <div><h2>Local VTC</h2><div class="muted">Codec identity, ownership path and transport.</div></div>
                <button id="remove-vtc" class="btn danger small">Remove VTC</button>
            </div>
            <div class="card-body">
                <div class="form-grid three">
                    <div class="field"><label>Name</label><input data-vtc data-key="Name" value="${escapeHtml(vtc.Name || "")}">${fieldValidation(`${path}.Name`)}</div>
                    <div class="field"><label>Type</label><input data-vtc data-key="Type" value="${escapeHtml(vtc.Type || "Codec")}">${fieldValidation(`${path}.Type`)}</div>
                    <div class="field"><label>Brand</label><input data-vtc data-key="Brand" value="${escapeHtml(vtc.Brand || "Cisco")}">${fieldValidation(`${path}.Brand`)}</div>

function assistantModelSettingLabel()
{
    const value = siteSettings.aiModelTier || "auto";
    if (value === "auto") return "Auto";
    return MAV_ASSISTANT_MODELS[value]?.label || "Auto";
}

function assistantModelTierChoice(value, title, description)
{
    const active = (siteSettings.aiModelTier || "auto") === value;
    return `
        <button class="setting-choice ${active ? "active" : ""}"
                data-ai-model-tier="${value}">
            <div class="setting-choice-title">
                <span>${title}</span>
                <span class="setting-check">✓</span>
            </div>
            <div class="setting-choice-description">${description}</div>
        </button>`;
}

function assistantHardwareProfile()
{
    return {
        cores: Number(navigator.hardwareConcurrency || 0),
        memoryGb: Number(navigator.deviceMemory || 0),
        webgpu: !!navigator.gpu
    };
}

async function assistantModelPackInstalled(model)
{
    if (!model) return false;
    const url = new URL(`${MAV_ASSISTANT_MODEL_ROOT}${model.id}/config.json`, window.location.href).href;
    try
    {
        const response = await fetch(url, { cache: "no-store" });
        return response.ok;
    }
    catch
    {
        return false;
    }
}

async function assistantResolveModelSelection()
{
    const requested = siteSettings.aiModelTier || "auto";

    if (requested !== "auto")
    {
        const model = MAV_ASSISTANT_MODELS[requested];
        if (model?.requiresWebGpu && !navigator.gpu)
        {
            throw new Error(`${model.label} requires WebGPU in this browser. Choose Balanced or Compatibility instead.`);
        }
        if (!await assistantModelPackInstalled(model))
        {
            throw new Error(`${model?.label || requested} model pack is not installed under the shared /ai/models folder.`);
        }
        return model;
    }

    const hw = assistantHardwareProfile();
    const installed = {};
    for (const tier of ["quality", "balanced", "compat"])
    {
        installed[tier] = await assistantModelPackInstalled(MAV_ASSISTANT_MODELS[tier]);
    }

    // Quality is deliberately conservative: it is a ~1 GB+ optional pack and should
    // only auto-select when the browser advertises WebGPU plus reasonably strong host hints.
    if (installed.quality && hw.webgpu && hw.cores >= 8 && (!hw.memoryGb || hw.memoryGb >= 8))
    {
        return MAV_ASSISTANT_MODELS.quality;
    }

    if (installed.balanced && hw.cores >= 4 && (!hw.memoryGb || hw.memoryGb >= 4))
    {
        return MAV_ASSISTANT_MODELS.balanced;
    }

    if (installed.compat) return MAV_ASSISTANT_MODELS.compat;
    if (installed.balanced) return MAV_ASSISTANT_MODELS.balanced;
    if (installed.quality) return MAV_ASSISTANT_MODELS.quality;

    throw new Error("No MAV Assistant model pack is installed under the shared /ai/models folder.");
}

function assistantResetLoadedModel()
{
    const generator = assistantRuntime.generator;
    assistantRuntime.generator = null;
    assistantRuntime.loadedModel = null;
    assistantRuntime.selectedModel = null;
    assistantRuntime.loadingPromise = null;
    assistantStopThinkingStatus();

    try
    {
        const result = generator?.dispose?.();
        if (result?.catch) result.catch(() => {});
    }
    catch
    {
        // Model disposal is best-effort; reloading the page always clears it.
    }

    assistantSetStatus("idle", "Local assistant ready");
}

function assistantReadyLabel()
{
    return assistantRuntime.loadedModel
        ? `Local model ready · ${assistantRuntime.loadedModel.shortLabel}`
        : "Local assistant ready";
}

function assistantSetStatus(status, label, error = null, progress = null)
{
    assistantRuntime.status = status;
    assistantRuntime.statusLabel = label;
    assistantRuntime.error = error;
    assistantRuntime.statusProgress = Number.isFinite(progress)
        ? Math.max(0, Math.min(100, progress))
        : null;

    const top = document.getElementById("assistant-top-status");
    if (top) top.textContent = label;

    const badge = document.getElementById("assistant-runtime-status");
    if (badge) badge.textContent = label;

    assistantRefreshActivityUi();
}

function assistantIsBusy()
{
    return assistantRuntime.status === "loading" ||
        assistantRuntime.status === "thinking";
}

function assistantRefreshActivityUi()
{
    const activity = document.getElementById("assistant-activity");
    if (!activity) return;

    const busy = assistantIsBusy();
    activity.classList.toggle("active", busy);
    activity.setAttribute("aria-hidden", busy ? "false" : "true");

    const label = document.getElementById("assistant-activity-label");
    if (label) label.textContent = assistantRuntime.statusLabel;

    const detail = document.getElementById("assistant-activity-detail");
    if (detail)
    {
        if (assistantRuntime.status === "loading" && Number.isFinite(assistantRuntime.statusProgress))
        {
            detail.textContent = `${Math.round(assistantRuntime.statusProgress)}%`;
        }
        else if (assistantRuntime.status === "thinking" && assistantRuntime.thinkingStartedAt)
        {
            const elapsed = Math.max(0, Math.round((Date.now() - assistantRuntime.thinkingStartedAt) / 1000));
            detail.textContent = `${elapsed}s · local CPU`;
        }
        else
        {
            detail.textContent = "";
        }
    }

    const progress = document.getElementById("assistant-progress");
    const fill = document.getElementById("assistant-progress-fill");
    if (progress && fill)
    {
        const determinate = assistantRuntime.status === "loading" &&
            Number.isFinite(assistantRuntime.statusProgress);

        progress.classList.toggle("indeterminate", busy && !determinate);
        fill.style.width = determinate
            ? `${assistantRuntime.statusProgress}%`
            : "";
    }
}

function assistantStartThinkingStatus(customMessages = null)
{
    assistantStopThinkingStatus();

    const messages = Array.isArray(customMessages) && customMessages.length
        ? customMessages
        : [
            "Reading the current SystemDefinition…",
            "Reviewing MAV configuration context…",
            "Checking validation and relationships…",
            "Reasoning locally…",
            "Preparing a concise response…"
        ];

    assistantRuntime.thinkingStep = 0;
    assistantRuntime.thinkingStartedAt = Date.now();
    assistantSetStatus("thinking", messages[0]);

    assistantRuntime.thinkingTimer = window.setInterval(() =>
    {
        assistantRuntime.thinkingStep = Math.min(
            assistantRuntime.thinkingStep + 1,
            messages.length - 1);

        assistantSetStatus(
            "thinking",
            messages[assistantRuntime.thinkingStep]);
    }, 1800);
}

function assistantStopThinkingStatus()
{
    if (assistantRuntime.thinkingTimer)
    {
        clearInterval(assistantRuntime.thinkingTimer);
        assistantRuntime.thinkingTimer = null;
    }

    assistantRuntime.thinkingStartedAt = 0;
    assistantRuntime.thinkingStep = 0;
}

function assistantCompactConfiguration()
{
    const definition = state.definition || {};
    const matrix = definition.MatrixSwitcher || {};

    const pick = (value, keys) =>
    {
        if (!value || typeof value !== "object") return value;
        const result = {};
        keys.forEach(key =>
        {
            if (value[key] !== undefined && value[key] !== null && value[key] !== "")
            {
                result[key] = value[key];
            }
        });
        return result;
    };

    return {
        Name: definition.Name || "",
        TouchPanel: definition.TouchPanel
            ? pick(definition.TouchPanel, ["SmartGraphicsFileName", "DestinationDisplaysUiType", "DisplayControlsUiType"])
            : undefined,
        MatrixSwitcher: {
            Name: matrix.Name || "",
            Type: matrix.Type || "",
            Encoders: (matrix.Encoders || []).map(item =>
                pick(item, ["Name", "Type", "IPID", "UsbLocalId", "VideoStreamLocation", "VideoMulticastAddress", "AudioSessionName"])),
            Decoders: (matrix.Decoders || []).map(item =>
            {
                const result = pick(item, ["Name", "Type", "IPID", "UsbLocalId"]);
                if (item?.Display)
                {
                    result.Display = pick(item.Display, ["Name", "Type", "Brand", "Model", "ComPort", "PollingIntervalMs"]);
                }
                return result;
            })
        },
        Cameras: (definition.Cameras || []).map(item =>
            pick(item, ["Name", "Type", "Brand", "TransportDeviceName", "ComPort"])),
        VTC: definition.VTC
            ? pick(definition.VTC, ["Name", "Type", "Brand", "ControlPath", "CommunicationMethod", "IpAddress", "Port", "SerialPort"])
            : undefined,
        ATC: definition.ATC
            ? pick(definition.ATC, ["Name", "Type", "Brand", "ControlPath", "CommunicationMethod", "IpAddress", "Port", "SerialPort", "ChannelName"])
            : undefined,
        Dsp: definition.Dsp
            ? {
                ...pick(definition.Dsp, ["Name", "Type", "IpAddress", "PollingIntervalMs"]),
                Faders: (definition.Dsp.Faders || []).map(item => pick(item, ["Name", "ControlId"])),
                Buttons: (definition.Dsp.Buttons || []).map(item => pick(item, ["Name", "ControlId", "Type"])),
                Devices: (definition.Dsp.Devices || []).map(item => ({
                    ...pick(item, ["Name", "Type"]),
                    Functions: (item.Functions || []).map(fn => pick(fn, ["Name", "ControlId"]))
                }))
            }
            : undefined
    };
}

function assistantCompactContext()
{
    const summary = assistantDefinitionSummary();
    const validationItems = allValidationItems()
        .slice(0, 12)
        .map(item => ({
            severity: item._severity,
            path: item.Path || "",
            code: item.Code || "",
            message: item.Message || ""
        }));

    let context = JSON.stringify({
        summary,
        validation: validationItems,
        configuration: assistantCompactConfiguration()
    });

    if (context.length > MAV_ASSISTANT_MAX_CONTEXT_CHARS)
    {
        context = context.slice(0, MAV_ASSISTANT_MAX_CONTEXT_CHARS) + "…[context truncated]";
    }

    return context;
}

function assistantIntentSystemPrompt()
{
    return `You are the private intent planner for MAV Assistant. You NEVER answer the operator's question.
Your only job is to translate the request into a compact machine-readable plan for MAV Knowledge.

The assistant turn is already prefixed with: {"operations":[
CONTINUE that JSON only. Do not repeat the prefix. Do not write prose, markdown, bullets, or explanations.
Finish the operations array and the outer object.

Each operation has this schema:
{"mode":"guidance|proposal","intent":"...","domain":"...","target":null,"reference":null,"property":null,"value":null,"attributes":{},"confidence":0.0}

Allowed intent values: explain, inspect, modify, add, remove, clone, list_options, navigate, validate, review, unknown.
Allowed domain values: system, source, destination, display, camera, dsp, fader, button, dsp_device, vtc, atc, unknown.
NEVER use a brand, model, action verb, or device nickname as mode/domain. mode may ONLY be guidance or proposal. domain may ONLY be one of the allowed domain values above.

Rules:
- mode is REQUIRED on every operation. Use mode="guidance" when the operator is asking how, where, what, why, or for an explanation without asking MAV to prepare a change. Use mode="proposal" when the operator asks MAV to add, change, modify, remove, clone, configure, set, or otherwise prepare a SystemDefinition change for review.
- Distinguish "how do I add a display?" (guidance) from "help me add a display" or "add a display" (proposal).
- A request may contain MULTIPLE linked operations. Emit one operation per MAV object/action in the order they should be resolved.
- Do not invent MAV fields, JSON paths, device models, IP IDs, addresses, or values.
- target is a named MAV object explicitly requested, such as "Confidence Monitor" or "Speakers".
- reference preserves phrases such as "first destination", "new destination", "the speakers", or "current display" when useful.
- property/value are for a single explicit property change. For adds with several explicit facts, use attributes.
- attributes may contain only facts explicitly requested or direct MAV vocabulary mappings. Never guess missing required values.
- "NVX decoder" maps to domain=destination. NVX describes the matrix transport; do NOT set destination Type to NVX.
- A confidence-monitor destination normally maps to destination Type="Monitor" only when the operator clearly describes a monitor destination.
- A controlled physical screen attached to a destination maps to domain=display.
- "NEC monitor" maps to display Brand="NEC" and Type="LCD"; do not invent a model.
- "audio channel", "volume control", "level control", or "volume thing" normally maps to domain=fader when about a named DSP level.
- mute/toggle actions normally map to domain=button.
- If the request asks whether configuration/design is valid, emit validate/system.
- If it asks for a summary/review, emit review/system.
- "what models are available" while a display is the subject maps to list_options/display property=Model.
- confidence is 0.0 to 1.0 for each operation. The outer confidence is your confidence in the plan as a whole.

Examples. Remember: your actual response continues after {"operations":[

User: how do I modify the faders in the config file?
Continuation: {"mode":"guidance","intent":"explain","domain":"fader","target":null,"reference":null,"property":null,"value":null,"attributes":{},"confidence":0.98}],"confidence":0.98}

User: change Speakers ControlId to MainProgramGain
Continuation: {"mode":"proposal","intent":"modify","domain":"fader","target":"Speakers","reference":null,"property":"ControlId","value":"MainProgramGain","attributes":{},"confidence":0.99}],"confidence":0.99}

User: change the first destination display model to M651
Continuation: {"mode":"proposal","intent":"modify","domain":"display","target":null,"reference":"first destination","property":"Model","value":"M651","attributes":{},"confidence":0.99}],"confidence":0.99}

User: help me add a NVX decoder for a confidence monitor display. I want it to be a NEC monitor.
Continuation: {"mode":"proposal","intent":"add","domain":"destination","target":"Confidence Monitor","reference":"NVX decoder","property":null,"value":null,"attributes":{"Name":"Confidence Monitor","Type":"Monitor"},"confidence":0.98},{"mode":"proposal","intent":"add","domain":"display","target":"Confidence Monitor","reference":"attach to new destination","property":null,"value":null,"attributes":{"Type":"LCD","Brand":"NEC"},"confidence":0.97}],"confidence":0.97}`;
}

function assistantAllowedAttributesForDomain(domain)
{
    const allowed = {
        system: new Set(["Name"]),
        source: new Set(["Name", "Type", "IPID", "VideoStreamLocation", "VideoMulticastAddress", "AudioSessionName", "UsbLocalId"]),
        destination: new Set(["Name", "Type", "IPID", "UsbLocalId"]),
        display: new Set(["Name", "Type", "Brand", "Model", "ComPort", "PollingIntervalMs"]),
        camera: new Set(["Name", "Type", "Brand", "TransportDeviceName", "ControlMethod", "ComPort", "IpAddress", "Port"]),
        dsp: new Set(["Name", "Type", "IpAddress", "PollingIntervalMs"]),
        fader: new Set(["Name", "ControlId", "RepeatIntervalMs"]),
        button: new Set(["Name", "ControlId", "Type"]),
        dsp_device: new Set(["Name", "Type"]),
        vtc: new Set(["Name", "Type", "Brand", "IpAddress", "ComPort"]),
        atc: new Set(["Name", "Type", "Brand", "IpAddress", "ComPort"])
    };
    return allowed[String(domain || "unknown")] || new Set();
}

function assistantNormalizeIntentOperation(parsed)
{
    if (!parsed || typeof parsed !== "object") return null;
    const intent = MAV_ASSISTANT_INTENTS.has(String(parsed.intent || "").toLowerCase())
        ? String(parsed.intent).toLowerCase()
        : "unknown";
    const domain = MAV_ASSISTANT_DOMAINS.has(String(parsed.domain || "").toLowerCase())
        ? String(parsed.domain).toLowerCase()
        : "unknown";
    const confidence = Number(parsed.confidence);
    const rawAttributes = parsed.attributes && typeof parsed.attributes === "object" && !Array.isArray(parsed.attributes)
        ? parsed.attributes
        : {};
    const allowedAttributes = assistantAllowedAttributesForDomain(domain);
    const attributes = {};
    Object.entries(rawAttributes).forEach(([key, value]) => {
        if (allowedAttributes.has(key) && value !== undefined) attributes[key] = value;
    });

    const parsedMode = String(parsed.mode || parsed.requestMode || "").toLowerCase();
    const mode = parsedMode === "guidance" || parsedMode === "proposal"
        ? parsedMode
        : (["add", "modify", "remove", "clone"].includes(intent) ? "proposal" : "guidance");

    return {
        mode,
        intent,
        domain,
        target: parsed.target == null ? null : String(parsed.target),
        reference: parsed.reference == null ? null : String(parsed.reference),
        property: parsed.property == null ? null : String(parsed.property),
        value: parsed.value == null ? null : parsed.value,
        attributes,
        confidence: Number.isFinite(confidence) ? Math.max(0, Math.min(1, confidence)) : 0.5
    };
}

function assistantIntentOperationIsStructurallyValid(op)
{
    if (!op || typeof op !== "object") return false;
    if (!op.intent || op.intent === "unknown") return false;
    if (!op.domain || op.domain === "unknown") return false;
    if (op.mode !== "guidance" && op.mode !== "proposal") return false;
    return true;
}

function assistantCatalogBrandFromText(userText)
{
    const text = String(userText || "").toLowerCase();
    const brands = new Set();
    Object.values(state.displayCatalog || {}).forEach(brandMap =>
        Object.keys(brandMap || {}).forEach(brand => brands.add(brand)));
    return [...brands]
        .sort((a, b) => b.length - a.length)
        .find(brand => text.includes(String(brand).toLowerCase())) || null;
}

function assistantInferRequestMode(userText)
{
    const text = String(userText || "").trim().toLowerCase();

    // Explicit how-to / explanation language wins, even when the sentence also
    // contains mutation verbs such as add/change/remove.
    const guidance = /\b(?:how\s+(?:do|can|would|should)\s+i|how\s+to|tell\s+me\s+how|show\s+me\s+how|where\s+do\s+i|what\s+(?:do|should)\s+i\s+(?:change|set|configure)|explain|walk\s+me\s+through|show\s+me\s+where)\b/.test(text);
    if (guidance) return "guidance";

    // Proposal language asks MAV to prepare a concrete working-definition change.
    const proposal = /\b(?:help\s+me\s+(?:add|change|modify|remove|configure|set|create|clone)|please\s+(?:add|change|modify|remove|configure|set|create|clone)|(?:can|could|would)\s+you\s+(?:add|change|modify|remove|configure|set|create|clone)|i\s+want\s+you\s+to\s+(?:add|change|modify|remove|configure|set|create|clone))\b/.test(text)
        || /^(?:add|change|modify|remove|configure|set|create|clone)\b/.test(text);
    if (proposal) return "proposal";

    return "guidance";
}

function assistantRecoverIntentPlan(userText, rawOutput = "")
{
    const text = String(userText || "").trim();
    const lower = text.toLowerCase();
    const operations = [];

    const addDecoder = /\b(?:add|create|new|configure)\b[\s\S]{0,50}\b(?:nvx\s+)?(?:decoder|destination)\b/.test(lower) ||
        /\b(?:decoder|destination)\b[\s\S]{0,50}\b(?:add|create|new)\b/.test(lower);
    const mentionsDisplay = /\b(?:display|monitor|screen)\b/.test(lower);

    if (addDecoder)
    {
        let target = null;
        const named = text.match(/\bfor\s+(?:an?\s+)?([A-Za-z0-9 _-]{2,48}?)(?:\s+display|\s+monitor|[,.]|$)/i);
        if (named) target = named[1].trim().replace(/\s+/g, " ");
        if (target && !/monitor$/i.test(target) && /confidence\s+monitor/i.test(text)) target = "Confidence Monitor";
        if (!target && /confidence\s+monitor/i.test(text)) target = "Confidence Monitor";

        const attrs = {};
        if (target) attrs.Name = target;
        if (/\bmonitor\b/i.test(text)) attrs.Type = "Monitor";

        operations.push({
            mode: assistantInferRequestMode(text),
            intent: "add",
            domain: "destination",
            target,
            reference: /\bnvx\b/i.test(text) ? "NVX decoder" : "decoder",
            property: null,
            value: null,
            attributes: attrs,
            confidence: 0.88
        });
    }

    if (mentionsDisplay && (addDecoder || /\b(?:add|attach|configure|new)\b[\s\S]{0,50}\b(?:display|monitor|screen)\b/.test(lower)))
    {
        const brand = assistantCatalogBrandFromText(text) || (/\bnec\b/i.test(text) ? "NEC" : null);
        const target = operations[0]?.target || (/confidence\s+monitor/i.test(text) ? "Confidence Monitor" : null);
        const attrs = {};
        if (/\bmonitor\b/i.test(text)) attrs.Type = "LCD";
        if (brand) attrs.Brand = brand;
        operations.push({
            mode: assistantInferRequestMode(text),
            intent: "add",
            domain: "display",
            target,
            reference: addDecoder ? "attach to new destination" : "current destination",
            property: null,
            value: null,
            attributes: attrs,
            confidence: 0.86
        });
    }

    // DSP compound controls: a natural request can add both a level control and a mute action.
    const dspAddVerb = /\b(?:add|create|configure|new)\b/.test(lower);
    if (dspAddVerb && /\bfader\b/.test(lower))
    {
        const assisted = /assisted\s+listening/i.test(text);
        const name = assisted ? "Assisted Listening" : ((text.match(/add\s+(?:an?\s+)?(.{2,48}?)\s+fader\b/i) || [])[1] || "New Fader").trim();
        if (!operations.some(op => op.domain === "fader"))
            operations.push({ mode: assistantInferRequestMode(text), intent: "add", domain: "fader", target: name, reference: "DSP fader", property: null, value: null, attributes: {Name:name, RepeatIntervalMs:50}, confidence: 0.88 });
        if (/\b(?:mute|mute control|button)\b/.test(lower) && !operations.some(op => op.domain === "button"))
            operations.push({ mode: assistantInferRequestMode(text), intent: "add", domain: "button", target: `${name} Mute`, reference: "DSP mute control", property: null, value: null, attributes: {Name:`${name} Mute`, Type:"Toggle"}, confidence: 0.87 });
    }

    if (!operations.length && /\bfader\b/.test(lower))
    {
        operations.push({ mode: assistantInferRequestMode(text), intent: /\b(change|set|update|modify)\b/.test(lower) ? "modify" : "explain", domain: "fader", target: null, reference: null, property: null, value: null, attributes: {}, confidence: 0.80 });
    }

    // Common AV object additions. The local model can refine these; recovery keeps the request actionable.
    if (!operations.length && dspAddVerb && /\b(?:source|encoder)\b/.test(lower))
    {
        const roleMatch = text.match(/\bfor\s+(?:an?\s+)?(.+?)(?:\s+using\b|\s+with\b|\s+controlled\b|$)/i);
        const encoderMatch = text.match(/add\s+(?:an?\s+)?(.{2,48}?)\s+(?:source|encoder)\b/i);
        let name = roleMatch?.[1]?.trim() || encoderMatch?.[1]?.trim() || "New Source";
        name = name.replace(/\b(?:nvx)\b/ig, "").replace(/\s+/g," ").trim();
        if (!name || /^(?:an?|the)$/i.test(name)) name = /camera/i.test(text) ? "Camera Source" : "New Source";
        name = name.replace(/\bone\s+beyond\b/ig,"OneBeyond").replace(/\b\w/g,m=>m.toUpperCase());
        const isCamera=/\bcamera\b/i.test(text);
        operations.push({mode:assistantInferRequestMode(text),intent:"add",domain:"source",target:name,reference:/nvx/i.test(text)?"NVX encoder":"source encoder",property:null,value:null,attributes:{Name:name,Type:isCamera?"Camera":(/iptv/i.test(text)?"IPTV":"Computer")},confidence:.86});
        if (isCamera)
        {
            const brand=/one\s*beyond/i.test(text)?"OneBeyond":(/visca/i.test(text)?"Visca":"Visca");
            const serial=/\bserial\b|\bcom\s*port\b/i.test(text);
            const ipControl=/\bip\s*(?:control|controlled)\b|\bnetwork\s*control\b/i.test(text);
            operations.push({mode:assistantInferRequestMode(text),intent:"add",domain:"camera",target:name,reference:"attach to new encoder",property:null,value:null,attributes:{Name:name,Type:"PTZ",Brand:brand,TransportDeviceName:name,ControlMethod:ipControl?"IP":"Serial",ComPort:serial?1:1,IpAddress:"",Port:0},confidence:.85});
        }
    }
    if (!operations.length && dspAddVerb && /\bcamera\b/.test(lower))
    {
        const m=text.match(/add\s+(?:an?\s+)?(.{2,48}?)\s+camera\b/i);
        const name=m?m[1].trim():"New Camera";
        operations.push({mode:assistantInferRequestMode(text),intent:"add",domain:"camera",target:name,reference:"camera",property:null,value:null,attributes:{Name:name,Type:/fixed/i.test(text)?"Fixed":(/tracking/i.test(text)?"Tracking":"PTZ")},confidence:.84});
    }
    if (!operations.length && dspAddVerb && /\b(?:dsp\s+device|mxa|microphone array)\b/.test(lower))
    {
        const name=/assisted\s+listening/i.test(text)?"Assisted Listening Device":"DSP Device";
        operations.push({mode:assistantInferRequestMode(text),intent:"add",domain:"dsp_device",target:name,reference:"DSP device",property:null,value:null,attributes:{Name:name,Type:/mxa/i.test(text)?"ShureMXA":"ShureMXA"},confidence:.82});
    }
    if (!operations.length && dspAddVerb && /\bvtc\b|\bvideo\s+(?:teleconference|conference)\b|\bcodec\b/.test(lower))
    {
        operations.push({mode:assistantInferRequestMode(text),intent:"add",domain:"vtc",target:"Room VTC",reference:"VTC endpoint",property:null,value:null,attributes:{Name:"Room VTC",Type:"Codec"},confidence:.82});
    }
    if (!operations.length && dspAddVerb && /\batc\b|\baudio\s+(?:teleconference|conference)\b|\bvoip\b/.test(lower))
    {
        operations.push({mode:assistantInferRequestMode(text),intent:"add",domain:"atc",target:"Room ATC",reference:"ATC endpoint",property:null,value:null,attributes:{Name:"Room ATC",Type:"VoIPDialer"},confidence:.82});
    }

    if (!operations.length) return null;
    const confidence = Math.min(...operations.map(x => x.confidence));
    const primary = operations[0];
    return {
        intent: operations.length > 1 ? "compound" : primary.intent,
        domain: operations.length > 1 ? "compound" : primary.domain,
        target: primary.target,
        reference: primary.reference,
        property: primary.property,
        value: primary.value,
        confidence,
        requestMode: operations.some(x => x.mode === "proposal") ? "proposal" : "guidance",
        operations,
        parseMode: "recovered"
    };
}

function assistantParseIntentJson(text, userText = "")
{
    let value = String(text || "")
        .replace(/<\|endoftext\|>/gi, "")
        .replace(/<\|im_end\|>/gi, "")
        .replace(/```(?:json)?/gi, "")
        .trim();

    const prefix = '{"operations":[';
    const candidates = [];
    if (value) candidates.push(value);
    if (value && !value.startsWith(prefix)) candidates.push(prefix + value);

    for (const candidate0 of candidates)
    {
        let candidate = candidate0.trim();
        const first = candidate.indexOf("{");
        const last = candidate.lastIndexOf("}");
        if (first < 0 || last <= first) continue;
        candidate = candidate.slice(first, last + 1);

        try
        {
            const parsed = JSON.parse(candidate);
            let operationsRaw = Array.isArray(parsed.operations)
                ? parsed.operations
                : (parsed.intent || parsed.domain ? [parsed] : []);
            if (!operationsRaw.length || operationsRaw.length > 6) continue;

            const normalizedAll = operationsRaw.map(assistantNormalizeIntentOperation);
            // Tiny compatibility models sometimes emit plausible JSON containing invalid MAV
            // domains/modes. Treat any structural violation as an untrusted plan and use the
            // deterministic recovery layer instead of partially accepting model garbage.
            if (normalizedAll.some(op => !assistantIntentOperationIsStructurallyValid(op))) continue;

            const deterministicMode = assistantInferRequestMode(userText);
            const operations = normalizedAll
                .map(op => ({ ...op, mode: deterministicMode }))
                .slice(0, 6);
            if (!operations.length) continue;

            const declaredConfidence = Number(parsed.confidence);
            const confidence = Number.isFinite(declaredConfidence)
                ? Math.max(0, Math.min(1, declaredConfidence))
                : Math.min(...operations.map(x => x.confidence));
            const primary = operations[0];
            return {
                intent: operations.length > 1 ? "compound" : primary.intent,
                domain: operations.length > 1 ? "compound" : primary.domain,
                target: primary.target,
                reference: primary.reference,
                property: primary.property,
                value: primary.value,
                confidence,
                requestMode: deterministicMode,
                operations,
                parseMode: "json"
            };
        }
        catch {}
    }

    return assistantRecoverIntentPlan(userText, value);
}

async function assistantInterpretRequest(userText)
{
    const generator = await loadMavAssistant();
    const prompt = assistantBuildIntentPrompt(userText);
    const activeModel = assistantRuntime.loadedModel || MAV_ASSISTANT_MODELS.compat;

    assistantStartThinkingStatus([
        "Interpreting request locally…",
        "Identifying MAV operations…",
        "Mapping language to MAV concepts…"
    ]);
    renderAssistantRuntimeBits();
    assistantRefreshActivityUi();
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    const output = await generator(prompt, {
        max_new_tokens: Math.min(Math.max(activeModel.maxNewTokens + 60, 140), 220),
        do_sample: false,
        repetition_penalty: 1.04,
        return_full_text: false
    });

    assistantStopThinkingStatus();
    let generated = output?.[0]?.generated_text ?? "";
    if (typeof generated !== "string") generated = String(generated ?? "");
    generated = assistantSanitizeGeneratedText(generated, prompt, userText);

    const parsed = assistantParseIntentJson(generated, userText);
    assistantRuntime.lastIntent = parsed;
    assistantRuntime.lastInterpretation = {
        modelId: activeModel.id,
        modelLabel: activeModel.label,
        rawOutput: generated,
        parsed: parsed ? JSON.parse(JSON.stringify(parsed)) : null
    };
    return parsed;
}

function assistantIntentKnowledgeArea(intent)
{

        ? intent.operations
        : (intent ? [intent] : []);
    const areaFor = domain => ({
        system: "SystemDefinition root / validation state",
        source: "MatrixSwitcher.Encoders[]",
        destination: "MatrixSwitcher.Decoders[]",
        display: "MatrixSwitcher.Decoders[].Display",
        camera: "Cameras[]",
        dsp: "Dsp",
        fader: "Dsp.Faders[]",
        button: "Dsp.Buttons[]",
        dsp_device: "Dsp.Devices[]",
        vtc: "VTC / VtcFarm",
        atc: "ATC"
    }[String(domain || "unknown")] || null);
    const areas = [...new Set(operations.map(op => areaFor(op.domain)).filter(Boolean))];
    return areas.length ? areas.join(" + ") : "No authoritative MAV schema area selected";
}

function assistantIntentFieldSummary(intent, field)
{
    const operations = Array.isArray(intent?.operations) && intent.operations.length
        ? intent.operations
        : (intent ? [intent] : []);
    const values = [];
    operations.forEach(op => {
        const direct = op?.[field];
        if (direct != null && direct !== "")
        {
            values.push(typeof direct === "string" ? direct : JSON.stringify(direct));
            return;
        }
        const attrs = op?.attributes && typeof op.attributes === "object" ? op.attributes : {};
        const entries = Object.entries(attrs);
        if (!entries.length) return;
        if (field === "property") values.push(entries.map(([key]) => key).join(", "));
        if (field === "value") values.push(entries.map(([key, value]) => `${key}=${typeof value === "string" ? value : JSON.stringify(value)}`).join("; "));
    });
    return [...new Set(values)].join(" + ") || null;
}

function assistantIntentAttributesSummary(intent)
{
    const operations = Array.isArray(intent?.operations) && intent.operations.length
        ? intent.operations
        : (intent ? [intent] : []);
    const values = operations
        .filter(op => op?.attributes && Object.keys(op.attributes).length)
        .map(op => `${op.domain}: ${JSON.stringify(op.attributes)}`);
    return values.join(" | ") || null;
}

function assistantIntentRoutingLabel(intent)
{
    const operations = Array.isArray(intent?.operations) && intent.operations.length
        ? intent.operations
        : (intent ? [intent] : []);
    if (!operations.length) return "Local AI → MAV Knowledge clarification";

    const intents = new Set(operations.map(op => op?.intent).filter(Boolean));
    const requestMode = intent?.requestMode || (operations.some(op => op?.mode === "proposal") ? "proposal" : "guidance");
    if (requestMode === "proposal")
        return "Local AI → proposal workflow → resolve required values";
    if (intents.has("validate")) return "Local AI → validate current SystemDefinition";
    if (intents.has("review") || intents.has("inspect")) return "Local AI → inspect current SystemDefinition";
    if (intents.has("navigate")) return "Local AI → navigate MAV editor";
    if (intents.has("list_options")) return "Local AI → resolve MAV catalog/options";
    return "Local AI → resolve against authoritative MAV Knowledge";
}

function assistantOperationDefaultProvenance(op)
{
    const attrs = op?.attributes && typeof op.attributes === "object" ? op.attributes : {};
    const defaults = [];
    if (op?.domain === "fader" && Number(attrs.RepeatIntervalMs) === 50) defaults.push("RepeatIntervalMs=50");
    if (op?.domain === "button" && String(attrs.Type || "") === "Toggle") defaults.push("Type=Toggle");
    if (op?.domain === "camera")
    {
        if (String(attrs.Type || "") === "PTZ") defaults.push("Type=PTZ");
        if (Number(attrs.ComPort) === 1) defaults.push("ComPort=1");
        if (Number(attrs.Port) === 0) defaults.push("Port=0");
        if (Object.prototype.hasOwnProperty.call(attrs, "IpAddress") && String(attrs.IpAddress || "") === "") defaults.push("IpAddress=blank");
    }
    return defaults.length ? `MAV/schema defaults: ${defaults.join(", ")}` : "";
}

    return `

function assistantNormalizeProperty(domain, property)
{
    const raw = String(property || "").trim();
    if (!raw) return null;
    const key = raw.toLowerCase().replace(/[\s_-]+/g, "");
    const common = {
        name: "Name",
        type: "Type",
        ipid: "IPID",
        ipaddress: "IpAddress",
        brand: "Brand",
        model: "Model",
        controlid: "ControlId",
        repeatinterval: "RepeatIntervalMs",
        repeatintervalms: "RepeatIntervalMs",
        pollinginterval: "PollingIntervalMs",
        pollingintervalms: "PollingIntervalMs"
    };
    const normalized = common[key] || raw;

    const allowed = {
        fader: new Set(["Name", "ControlId", "RepeatIntervalMs"]),
        button: new Set(["Name", "ControlId", "Type"]),
        display: new Set(["Type", "Brand", "Model", "ComPort", "PollingIntervalMs", "Name"]),
        source: new Set(["Name", "Type", "IPID", "VideoStreamLocation", "VideoMulticastAddress", "AudioSessionName", "UsbLocalId"]),
        destination: new Set(["Name", "Type", "IPID", "UsbLocalId"]),
        camera: new Set(["Name", "Type", "Brand", "TransportDeviceName", "ControlMethod", "ComPort", "IpAddress", "Port"]),
        dsp: new Set(["Name", "Type", "IpAddress", "PollingIntervalMs"])
    };

    return allowed[domain]?.has(normalized) ? normalized : null;
}

function assistantResolveNamedIndex(items, target)
{
    if (!Array.isArray(items) || !items.length || !target) return -1;
    const wanted = String(target).trim().toLowerCase();
    if (!wanted) return -1;

    let index = items.findIndex(item => String(item?.Name || "").trim().toLowerCase() === wanted);
    if (index >= 0) return index;
    index = items.findIndex(item => String(item?.Name || "").trim().toLowerCase().includes(wanted));
    if (index >= 0) return index;
    return items.findIndex(item => wanted.includes(String(item?.Name || "").trim().toLowerCase()) && String(item?.Name || "").trim());
}

function assistantDspFaderKnowledge(intent)
{
    const dsp = state.definition?.Dsp;
    if (!dsp)
    {
        return {
            source: "knowledge-ai",
            text: "MAV Knowledge resolved this as a DSP fader request, but no DSP is configured in the current SystemDefinition. Open DSP and configure the DSP before adding or editing faders."
        };
    }

    const faders = Array.isArray(dsp.Faders) ? dsp.Faders : [];
    if (!faders.length)
    {
        return {
            source: "knowledge-ai",
            text: [
                "MAV Knowledge resolved this as a DSP fader request.",
                "",
                "No faders are currently configured under Dsp.Faders[]. Use DSP → Add Fader to create a named level control, then Validate and Save."
            ].join("\n")
        };
    }

    const targetText = intent.target || intent.reference;
    const index = assistantResolveNamedIndex(faders, targetText);

    if (targetText && index < 0)
    {
        return {
            source: "knowledge-ai",
            text: [
                `I interpreted the target as “${targetText}”, but MAV Knowledge could not match that to a configured fader.`,
                "",
                "Configured faders:",
                ...faders.map((item, i) => `• ${item.Name || `Fader ${i + 1}`} — ${item.ControlId || "ControlId not set"} — /Dsp/Faders/${i}`),
                "",
                "Name the fader you mean and I’ll resolve the exact object instead of guessing."
            ].join("\n")
        };
    }

    if (index >= 0)
    {
        const fader = faders[index] || {};
        const property = assistantNormalizeProperty("fader", intent.property);
        const basePath = `/Dsp/Faders/${index}`;

        if (intent.intent === "modify" && property && intent.value != null)
        {
            let value = intent.value;
            if (property === "RepeatIntervalMs")
            {
                const parsed = Number(value);
                if (!Number.isFinite(parsed) || parsed < 0)
                {
                    return {
                        source: "knowledge-ai",
                        text: `I resolved ${fader.Name || `Fader ${index + 1}`} and ${property}, but “${value}” is not a valid non-negative millisecond value. I did not prepare a patch.`
                    };
                }
                value = parsed;
            }

            const current = Object.prototype.hasOwnProperty.call(fader, property) ? fader[property] : undefined;
            return {
                source: "knowledge-ai",
                text: [
                    `I resolved this to ${fader.Name || `Fader ${index + 1}`} under Dsp.Faders[${index}].`,
                    "",
                    `Current ${property}: ${current ?? "not set"}.`,
                    `Proposed ${property}: ${value}.`,
                    `Path: ${basePath}/${property}`,
                    "",
                    "I prepared the change below. Apply only changes the in-memory working definition; Validate and Save remain separate operator actions."
                ].join("\n"),
                proposal: {
                    summary: `Change ${fader.Name || `Fader ${index + 1}`} ${property} from ${current ?? "not set"} to ${value}`,
                    changes: [{
                        op: Object.prototype.hasOwnProperty.call(fader, property) ? "replace" : "add",
                        path: `${basePath}/${property}`,
                        value
                    }]
                }
            };
        }

        return {
            source: "knowledge-ai",
            text: [
                `I resolved this to ${fader.Name || `Fader ${index + 1}`}.`,
                "",
                `Path: ${basePath}`,
                `• Name: ${fader.Name || "not set"}`,
                `• ControlId: ${fader.ControlId || "not set"}`,
                `• RepeatIntervalMs: ${fader.RepeatIntervalMs ?? "not set"}`,
                "",
                "Edit it on the DSP page or in Advanced JSON. The supported fader properties are Name, ControlId, and RepeatIntervalMs. The ControlId must match the level control exposed by the DSP integration. Then Validate and Save."
            ].join("\n")
        };
    }

    return {
        source: "knowledge-ai",
        text: [
            "MAV Knowledge resolved this as a DSP fader request.",
            "",
            "Faders live under Dsp.Faders[]. Current faders:",
            ...faders.map((item, i) => `• ${item.Name || `Fader ${i + 1}`} — ControlId: ${item.ControlId || "not set"} — path: /Dsp/Faders/${i}`),
            "",
            "You can ask naturally, for example: “change Speakers ControlId to MainProgramGain” or “show me the Microphones fader.”"
        ].join("\n")
    };
}

            `• Controlled display: ${pending.brand || ""} ${pending.model || ""} (${pending.displayType || "LCD"})`.replace(/\s+/g, " "),
            `• Proposal path: /MatrixSwitcher/Decoders/${index}`,
            "",
            "Review the proposal below. Apply changes only updates the in-memory working definition; Validate and Save remain separate operator actions."
        ].join("\n"),
        proposal: {
            summary: `Add ${pending.name} decoder with controlled ${pending.brand || ""} ${pending.model || pending.displayType || "display"}`.replace(/\s+/g, " ").trim(),
            changes: [{ op: "add", path: "/MatrixSwitcher/Decoders/-", value: decoder }]
        }
    };
}

function assistantPromptForPendingDestinationDisplay(pending)
{
    assistantRuntime.conversationContext.pendingProposal = pending;
    assistantRuntime.conversationContext.subject = { ...pending, kind: "pendingDestinationDisplay" };

    if (!pending.model)
    {
        if (Array.isArray(pending.models) && pending.models.length)
        {
            assistantRuntime.conversationContext.options = {
                kind: "pendingDisplayModel",
                values: pending.models
            };
            return {
                source: "knowledge-ai",
                text: [
                    `I can prepare this change, but I need the ${pending.brand || "display"} model before I build the proposal.`,
                    "",
                    `${pending.brand || "Display"} models available in MAV's loaded catalog:`,
                    ...pending.models.slice(0, 20).map((item, i) => `${i + 1}. ${item}`),
                    "",
                    `Which ${pending.brand || "display"} model should I use? You can reply with the model name, the list number, or an ordinal phrase such as “the second one.”`
                ].join("\n"),
                needsFollowUp: true
            };
        }
        assistantRuntime.conversationContext.options = null;
        return {
            source: "knowledge-ai",
            text: `I can prepare this change, but MAV does not have known ${pending.brand || "display"} models to offer from the loaded catalog. What exact display model should I use?`,
            needsFollowUp: true
        };
    }

    if (!pending.ipid)
    {
        assistantRuntime.conversationContext.options = null;
        pending.suggestedIpid = pending.suggestedIpid || assistantNextFreeIpid();
        const alternateIpid = assistantAlternateFreeIpid(pending.suggestedIpid);
        return {
            source: "knowledge-ai",
            text: pending.suggestedIpid
                ? `I resolved the display as ${pending.brand || ""} ${pending.model}. The next free IPID for the new ${pending.name} decoder is ${pending.suggestedIpid}. Should I use that?${alternateIpid ? ` You can also enter another unused hex IPID such as ${alternateIpid} or ${alternateIpid.replace(/^0x/i, "")}; bare values are treated as hexadecimal.` : ""}`
                : `I resolved the display as ${pending.brand || ""} ${pending.model}. What unused IPID should I assign to the new ${pending.name} decoder?${assistantNextFreeIpid() ? ` A currently free example is ${assistantNextFreeIpid()}.` : ""} Bare values are treated as hexadecimal.`,
            needsFollowUp: true
        };
    }

    assistantRuntime.conversationContext.pendingProposal = null;
    assistantRuntime.conversationContext.options = null;
    return assistantBuildDestinationDisplayProposal(pending);
}

function assistantPendingProposalFollowUp(userText)
{
    const pending = assistantRuntime.conversationContext.pendingProposal;
    if (pending?.kind === "genericAdd") return assistantPendingGenericAddFollowUp(userText);
    if (!pending || pending.kind !== "destinationDisplay") return null;
    const text = String(userText || "").trim();
    if (!text) return null;

    if (!pending.model)
    {
        const values = Array.isArray(pending.models) ? pending.models : [];
        let selected = values.find(value => String(value).toLowerCase() === text.toLowerCase()) || null;
        if (!selected)
        {
            const ordinal = assistantOrdinalIndex(text);
            if (Number.isInteger(ordinal) && ordinal >= 0 && ordinal < values.length) selected = values[ordinal];
        }
        if (!selected && values.length)
            selected = values.find(value => text.toLowerCase().includes(String(value).toLowerCase())) || null;
        if (!selected && !values.length && text.length <= 80) selected = text;
        if (!selected)
            return { source: "knowledge-ai", text: `I still need the display model. Choose one of the listed ${pending.brand || "display"} models by name or number.`, needsFollowUp: true };
        pending.model = selected;
        // Do not interpret a model-selection reply as an IPID. Ask for IPID separately if it is still missing.
        return assistantPromptForPendingDestinationDisplay(pending);
    }

    if (!pending.ipid)
    {
        if (assistantIsAffirmativeReply(text) && pending.suggestedIpid)
            pending.ipid = pending.suggestedIpid;
        else if (/\bnext\s+free\s+ipid\b/i.test(text))
            pending.ipid = pending.suggestedIpid || assistantNextFreeIpid();
        else
            pending.ipid = assistantParseExplicitIpid(text);

        if (pending.ipid && assistantIpidIsReserved(pending.ipid, pending.suggestedIpid))
        {
            const conflict = pending.ipid;
            pending.ipid = "";
            pending.suggestedIpid = assistantNextFreeIpid();
            const alternate = assistantAlternateFreeIpid(pending.suggestedIpid);
            return {
                source: "knowledge-ai",
                text: `${conflict} is already in use or reserved by another pending MAV change, so I will not assign or recommend it. ${pending.suggestedIpid ? `The next free IPID is ${pending.suggestedIpid}. Should I use that?` : "No free IPID is currently available."}${alternate ? ` Another currently free option is ${alternate}.` : ""}`,
                needsFollowUp: true
            };
        }

        if (!pending.ipid)
            return assistantPromptForPendingDestinationDisplay(pending);
    }

    return assistantPromptForPendingDestinationDisplay(pending);
}


const ASSISTANT_ADD_SPECS = {
    source: { path:"/MatrixSwitcher/Encoders/-", label:"Encoder source", defaults:{Type:"Computer", VideoStreamLocation:"", VideoMulticastAddress:"", UsbLocalId:""}, required:["Name","IPID"] },
    destination: { path:"/MatrixSwitcher/Decoders/-", label:"destination / decoder", defaults:{Type:"Monitor", UsbLocalId:""}, required:["Name","IPID"] },
    camera: { path:"/Cameras/-", label:"camera", defaults:{Type:"PTZ", Brand:"Visca", TransportDeviceName:"", ControlMethod:"Serial", ComPort:1, IpAddress:"", Port:0}, required:["Name","TransportDeviceName"] },
    fader: { path:"/Dsp/Faders/-", label:"DSP fader", defaults:{RepeatIntervalMs:50}, required:["Name","ControlId"] },
    button: { path:"/Dsp/Buttons/-", label:"DSP button / mute", defaults:{Type:"Toggle"}, required:["Name","ControlId"] },
    dsp_device: { path:"/Dsp/Devices/-", label:"DSP device", defaults:{Type:"ShureMXA", Functions:[]}, required:["Name"] },
    vtc: { path:"/VTC", label:"VTC endpoint", defaults:{Type:"Codec", Brand:"", ControlPath:"Local", CommunicationMethod:"Serial", SerialPort:{Device:"ControlSystem",Port:1}, PollingIntervalMs:5000}, required:["Name","Brand"] },
    atc: { path:"/ATC", label:"ATC endpoint", defaults:{Type:"VoIPDialer", Brand:"", CommunicationMethod:"Serial", SerialPort:{Device:"ControlSystem",Port:2}, ChannelName:"", Username:"", Password:"", PollingIntervalMs:5000}, required:["Name","Brand"] }
};

function assistantFormatIpid(value)
{
    const n = Number(value);
    return Number.isFinite(n) && n >= 1 && n <= 255
        ? `0x${n.toString(16).toUpperCase().padStart(2,"0")}`
        : "";
}

function assistantIpidNumber(value)
{
    if (typeof value === "number")
        return Number.isFinite(value) && value >= 1 && value <= 255 ? Math.trunc(value) : null;

    const raw = String(value ?? "").trim();
    if (!raw) return null;

    let match = raw.match(/^0x([0-9a-f]{1,2})$/i);
    if (match)
    {
        const n = parseInt(match[1], 16);
        return Number.isFinite(n) && n >= 1 && n <= 255 ? n : null;
    }

    match = raw.match(/^([0-9a-f]{1,2})$/i);
    if (match)
    {
        const n = parseInt(match[1], 16);
        return Number.isFinite(n) && n >= 1 && n <= 255 ? n : null;
    }

    return null;
}

function assistantCollectIpids(value, used)
{
    if (!value || typeof value !== "object") return;
    if (Array.isArray(value))
    {
        value.forEach(item => assistantCollectIpids(item, used));
        return;
    }

    Object.entries(value).forEach(([key, child]) =>
    {
        if (String(key).toLowerCase() === "ipid")
        {
            const n = assistantIpidNumber(child);
            if (n != null) used.add(n);
        }
        if (child && typeof child === "object") assistantCollectIpids(child, used);
    });
}

function assistantUsedIpids()
{
    const used = new Set();

    // Scan every authoritative IPID in the working SystemDefinition, not only AV endpoints.
    assistantCollectIpids(state.definition, used);

    // An unapplied proposal still owns its requested IPID for the life of that proposal.
    assistantCollectIpids(assistantRuntime.proposal, used);
    (assistantRuntime.history || []).forEach(entry =>
    {
        if (entry?.role === "proposal-audit" && entry.status === "pending")
            assistantCollectIpids(entry.proposal, used);
    });

    // Clarification workflows can reserve a value before the proposal card exists.
    const pending = assistantRuntime.conversationContext?.pendingProposal;
    assistantCollectIpids(pending, used);
    [pending?.suggestedIpid, pending?.cursor?.suggestedValue].forEach(value =>
    {
        const n = assistantIpidNumber(value);
        if (n != null) used.add(n);
    });

    return used;
}

function assistantNextFreeIpid(excludedValues = [])
{
    const used = assistantUsedIpids();
    (Array.isArray(excludedValues) ? excludedValues : [excludedValues]).forEach(value =>
    {
        const n = assistantIpidNumber(value);
        if (n != null) used.add(n);
    });

    for (let n = 1; n <= 255; n++)
        if (!used.has(n)) return assistantFormatIpid(n);
    return "";
}

function assistantCountIpidInValue(value, wanted)
{
    if (!value || typeof value !== "object") return 0;
    if (Array.isArray(value))
        return value.reduce((count, item) => count + assistantCountIpidInValue(item, wanted), 0);

    let count = 0;
    Object.entries(value).forEach(([key, child]) =>
    {
        if (String(key).toLowerCase() === "ipid" && assistantIpidNumber(child) === wanted)
            count++;
        if (child && typeof child === "object") count += assistantCountIpidInValue(child, wanted);
    });
    return count;
}

function assistantIpidReservationCount(value)
{
    const wanted = assistantIpidNumber(value);
    if (wanted == null) return 0;
    let count = 0;
    count += assistantCountIpidInValue(state.definition, wanted);
    count += assistantCountIpidInValue(assistantRuntime.proposal, wanted);
    (assistantRuntime.history || []).forEach(entry =>
    {
        if (entry?.role === "proposal-audit" && entry.status === "pending")
            count += assistantCountIpidInValue(entry.proposal, wanted);
    });
    const pending = assistantRuntime.conversationContext?.pendingProposal;
    count += assistantCountIpidInValue(pending, wanted);
    [pending?.suggestedIpid, pending?.cursor?.suggestedValue].forEach(item =>
    {
        if (assistantIpidNumber(item) === wanted) count++;
    });
    return count;
}

function assistantIpidIsReserved(value, allowedValue = "")
{
    const n = assistantIpidNumber(value);
    if (n == null) return false;
    const allowed = assistantIpidNumber(allowedValue);
    const count = assistantIpidReservationCount(value);
    // The candidate itself is already present in the current pending object by the time
    // this check runs. An accepted suggestion also appears once in cursor state.
    return allowed != null && n === allowed ? count > 2 : count > 1;
}

function assistantAlternateFreeIpid(primary = "")
{
    return assistantNextFreeIpid(primary ? [primary] : []);
}

function assistantParseExplicitIpid(text)
{
    const source = String(text || "").trim();
    // Require either an explicit 0x-prefixed token, an IPID-labelled value,
    // or a reply consisting only of the hex value. Never mine hex letters out
    // of ordinary words (for example the final "e" in "fine").
    let match = source.match(/(?:^|\s)0x([0-9a-f]{1,2})(?=$|\s|[.,;:!?])/i);
    if (!match) match = source.match(/\bipid\s*(?:is|=|:)?\s*(?:0x)?([0-9a-f]{1,2})\b/i);
    if (!match) match = source.match(/^\s*([0-9a-f]{1,2})\s*$/i);
    if (!match) return "";
    const value = parseInt(match[1], 16);
    return assistantFormatIpid(value);
}

function assistantIsAffirmativeReply(text)
{
    const value = String(text || "").trim().toLowerCase().replace(/[.!]+$/g, "");
    return /^(?:yes|yep|yeah|sure|ok|okay|fine|that(?:'s| is)? fine|that works|works for me|use that|use it|go with that|go with it|sounds good|looks good|perfect|do that|that'll work|that will work)$/.test(value);
}

function assistantGenericFieldPrompt(domain, field, item, suggestedValue = "")
{
    const name = item?.Name || item?.target || ASSISTANT_ADD_SPECS[domain]?.label || domain;
    const prompts = {
        IPID: suggestedValue
            ? (() => {
                const alternate = assistantAlternateFreeIpid(suggestedValue);
                return `The next free IPID for ${name} is ${suggestedValue}. Should I use that?${alternate ? ` You can also enter another unused hex IPID such as ${alternate} or ${alternate.replace(/^0x/i, "")}; bare values are treated as hexadecimal.` : ""}`;
            })()
            : (() => {
                const example = assistantNextFreeIpid();
                return `What unused IPID should I assign to ${name}?${example ? ` A currently free example is ${example} or ${example.replace(/^0x/i, "")}.` : ""} Bare values are treated as hexadecimal, or ask for the next free IPID.`;
            })(),
        ControlId: domain === "fader"
            ? `What DSP named level control ID should I use for ${name}?`
            : (domain === "button"
                ? `What DSP named mute control ID should I use for ${name}?`
                : `What DSP control ID should I use for ${name}?`),
        TransportDeviceName: `Which configured source/encoder carries the control transport for ${name}?`,
        IpAddress: `What IP address should MAV use to control ${name}?`,
        Name: `What name should I use for the new ${ASSISTANT_ADD_SPECS[domain]?.label || domain}?`
    };
    return prompts[field] || `What value should I use for ${field} on ${name}?`;
}

function assistantBuildGenericAddProposal(pending)
{
    const changes = pending.items.map(item => {
        const path = ASSISTANT_ADD_SPECS[item.domain].path;
        const rootExists = (item.domain === "vtc" && !!state.definition?.VTC) || (item.domain === "atc" && !!state.definition?.ATC);
        return {op: rootExists ? "replace" : "add", path, value:item.value};
    });
    return {
        source:"knowledge-ai",
        text:[
            "I have enough information to prepare the requested SystemDefinition change.",
            "",
            ...pending.items.map(item => `• ${ASSISTANT_ADD_SPECS[item.domain].label}: ${item.value.Name || "new object"}`),
            "",
            "Review the proposal below. Applying updates only the in-memory working definition; Validate and Save remain separate operator actions."
        ].join("\n"),
        proposal:{
            summary: pending.items.map(item => `Add ${item.value.Name || ASSISTANT_ADD_SPECS[item.domain].label}`).join(" + "),
            changes
        }
    };
}

function assistantPromptForPendingGenericAdd(pending)
{
    assistantRuntime.conversationContext.pendingProposal = pending;
    assistantRuntime.conversationContext.subject = {kind:"pendingGenericAdd"};
    for (let i=0;i<pending.items.length;i++)
    {
        const item=pending.items[i];
        const spec=ASSISTANT_ADD_SPECS[item.domain];
        const requiredFields = [...spec.required];
        if (item.domain === "camera" && item.value.ControlMethod === "IP" && !requiredFields.includes("IpAddress"))
            requiredFields.push("IpAddress");
        for (const field of requiredFields)
        {
