function jsonIntellisenseContainerPath(text, cursor)
{
    const stack = [];
    let inString = false;
    let escaped = false;
    let stringValue = "";
    let lastString = null;
    let lastToken = null;

    for (let index = 0; index < cursor; index += 1)
    {
        const ch = text[index];

        if (inString)
        {
            if (escaped)
            {
                escaped = false;
                stringValue += ch;
                continue;
            }

            if (ch === "\\")
            {
                escaped = true;
                stringValue += ch;
                continue;
            }

            if (ch === '"')
            {
                inString = false;
                lastString = stringValue;
                lastToken = "string";
                stringValue = "";
                continue;
            }

            stringValue += ch;
            continue;
        }

        if (ch === '"')
        {
            inString = true;
            stringValue = "";
            continue;
        }

        if (/\s/.test(ch))
        {
            continue;
        }

        const top = stack[stack.length - 1];

        if (ch === ":")
        {
            if (top && top.type === "object" && lastToken === "string")
            {
                top.pendingKey = lastString;
            }
            lastToken = "colon";
            continue;
        }

        if (ch === "{" || ch === "[")
        {
            let segment = null;
            const parent = stack[stack.length - 1];

            if (parent)
            {
                if (parent.type === "object" && parent.pendingKey)
                {
                    segment = parent.pendingKey;
                    parent.pendingKey = null;
                }
                else if (parent.type === "array")
                {
                    segment = "[]";
                }
            }

            stack.push({
                type: ch === "{" ? "object" : "array",
                segment: segment,
                pendingKey: null
            });

            lastToken = ch;
            continue;
        }

        if (ch === "}" || ch === "]")
        {
            stack.pop();
            lastToken = ch;
            continue;
        }

        if (ch === ",")
        {
            if (top && top.type === "object")
            {
                top.pendingKey = null;
            }
            lastToken = "comma";
            continue;
        }

        lastToken = "primitive";
    }

    return stack
        .slice(1)
        .map(entry => entry.segment)
        .filter(Boolean)
        .join(".");
}

function jsonIntellisenseContext(textarea)
{
    const cursor = textarea.selectionStart || 0;
    const text = textarea.value;
    const lineStart = text.lastIndexOf("\n", Math.max(0, cursor - 1)) + 1;
    const beforeLine = text.slice(lineStart, cursor);
    const path = jsonIntellisenseContainerPath(text, cursor);

    let match = beforeLine.match(/(?:^|[,{])\s*"([^"]*)$/);
    if (match)
    {
        return {
            mode: "key",
            path,
            prefix: match[1],
            replaceStart: cursor - match[1].length,
            replaceEnd: cursor,
            quoted: true
        };
    }

    match = beforeLine.match(/(?:^|[,{])\s*$/);
    if (match)
    {
        return {
            mode: "key",
            path,
            prefix: "",
            replaceStart: cursor,
            replaceEnd: cursor,
            quoted: false
        };
    }

    match = beforeLine.match(/"([^"]+)"\s*:\s*"([^"]*)$/);
    if (match)
    {
        return {
            mode: "value",
            path,
            property: match[1],
            prefix: match[2],
            replaceStart: cursor - match[2].length,
            replaceEnd: cursor,
            quoted: true
        };
    }

    match = beforeLine.match(/"([^"]+)"\s*:\s*([A-Za-z0-9_.-]*)$/);
    if (match)
    {
        return {
            mode: "value",
            path,
            property: match[1],
            prefix: match[2] || "",
            replaceStart: cursor - (match[2] || "").length,
            replaceEnd: cursor,
            quoted: false
        };
    }

    return null;
}

function jsonIntellisenseDynamicValues(path, property)
{
    if (path === "Cameras.[]" && property === "TransportDeviceName")
    {
        return (state.definition?.MatrixSwitcher?.Encoders || [])
            .map(item => item?.Name)
            .filter(Boolean);
    }

    if (path === "MatrixSwitcher.Decoders.[].Display" && property === "Brand")
    {
        return Object.values(state.displayCatalog || {})
            .flatMap(brandMap => Object.keys(brandMap || {}));
    }

    if (path === "MatrixSwitcher.Decoders.[].Display" && property === "Model")
    {
        return Object.values(state.displayCatalog || {})
            .flatMap(brandMap => Object.values(brandMap || {}).flat());
    }

    return [];
}

function jsonIntellisenseSuggestions(context)
{
    if (!context)
    {
        return [];
    }

    const prefix = String(context.prefix || "").toLowerCase();

    if (context.mode === "key")
    {
        const entries = JSON_INTELLISENSE_SCHEMA[context.path] || [];

        return entries
            .filter(([label]) => label.toLowerCase().startsWith(prefix))
            .map(([label, type, detail]) => ({
                label,
                detail,
                kind: type === "array" ? "A" : type === "object" ? "O" : type === "number" ? "#" : type === "boolean" ? "B" : "P",
                insertText: context.quoted ? label : `"${label}": `,
                appendColon: context.quoted
            }));
    }

    const key = context.path
        ? `${context.path}.${context.property}`
        : context.property;

    let values = [
        ...(JSON_INTELLISENSE_ENUMS[key] || []),
        ...jsonIntellisenseDynamicValues(context.path, context.property)
    ];

    const schemaEntry = (JSON_INTELLISENSE_SCHEMA[context.path] || [])
        .find(([label]) => label === context.property);

    if (schemaEntry?.[1] === "boolean")
    {
        values = ["true", "false"];
    }

    return [...new Set(values)]
        .filter(value => String(value).toLowerCase().startsWith(prefix))
        .map(value => {
            const primitive = value === "true" || value === "false" || value === "null" || /^-?\d/.test(String(value));
            return {
                label: String(value),
                detail: primitive ? "JSON value" : context.property,
                kind: primitive ? "V" : "E",
                insertText: context.quoted || primitive ? String(value) : `"${value}"`,
                appendColon: false
            };
        });
}

let jsonIntellisenseState = {
    open: false,
    items: [],
    activeIndex: 0,
    context: null
};

function jsonIntellisensePopup()
{
    return document.getElementById("json-intellisense");
}

function closeJsonIntellisense()
{
    const popup = jsonIntellisensePopup();
    if (popup)
    {
        popup.classList.remove("open");
        popup.innerHTML = "";
    }

    jsonIntellisenseState = {
        open: false,
        items: [],
        activeIndex: 0,
        context: null
    };
}

function positionJsonIntellisense(textarea)
{
    const popup = jsonIntellisensePopup();
    const pane = textarea.closest(".json-code-pane");

    if (!popup || !pane || !jsonIntellisenseState.open)
    {
        return;
    }

    const cursor = jsonEditorCursorPosition(textarea);
    const style = getComputedStyle(textarea);
    const fontSize = parseFloat(style.fontSize) || 14;
    const lineHeight = parseFloat(style.lineHeight) || fontSize * 1.55;
    const paddingLeft = parseFloat(style.paddingLeft) || 14;
    const paddingTop = parseFloat(style.paddingTop) || 12;

    const measure = document.createElement("span");
    measure.style.position = "absolute";
    measure.style.visibility = "hidden";
    measure.style.fontFamily = style.fontFamily;
    measure.style.fontSize = style.fontSize;
    measure.textContent = "M";
    document.body.appendChild(measure);
    const charWidth = measure.getBoundingClientRect().width || fontSize * .6;
    measure.remove();

    let left = paddingLeft + Math.max(0, cursor.column - 1) * charWidth - textarea.scrollLeft;
    let top = paddingTop + cursor.line * lineHeight - textarea.scrollTop + 2;

    left = Math.max(8, Math.min(left, Math.max(8, pane.clientWidth - Math.min(420, pane.clientWidth - 16))));
    top = Math.max(8, Math.min(top, Math.max(8, pane.clientHeight - 90)));

    popup.style.left = `${left}px`;
    popup.style.top = `${top}px`;
}

function renderJsonIntellisense(textarea)
{
    const popup = jsonIntellisensePopup();
    if (!popup || !jsonIntellisenseState.open)
    {
        return;
    }

    if (!jsonIntellisenseState.items.length)
    {
        popup.innerHTML = `<div class="json-intellisense-empty">No MAV suggestions</div>`;
        popup.classList.add("open");
        positionJsonIntellisense(textarea);
        return;
    }

    popup.innerHTML = jsonIntellisenseState.items
        .map((item, index) => `
            <div class="json-intellisense-item ${index === jsonIntellisenseState.activeIndex ? "active" : ""}"
                 data-intellisense-index="${index}"
                 role="option"
                 aria-selected="${index === jsonIntellisenseState.activeIndex ? "true" : "false"}">
                <span class="json-intellisense-kind">${escapeHtml(item.kind)}</span>
                <span class="json-intellisense-label">${escapeHtml(item.label)}</span>
                <span class="json-intellisense-detail">${escapeHtml(item.detail || "")}</span>
            </div>`)
        .join("");

    popup.classList.add("open");

    popup.querySelectorAll("[data-intellisense-index]")
        .forEach(element =>
        {
            element.onmousedown = event =>
            {
                event.preventDefault();
                jsonIntellisenseState.activeIndex = Number(element.dataset.intellisenseIndex);
                acceptJsonIntellisense(textarea);
            };
        });

    const active = popup.querySelector(".json-intellisense-item.active");
    active?.scrollIntoView({block: "nearest"});
    positionJsonIntellisense(textarea);
}

function openJsonIntellisense(textarea, force = false)
{
    const context = jsonIntellisenseContext(textarea);

    if (!context)
    {
        closeJsonIntellisense();
        return false;
    }

    const items = jsonIntellisenseSuggestions(context);

    if (!force && !items.length)
    {
        closeJsonIntellisense();
        return false;
    }

    jsonIntellisenseState = {
        open: true,
        items,
        activeIndex: 0,
        context
    };

    renderJsonIntellisense(textarea);
    return true;
}

function acceptJsonIntellisense(textarea)
{
    if (!jsonIntellisenseState.open || !jsonIntellisenseState.items.length)
    {
        return false;
    }

    const item = jsonIntellisenseState.items[jsonIntellisenseState.activeIndex];
    const context = jsonIntellisenseState.context;

    let insertText = item.insertText;

    const afterCursor = textarea.value.slice(context.replaceEnd);

    if (context.mode === "key" && context.quoted && item.appendColon)
    {
        if (!/^"\s*:/.test(afterCursor))
        {
            insertText += '\": ';
        }
    }

    if (context.mode === "value" && context.quoted)
    {
        if (!/^"/.test(afterCursor))
        {
            insertText += '\"';
        }
    }

    textarea.setRangeText(
        insertText,
        context.replaceStart,
        context.replaceEnd,
        "end");

    closeJsonIntellisense();
    textarea.dispatchEvent(new Event("input", {bubbles: true}));
    return true;
}

function moveJsonIntellisense(delta, textarea)
{
    if (!jsonIntellisenseState.open || !jsonIntellisenseState.items.length)
    {
        return;
    }

    const length = jsonIntellisenseState.items.length;
    jsonIntellisenseState.activeIndex =
        (jsonIntellisenseState.activeIndex + delta + length) % length;

    renderJsonIntellisense(textarea);
}

let jsonEditorRefreshFrame = null;

function scheduleJsonEditorRefresh(textarea)
{
    if (jsonEditorRefreshFrame !== null)
    {
        cancelAnimationFrame(jsonEditorRefreshFrame);
    }

    jsonEditorRefreshFrame = requestAnimationFrame(() =>
    {
        jsonEditorRefreshFrame = null;
        refreshJsonEditor(textarea);
    });
}

function bindJsonEditor(textarea)
{
    if (!textarea)
    {
        return;
    }

    const updateCursorOnly = () =>
    {
        scheduleJsonEditorRefresh(textarea);
        if (jsonIntellisenseState.open)
        {
            openJsonIntellisense(textarea, true);
        }
    };

    textarea.addEventListener("input", () =>
    {
        markDirty();
        scheduleJsonEditorRefresh(textarea);
        openJsonIntellisense(textarea, false);
    });

    textarea.addEventListener("scroll", () =>
    {
        syncJsonEditorScroll(textarea);
        positionJsonIntellisense(textarea);
    });

    textarea.addEventListener("click", () =>
    {
        updateCursorOnly();
        closeJsonIntellisense();
    });

    textarea.addEventListener("keyup", event =>
    {
        if (["ArrowUp", "ArrowDown", "Enter", "Tab", "Escape"].includes(event.key))
        {
            return;
        }
        updateCursorOnly();
    });

    textarea.addEventListener("select", updateCursorOnly);
    textarea.addEventListener("focus", updateCursorOnly);

    textarea.addEventListener("blur", () =>
    {
        setTimeout(() =>
        {
            if (!document.activeElement?.closest?.(".json-intellisense"))
            {
                closeJsonIntellisense();
            }
        }, 80);
    });

    textarea.addEventListener("keydown", event =>
    {
        if ((event.ctrlKey || event.metaKey) && event.code === "Space")
        {
            event.preventDefault();
            openJsonIntellisense(textarea, true);
            return;
        }

        if (jsonIntellisenseState.open)
        {
            if (event.key === "ArrowDown")
            {
                event.preventDefault();
                moveJsonIntellisense(1, textarea);
                return;
            }

            if (event.key === "ArrowUp")
            {
                event.preventDefault();
                moveJsonIntellisense(-1, textarea);
                return;
            }

            if (event.key === "Enter" || event.key === "Tab")
            {
                event.preventDefault();
                acceptJsonIntellisense(textarea);
                return;
            }

            if (event.key === "Escape")
            {
                event.preventDefault();
                closeJsonIntellisense();
                return;
            }
        }

        if (event.key !== "Tab")
        {
            return;
        }

        event.preventDefault();

        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const indent = "  ";

        textarea.setRangeText(
            indent,
            start,
            end,
            "end");

        textarea.dispatchEvent(
            new Event("input", { bubbles: true }));
    });

    refreshJsonEditor(textarea);
}




/* =========================================================
   VISUAL EDITOR SAVED-BASELINE CHANGE TRACKING
   ========================================================= */
function visualBaselineDefinition(){ return state.baseline || state.processorBaseline || null; }
function visualPathValue(root,path){
    if(!root||!path)return undefined; const tokens=[];
    String(path).replace(/([^.\[\]]+)|\[(\d+)\]/g,(_,key,index)=>{tokens.push(index!==undefined?Number(index):key);return "";});
    let value=root; for(const token of tokens){ if(value==null)return undefined; value=value[token]; } return value;
}
function visualValuesEqual(left,right){ if(left===undefined&&right===undefined)return true; try{return JSON.stringify(left)===JSON.stringify(right);}catch(_){return left===right;} }
function visualPathChanged(path){ const baseline=visualBaselineDefinition(); if(!baseline||!state.definition)return false; return !visualValuesEqual(visualPathValue(state.definition,path),visualPathValue(baseline,path)); }
function visualPathsForElement(element){
    const key=element.dataset?.key;
    if(element.id==="system-name")return ["Name"]; if(element.id==="matrix-name")return ["MatrixSwitcher.Name"]; if(element.id==="vtc-farm-enabled")return ["VtcFarm.Enabled"];
    if(element.hasAttribute("data-source"))return [`MatrixSwitcher.Encoders[${Number(element.dataset.source)}].${key}`];
    if(element.hasAttribute("data-destination"))return [`MatrixSwitcher.Decoders[${Number(element.dataset.destination)}].${key}`];
    if(element.hasAttribute("data-display"))return [`MatrixSwitcher.Decoders[${Number(element.dataset.display)}].Display.${key}`];
    if(element.hasAttribute("data-display-model-custom"))return [`MatrixSwitcher.Decoders[${Number(element.dataset.displayModelCustom)}].Display.Model`];
    if(element.hasAttribute("data-screen"))return [`MatrixSwitcher.Decoders[${Number(element.dataset.screen)}].Display.Screen.${key}`];
    if(element.hasAttribute("data-camera"))return [`Cameras[${Number(element.dataset.camera)}].${key}`];
    if(element.hasAttribute("data-source-camera"))return [`Cameras[${Number(element.dataset.cameraIndex)}].${key}`];
    if(element.hasAttribute("data-iptv"))return [`MatrixSwitcher.Encoders[${Number(element.dataset.iptv)}].IPTV.${key}`];
    if(element.hasAttribute("data-fader"))return [`Dsp.Faders[${Number(element.dataset.fader)}].${key}`];
    if(element.hasAttribute("data-mute"))return [`Dsp.Buttons[${Number(element.dataset.mute)}].${key}`];
    if(element.hasAttribute("data-dsp-device"))return [`Dsp.Devices[${Number(element.dataset.dspDevice)}].${key}`];
    if(element.hasAttribute("data-function")){const [di,fi]=String(element.dataset.function).split(":").map(Number);return [`Dsp.Devices[${di}].Functions[${fi}].${key}`];}
    if(element.hasAttribute("data-vtc"))return [`VTC.${key}`]; if(element.hasAttribute("data-vtc-serial"))return [`VTC.SerialPort.${key}`];
    if(element.hasAttribute("data-vtc-farm"))return [`VtcFarm.${key}`]; if(element.hasAttribute("data-atc"))return [`ATC.${key}`]; if(element.hasAttribute("data-atc-serial"))return [`ATC.SerialPort.${key}`];
    if(element.hasAttribute("data-capability")){const [i,c]=String(element.dataset.capability).split(":"); const map={video:["VideoStreamLocation","VideoMulticastAddress"],audio:["AudioSessionName"],usb:["UsbLocalId"]}; return (map[c]||[]).map(prop=>`MatrixSwitcher.Encoders[${Number(i)}].${prop}`);}
    if(element.hasAttribute("data-iptv-toggle"))return [`MatrixSwitcher.Encoders[${Number(element.dataset.iptvToggle)}].IPTV`];
    if(element.hasAttribute("data-source-camera-toggle"))return ["Cameras"];
    if(element.hasAttribute("data-destination-usb"))return [`MatrixSwitcher.Decoders[${Number(element.dataset.destinationUsb)}].UsbLocalId`];
    if(element.hasAttribute("data-destination-display"))return [`MatrixSwitcher.Decoders[${Number(element.dataset.destinationDisplay)}].Display`];
    if(element.hasAttribute("data-display-screen"))return [`MatrixSwitcher.Decoders[${Number(element.dataset.displayScreen)}].Display.Screen`];
    return [];
}
function refreshVisualUnsavedIndicators(){
    const content=document.getElementById("content"); if(!content||["advanced","assistant","settings"].includes(state.page))return;
    content.querySelectorAll(".mav-unsaved-field").forEach(n=>n.classList.remove("mav-unsaved-field"));
    content.querySelectorAll(".mav-unsaved-device").forEach(n=>n.classList.remove("mav-unsaved-device"));
    content.querySelectorAll(".mav-unsaved-badge").forEach(n=>n.remove());
    if(!state.dirty||!visualBaselineDefinition())return;
    content.querySelectorAll("input,select,textarea").forEach(element=>{
        const paths=visualPathsForElement(element); if(!paths.length||!paths.some(visualPathChanged))return;
        const field=element.closest(".field,.check"); if(field){field.classList.add("mav-unsaved-field"); const label=field.matches("label.check")?field:field.querySelector("label"); if(label&&!label.querySelector(".mav-unsaved-badge")){label.classList.add("mav-unsaved-label");label.insertAdjacentHTML("beforeend",'<span class="mav-unsaved-badge" title="Changed from saved baseline">Unsaved</span>');}}
        const device=element.closest(".device"); if(device)device.classList.add("mav-unsaved-device");
    });
}

function bindSimpleInput(
    elementId,
    update)
{
    const element =
        document.getElementById(
            elementId);


    if (!element)
    {
        return;
    }


    const handler =
        () =>
        {
            update(
                element.type === "number"

                ? Number(
                    element.value)

                : element.value);


            markDirty();
        };


    element.oninput =
        handler;


    element.onchange =
        handler;
}


/* =========================================================
   BIND SOURCES
   ========================================================= */


function bindSources()
{
    const sources =
        state.definition
            .MatrixSwitcher
            .Encoders;


    document
        .getElementById(
            "add-source")
        .onclick =
        () =>
        {
            sources.push(
                {
                    Name:
                        `Source ${sources.length + 1}`,

                    Type:
                        "Computer",

                    IPID:
                        "",

                    VideoStreamLocation:
                        "",

                    VideoMulticastAddress:
                        "",

                    UsbLocalId:
                        ""
                });


            markDirty();

            render();
        };


    document
        .querySelectorAll(
            "[data-source]")
        .forEach(
            element =>
            {
                const index =
                    Number(
                        element.dataset.source);


                const property =
                    element.dataset.key;


                const handler =
                    () =>
                    {
                        const oldName = sources[index].Name;
                        sources[index][property] =
                            element.value;

                        if (property === "Name" && oldName !== element.value)
                        {
                            (state.definition.Cameras || []).forEach(camera =>
                            {
                                if (camera.TransportDeviceName === oldName)
                                    camera.TransportDeviceName = element.value;
                            });
                        }

                        if (property === "Type")
                            render();

                        markDirty();
                    };


                element.oninput =
                    handler;


                element.onchange =
                    handler;
            });


    document
        .querySelectorAll(
            "[data-remove-source]")
        .forEach(
            button =>
            {
                button.onclick =
                    () =>
                    {
                        const removeIndex = Number(button.dataset.removeSource);
                        const removedName = sources[removeIndex]?.Name;
                        sources.splice(removeIndex, 1);
                        (state.definition.Cameras || []).forEach(camera =>
                        {
                            if (camera.TransportDeviceName === removedName)
                                camera.TransportDeviceName = "";
                        });


                        markDirty();

                        render();
                    };
            });


    document
        .querySelectorAll(
            "[data-capability]")
        .forEach(
            checkbox =>
            {
                checkbox.onchange =
                    () =>
                    {
                        const parts =
                            checkbox
                                .dataset
                                .capability
                                .split(":");


                        const source =
                            sources[
                                Number(
                                    parts[0])];


                        const capability =
                            parts[1];


                        if (
                            capability ===
                            "video")
                        {
                            if (
                                checkbox.checked)
                            {
                                source.VideoStreamLocation =
                                    source.VideoStreamLocation ||
                                    "";


                                source.VideoMulticastAddress =
                                    source.VideoMulticastAddress ||
                                    "";
                            }
                            else
                            {
                                delete source.VideoStreamLocation;

                                delete source.VideoMulticastAddress;
                            }
                        }


                        if (
                            capability ===
                            "audio")
                        {
                            if (
                                checkbox.checked)
                            {
                                source.AudioSessionName =
                                    source.AudioSessionName ||
                                    "";
                            }
                            else
                            {
                                delete source.AudioSessionName;
                            }
                        }


                        if (
                            capability ===
                            "usb")
                        {
                            if (
                                checkbox.checked)
                            {
                                source.UsbLocalId =
                                    source.UsbLocalId ||
                                    "";
                            }
                            else
                            {
                                delete source.UsbLocalId;
                            }
                        }


                        markDirty();

                        render();
                    };
            });


    document
        .querySelectorAll(
            "[data-iptv-toggle]")
        .forEach(
            checkbox =>
            {
                checkbox.onchange =
                    () =>
                    {
                        const source =
                            sources[
                                Number(
                                    checkbox.dataset.iptvToggle)];


                        if (
                            checkbox.checked)
                        {
                            source.IPTV =
                            {
                                Name:
                                    "IPTV Device",

                                Type:
                                    "Tuner",

                                Brand:
                                    "BrightSign",

                                CommunicationMethod:
                                    "IR",

                                IrPort:
                                    1,

                                IrDriverFile:
                                    "",

                                Channel:
                                    ""
                            };
                        }
                        else
                        {
                            delete source.IPTV;
                        }


                        markDirty();

                        render();
                    };
            });


    document
        .querySelectorAll(
            "[data-iptv]")
        .forEach(
            element =>
            {
                const index =
                    Number(
                        element.dataset.iptv);


                const property =
                    element.dataset.key;


                const handler =
                    () =>
                    {
                        sources[index]
                            .IPTV[property] =

                            element.type === "number"

                            ? Number(
                                element.value)

                            : element.value;


                        markDirty();
                    };


                element.oninput =
                    handler;


                element.onchange =
                    handler;
            });


    document
        .querySelectorAll("[data-source-camera-toggle]")
        .forEach(checkbox =>
        {
            checkbox.onchange = () =>
            {
                const sourceIndex = Number(checkbox.dataset.sourceCameraToggle);
                const source = sources[sourceIndex];
                const cameras = state.definition.Cameras || (state.definition.Cameras = []);
                const existingIndex = sourceBoundCameraIndex(source);

                if (checkbox.checked)
                {
                    if (existingIndex < 0)
                    {
                        cameras.push({
                            Name: source.Name || `Camera ${cameras.length + 1}`,
                            Type: "PTZ",
                            Brand: "Visca",
                            TransportDeviceName: source.Name || "",
                            ControlMethod: "Serial",
                            ComPort: 1,
                            IpAddress: "",
                            Port: 0
                        });
                    }
                }
                else if (existingIndex >= 0)
                {
                    cameras.splice(existingIndex, 1);
                }

                markDirty();
                render();
            };
        });


    document
        .querySelectorAll("[data-source-camera]")
        .forEach(element =>
        {
            const cameraIndex = Number(element.dataset.cameraIndex);
            const property = element.dataset.key;
            const handler = () =>
            {
                const camera = state.definition.Cameras?.[cameraIndex];
                if (!camera) return;
                camera[property] = element.type === "number" ? Number(element.value || 0) : element.value;
                if (property === "ControlMethod")
                {
                    if (camera.ControlMethod === "Serial")
                    {
                        camera.ComPort = Number(camera.ComPort || 1);
                    }
                    else
                    {
                        camera.IpAddress = camera.IpAddress || "";
                        camera.Port = Number(camera.Port || 0);
                    }
                    render();
                }
                markDirty();
            };
            element.oninput = handler;
            element.onchange = handler;
        });
}

                        if (

                        {
                            destination.UsbLocalId =
                                destination.UsbLocalId ||
                                "";
                        }
                        else
                        {
                            delete destination.UsbLocalId;
                        }


                        markDirty();

                        render();
                    };
            });


    document
        .querySelectorAll(
            "[data-destination-display]")
        .forEach(
            checkbox =>
            {
                checkbox.onchange =
                    () =>
                    {
                        const destination =
                            destinations[
                                Number(
                                    checkbox.dataset.destinationDisplay)];

                        if (checkbox.checked)
                        {
                            const isProjector =
                                destination.Type === "Projector";

                            const displayType =
                                isProjector
                                    ? "Projector"
                                    : "LCD";

                            const selection =
                                firstDisplaySelectionForType(
                                    displayType);

                            destination.Display =
                            {
                                Name:
                                    destination.Name || "Display",

                                Type:
                                    displayType,

                                Brand:
                                    selection.brand,

                                Model:
                                    selection.model,

                                ComPort:
                                    1,

                                PollingIntervalMs:
                                    5000
                            };
                        }
                        else
                        {
                            delete destination.Display;
                        }

                        markDirty();
                        render();
                    };
            });


    document
        .querySelectorAll(
            "[data-display]")
        .forEach(
            element =>
            {
                const index =
                    Number(
                        element.dataset.display);

                const property =
                    element.dataset.key;

                const handler =
                    () =>
                    {
                        const destination =
                            destinations[index];

                        const display =
                            destination.Display;

                        if (!display)
                        {
                            return;
                        }

                        display[property] =
                            element.type === "number"
                                ? Number(element.value)
                                : element.value;

                        if (property === "Type")
                        {
                            destination.Type =
                                element.value === "Projector"
                                    ? "Projector"
                                    : "Monitor";

                            const selection =
                                firstDisplaySelectionForType(
                                    element.value);

                            display.Brand =
                                selection.brand;

                            display.Model =
                                selection.model;

                            if (
                                element.value !== "Projector")
                            {
                                delete display.Screen;
                            }

                            markDirty();
                            render();
                            return;
                        }

                        if (property === "Brand")
                        {
                            const models =
                                displayModelsForSelection(
                                    display.Type || "LCD",
                                    element.value);

                            display.Model =
                                models[0] || "";

                            markDirty();
                            render();
                            return;
                        }

                        markDirty();
                    };

                element.oninput = handler;
                element.onchange = handler;
            });


    document
        .querySelectorAll(
            "[data-display-screen]")
        .forEach(
            checkbox =>
            {
                checkbox.onchange =
                    () =>
                    {
                        const destination =
                            destinations[
                                Number(
                                    checkbox.dataset.displayScreen)];

                        const display =
                            destination.Display;

                        if (!display)
                        {
                            return;
                        }

                        if (checkbox.checked)
                        {
                            display.Screen =
                            {
                                UpRelay: 1,
                                DownRelay: 2,
                                PulseMilliseconds: 500
                            };
                        }
                        else
                        {
                            delete display.Screen;
                        }

                        markDirty();
                        render();
                    };
            });


    document
        .querySelectorAll(
            "[data-screen]")
        .forEach(
            element =>
            {
                const index =
                    Number(
                        element.dataset.screen);

                const property =
                    element.dataset.key;

                const handler =
                    () =>
                    {
                        const screen =
                            destinations[index]
                                .Display
                                ?.Screen;

                        if (!screen)
                        {
                            return;
                        }

                        screen[property] =
                            Number(element.value);

                        markDirty();
                    };

                element.oninput = handler;
                element.onchange = handler;
            });
}


/* =========================================================
   BIND DISPLAYS / CAMERAS / COMMUNICATIONS
   ========================================================= */

function bindDisplays()
{
    const destinations = state.definition.MatrixSwitcher.Decoders;

    document.querySelectorAll("[data-attach-display]").forEach(button =>
    {
        button.onclick = () =>
        {
            const index = Number(button.dataset.attachDisplay);
            const destination = destinations[index];
            if (!destination) return;
            const type = destination.Type === "Projector" ? "Projector" : "LCD";
            const selection = firstDisplaySelectionForType(type);
            destination.Display = {
                Name: destination.Name || "Display",
                Type: type,
                Brand: selection.brand,
                Model: selection.model,
                ComPort: 1,
                PollingIntervalMs: 5000
            };
            markDirty();
            render();
        };
    });

    document.querySelectorAll("[data-detach-display]").forEach(button =>
    {
        button.onclick = () =>
        {
            const index = Number(button.dataset.detachDisplay);
            if (!destinations[index]?.Display) return;
            if (confirm(`Remove display control from ${destinations[index].Name || "this destination"}?`))
            {
                delete destinations[index].Display;
                markDirty();
                render();
            }
        };
    });

    document.querySelectorAll("[data-display]").forEach(element =>
    {
        const index = Number(element.dataset.display);
        const property = element.dataset.key;
        const handler = () =>
        {
            const destination = destinations[index];
            const display = destination?.Display;
            if (!display) return;

            display[property] = element.type === "number" ? Number(element.value) : element.value;

            if (property === "Type")
            {
                destination.Type = element.value === "Projector" ? "Projector" : "Monitor";
                const selection = firstDisplaySelectionForType(element.value);
                display.Brand = selection.brand;
                display.Model = selection.model;
                if (element.value !== "Projector") delete display.Screen;
                markDirty(); render(); return;
            }

            if (property === "Brand")
            {
                const models = displayModelsForSelection(display.Type || "LCD", element.value);
                display.Model = models[0] || "";
                markDirty(); render(); return;
            }

            markDirty();
        };
        element.oninput = handler;
        element.onchange = handler;
    });

    document.querySelectorAll("[data-display-model-custom]").forEach(element =>
    {
        const index = Number(element.dataset.displayModelCustom);
        const handler = () =>
        {
            const display = destinations[index]?.Display;
            if (!display) return;
            display.Model = element.value.trim();
            markDirty();
        };
        element.oninput = handler;
        element.onchange = handler;
    });

    document.querySelectorAll("[data-display-screen]").forEach(checkbox =>
    {
        checkbox.onchange = () =>
        {
            const display = destinations[Number(checkbox.dataset.displayScreen)]?.Display;
            if (!display) return;
            if (checkbox.checked) display.Screen = {UpRelay: 1, DownRelay: 2, PulseMilliseconds: 500};
            else delete display.Screen;
            markDirty(); render();
        };
    });

    document.querySelectorAll("[data-screen]").forEach(element =>
    {
        const index = Number(element.dataset.screen);
        const property = element.dataset.key;
        const handler = () =>
        {
            const screen = destinations[index]?.Display?.Screen;
            if (!screen) return;
            screen[property] = Number(element.value);
            markDirty();
        };
        element.oninput = handler;
        element.onchange = handler;
    });
}


function bindCameras()
{
    const cameras = state.definition.Cameras;
    const add = document.getElementById("add-camera") || document.getElementById("add-camera-empty");
    if (add)
    {
        add.onclick = () =>
        {

function bindObjectInputs(selector, target)
{
    document.querySelectorAll(selector).forEach(element =>
    {
        const property = element.dataset.key;
        const handler = () =>
        {
            target[property] = element.type === "number" ? Number(element.value) : element.value;
            markDirty();
        };
        element.oninput = handler;
        element.onchange = handler;
    });
}

function bindIndexedCollection(
    selector,
    collection,
    datasetName)
{
    document
        .querySelectorAll(
            selector)
        .forEach(
            element =>
            {
                const index =
                    Number(
                        element.dataset[
                            datasetName]);


                const property =
                    element.dataset.key;


                const handler =
                    () =>
                    {
                        collection[index][property] =

                            element.type === "number"

                            ? Number(
                                element.value)

                            : element.value;


                        markDirty();
                    };


                element.oninput =
                    handler;


                element.onchange =
                    handler;
            });
}


/* =========================================================
   VALIDATE / SAVE / REVERT
   ========================================================= */


async function validateDefinition(navigateToAdvanced = true)
{
    syncAdvancedJson();

    try
    {
        const response = await api(
            "validate",
            "POST",
            {Definition: state.definition});

        state.validation = getApiValue(response) || {};

        if (navigateToAdvanced)
        {
            state.page = "advanced";
        }

        render();
        return state.validation;
    }
    catch (exception)
    {
        state.validation = {
            Success: false,
            Errors: [{Path: "", Code: "RequestFailed", Message: exception.message}],
            Warnings: []
        };

        if (navigateToAdvanced)
        {
            state.page = "advanced";
        }

        render();
        return state.validation;
    }
}


function diffValues(before, after, path = "")
{
    if (JSON.stringify(before) === JSON.stringify(after))
    {
        return [];
    }

    const beforeObject = before && typeof before === "object";
    const afterObject = after && typeof after === "object";

    if (!beforeObject || !afterObject || Array.isArray(before) !== Array.isArray(after))
    {
        return [{path: path || "(definition)", before, after}];
    }

    if (Array.isArray(before) && Array.isArray(after))
    {
        const changes = [];
        const length = Math.max(before.length, after.length);
        for (let i = 0; i < length; i++)
        {
            const childPath = `${path}[${i}]`;
            if (i >= before.length)
            {
                changes.push({path: childPath, before: undefined, after: after[i]});
            }
            else if (i >= after.length)
            {
                changes.push({path: childPath, before: before[i], after: undefined});
            }
            else
            {
                changes.push(...diffValues(before[i], after[i], childPath));
            }
        }
        return changes;
    }

    const changes = [];
    const keys = new Set([
        ...Object.keys(before || {}),
        ...Object.keys(after || {})
    ]);

    keys.forEach(key =>
    {
        const childPath = path ? `${path}.${key}` : key;
        if (!(key in (before || {})))
        {
            changes.push({path: childPath, before: undefined, after: after[key]});
        }
        else if (!(key in (after || {})))
        {
            changes.push({path: childPath, before: before[key], after: undefined});
        }
        else
        {
            changes.push(...diffValues(before[key], after[key], childPath));
        }
    });

    return changes;
}


function compactValue(value)
{
    if (value === undefined) return "<not present>";
    if (value === null) return "null";
    if (typeof value === "object")
    {
        const json = JSON.stringify(value);
        return json.length > 180 ? json.slice(0, 177) + "..." : json;
    }
    return String(value);
}


function closeSavePreview()
{
    document.getElementById("save-preview-modal")?.remove();
}


function showSavePreview()
{
    const comparisonBaseline = state.processorBaseline || {};
    const changes = diffValues(comparisonBaseline, state.definition);
    const warnings = state.validation?.Warnings || [];

    const backdrop = document.createElement("div");
    backdrop.id = "save-preview-modal";
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="save-preview-title">
            <div class="modal-header">
                <div>
                    <h2 id="save-preview-title" style="margin:0">Apply System Definition</h2>
                    <div class="muted">Review changes against the definition currently stored on this processor.</div>
                </div>
                <button id="save-preview-close" class="btn ghost">Close</button>
            </div>
            <div class="modal-body">
                <div class="notice ${warnings.length ? "" : "good"}">
                    Validation passed with ${warnings.length} warning(s). Saving will rebuild the running room using this definition.
                </div>
                ${changes.length
                    ? `<div class="change-list">
                        <div class="change-row" style="font-weight:700">
                            <div>Path</div><div>Processor</div><div>Proposed</div>
                        </div>
                        ${changes.slice(0, 120).map(change => `
                            <div class="change-row">
                                <div class="change-path">${escapeHtml(change.path)}</div>
                                <div class="change-value">${escapeHtml(compactValue(change.before))}</div>
                                <div class="change-value">${escapeHtml(compactValue(change.after))}</div>
                            </div>`).join("")}
                       </div>
                       ${changes.length > 120 ? `<div class="notice" style="margin-top:12px">Showing the first 120 of ${changes.length} changes.</div>` : ""}`
                    : `<div class="empty" style="margin-top:14px">No differences from the processor definition were detected.</div>`}
            </div>
            <div class="modal-footer">
                <div class="muted">${changes.length} changed value(s)</div>
                <div class="actions">
                    <button id="save-preview-cancel" class="btn ghost">Cancel</button>
                    <button id="save-preview-apply" class="btn good">Apply Configuration</button>
                </div>
            </div>
        </div>`;

    document.body.appendChild(backdrop);
    document.getElementById("save-preview-close").onclick = closeSavePreview;
    document.getElementById("save-preview-cancel").onclick = closeSavePreview;
    document.getElementById("save-preview-apply").onclick = async () =>
    {
        closeSavePreview();
        await performSaveDefinition();
    };
    backdrop.onclick = event =>
    {
        if (event.target === backdrop) closeSavePreview();
    };
}


async function saveDefinition()
{
    syncAdvancedJson();

    const validation = await validateDefinition(false);
    const errors = validation?.Errors || [];

    if (errors.length > 0 || validation?.Success === false)
    {
        state.page = "advanced";
        render();
        return;
    }

    showSavePreview();
}


async function performSaveDefinition()
{
    try
    {
        const response = await api(
            "save",
            "POST",
            {Definition: state.definition});

        const result = getApiValue(response) || {};
        if (result.Success === false)
        {
            throw new Error(result.Message || "Save failed.");
        }

        state.baseline = clone(state.definition);
        state.processorBaseline = clone(state.definition);
        state.dirty = false;
        state.status = {
            ...state.status,
            Exists: true,
            SystemName: state.definition.Name,
            WorkingSystemName: state.definition.Name,
            ImportedFileName: null,
            RequiresRestart: false
        };

        render();
        alert("SystemDefinition saved successfully. The running room is being reconfigured using the updated definition.");
    }
    catch (exception)
    {
        alert(exception.message);
    }
}


function revertChanges()
{
    if (!state.dirty)
    {
        return;
    }


    if (
        !confirm(
            "Revert all unsaved changes?"))
    {
        return;
    }


    state.definition =
        clone(
            state.baseline);


    state.dirty =
        false;


    state.validation =
        null;


    render();
}

function syncAdvancedJson()
{
    const textarea =
        document.getElementById(
            "raw-json");


    if (!textarea)
    {
        return true;
    }


    try
    {
        state.definition =
            normalizeDefinition(
                JSON.parse(
                    textarea.value));


        markDirty();

        return true;
    }
    catch (exception)
    {
        const error =
            document.getElementById(
                "raw-error");


        if (error)
        {
            error.style.display =
                "block";


            error.textContent =
                exception.message;
        }


        return false;
    }
}


/* =========================================================
   PAGE EVENT BINDING
   ========================================================= */


function bindPage()
{
    switch (state.page)
    {
        case "overview":
            bindSimpleInput("system-name", value => state.definition.Name = value);
            bindSimpleInput("matrix-name", value => state.definition.MatrixSwitcher.Name = value);
            bindSimpleInput("matrix-type", value => state.definition.MatrixSwitcher.Type = value);
            bindDefinitionImportSurface(
                "overview-definition-drop-zone",
                "overview-definition-file-input",
                "overview-open-definition");
            break;

        case "sources":
            bindSources();
            break;

        case "destinations":
            bindDestinations();
            break;

        case "displays":
            bindDisplays();
            break;

        case "cameras":
            bindCameras();
            break;

        case "communications":
            bindCommunications();
            break;

        case "dsp":
            bindDsp();
            break;

        case "settings":
            bindSettings();
            break;

        case "assistant":
            bindAssistant();
            break;

        case "advanced":
        {
            const rawJson = document.getElementById("raw-json");
            bindJsonEditor(rawJson);

            const format = document.getElementById("format-json");
            if (format)
            {
                format.onclick = () =>
                {
                    if (syncAdvancedJson())
                    {
                        rawJson.value = JSON.stringify(state.definition, null, 2);
                        refreshJsonEditor(rawJson);
                    }
                };
            }

            ["advanced-validate", "advanced-validate-top"].forEach(id =>
            {
                const button = document.getElementById(id);
                if (button)
                {
                    button.onclick = async () =>
                    {
                        if (!syncAdvancedJson()) return;
                        await validateDefinition(false);
                        render();
                    };
                }
            });
            break;
        }
    }
}
