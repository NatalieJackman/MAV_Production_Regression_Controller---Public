<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MAV System Definition</title>

<style>
:root {
    --bg: #07111f;
    --sidebar: #081626;
    --panel: #0e1d30;
    --panel2: #13263d;
    --line: #29435f;

    --text: #e8eef6;
    --muted: #91a5bb;

    --blue: #58a6ff;
    --green: #46d39a;
    --yellow: #f0b85a;
    --red: #ff6d75;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =========================================================
   SHELL
   ========================================================= */

.shell {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
}

.sidebar {
    background: var(--sidebar);
    border-right: 1px solid var(--line);

    padding: 22px 16px;

    position: sticky;
    top: 0;

    height: 100vh;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 0 8px 24px;
}

.logo {
    width: 40px;
    height: 40px;

    border-radius: 10px;

    display: grid;
    place-items: center;

    background:
        linear-gradient(
            135deg,
            #72bdff,
            #8df0d2);

    color: #07111f;

    font-weight: 900;
}

.brand-title {
    font-weight: 800;
}

.muted {
    color: var(--muted);
    font-size: 12px;
}

.nav {
    display: grid;
    gap: 7px;
}

.nav button {
    width: 100%;

    border: 1px solid transparent;

    background: transparent;

    color: var(--muted);

    text-align: left;

    padding: 11px 12px;

    border-radius: 9px;
}

.nav button:hover,
.nav button.active {
    background: #142944;

    border-color: #294d70;

    color: white;
}

.sidebar-footer {
    position: absolute;

    left: 16px;
    right: 16px;
    bottom: 20px;

    padding-top: 14px;

    border-top: 1px solid var(--line);

    color: var(--muted);

    font-size: 12px;
}

.main {
    min-width: 0;

    padding-bottom: 86px;
}

.topbar {
    height: 76px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 28px;

    border-bottom: 1px solid var(--line);

    background: rgba(7, 17, 31, .94);

    position: sticky;
    top: 0;
    z-index: 10;
}

.topbar h1 {
    margin: 0;

    font-size: 21px;
}

.status-row {
    display: flex;
    gap: 8px;

    flex-wrap: wrap;
}

/* =========================================================
   COMMON COMPONENTS
   ========================================================= */

.content {
    padding: 26px 28px;

    max-width: 1500px;

    margin: auto;
}

.card {
    background:
        linear-gradient(
            180deg,
            var(--panel),
            #0b192a);

    border: 1px solid var(--line);

    border-radius: 13px;

    overflow: hidden;
}

.card + .card {
    margin-top: 18px;
}

.card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 16px 18px;

    border-bottom: 1px solid var(--line);
}

.card-header h2 {
    margin: 0;

    font-size: 15px;
}

.card-body {
    padding: 18px;
}

.grid-3 {
    display: grid;

    grid-template-columns:
        repeat(
            3,
            minmax(0, 1fr));

    gap: 18px;
}

.metric {
    font-size: 30px;

    font-weight: 800;
}

.metric-label {
    color: var(--muted);

    font-size: 12px;
}

.form-grid {
    display: grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0, 1fr));

    gap: 14px 16px;
}

.form-grid.three {
    grid-template-columns:
        repeat(
            3,
            minmax(0, 1fr));
}

.field {
    display: grid;
    gap: 6px;
}

.field label {
    color: #becdde;

    font-size: 12px;

    font-weight: 650;
}

input,
select,
textarea {
    width: 100%;

    padding: 10px 11px;

    color: var(--text);

    background: #091625;

    border: 1px solid #2c455f;

    border-radius: 8px;

    outline: none;
}

input:focus,
select:focus,
textarea:focus {
    border-color: var(--blue);

    box-shadow:
        0 0 0 2px
        rgba(
            88,
            166,
            255,
            .14);
}

textarea {
    min-height: 500px;

    font-family:
        Consolas,
        monospace;

    font-size: 12px;

    line-height: 1.45;
}

.btn {
    border:
        1px solid
        #35516f;

    background: #132b46;

    color: #edf5ff;

    padding: 9px 13px;

    border-radius: 8px;

    font-weight: 700;
}

.btn.primary {
    background: #176aa9;

    border-color: #2688cf;
}

.btn.good {
    background: #126448;

    border-color: #21866a;
}

.btn.danger {
    background: #562128;

    border-color: #85343d;
}

.btn.small {
    padding: 6px 9px;

    font-size: 12px;
}

.btn.ghost {
    background: transparent;
}

.pill {
    padding: 6px 9px;

    border:
        1px solid
        var(--line);

    border-radius: 999px;

    background: #0a1828;

    color: var(--muted);

    font-size: 12px;
}

.pill.good {
    color: #c7f7e5;

    border-color: #286b58;

    background: #0b2b24;
}

.pill.warn {
    color: #ffe2a6;

    border-color: #74582a;

    background: #2e230f;
}

.device-list {
    display: grid;

    gap: 14px;
}

.device {
    border:
        1px solid
        #29425e;

    border-radius: 11px;

    background: #0a192a;

    overflow: hidden;
}

.device header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 12px 14px;

    background: #10233a;

    border-bottom:
        1px solid
        #29425e;
}

.device-body {
    padding: 14px;
}

.subsection {
    margin-top: 15px;

    padding-top: 15px;

    border-top:
        1px solid
        var(--line);
}

.subsection-title {
    margin-bottom: 10px;

    color: #bcd0e6;

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: .08em;
}

.checks {
    display: flex;

    gap: 16px;

    flex-wrap: wrap;
}

.check {
    display: flex;

    align-items: center;

    gap: 7px;

    color: #c7d3df;

    font-size: 12px;
}

.check input {
    width: auto;
}

.empty {
    padding: 28px;

    border:
        1px dashed
        #35516f;

    border-radius: 10px;

    background: #091725;

    color: var(--muted);

    text-align: center;
}

.notice {
    padding: 12px 14px;

    border:
        1px solid
        #3a536f;

    border-radius: 9px;

    background: #0b1a2b;

    color: #c1cfdd;

    font-size: 13px;
}

.notice.good {
    background: #0b2c25;

    border-color: #286d59;

    color: #c8f7e7;
}

.notice.bad {
    background: #31171b;

    border-color: #7b3941;

    color: #ffc4c8;
}

/* =========================================================
   BOTTOM ACTION BAR
   ========================================================= */

.sticky {
    position: fixed;

    left: 240px;
    right: 0;
    bottom: 0;

    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 28px;

    border-top: 1px solid var(--line);

    background: rgba(7, 17, 31, .96);

    z-index: 20;
}

.actions {
    display: flex;

    gap: 8px;
}

.unsaved {
    color: var(--yellow);

    font-size: 12px;
}

/* =========================================================
   FIRST RUN
   ========================================================= */

.create-wrap,
.loading {
    min-height: 100vh;

    display: grid;

    place-items: center;

    padding: 24px;

    background:
        radial-gradient(
            circle at 50% 20%,
            #17304d,
            #07111f 52%);
}

.create-card {
    width:
        min(
            560px,
            100%);

    padding: 30px;

    background: #0d1e31;

    border:
        1px solid
        #304964;

    border-radius: 16px;
}

.create-card h1 {
    margin: 16px 0 8px;
}

.create-card p {
    color: var(--muted);

    line-height: 1.5;
}


.create-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
}

.create-divider::before,
.create-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
}

.definition-drop-zone {
    padding: 24px 20px;
    border: 2px dashed #355b7e;
    border-radius: 12px;
    background: #091827;
    text-align: center;
    transition:
        border-color .15s ease,
        background .15s ease,
        transform .15s ease;
}

.definition-drop-zone.dragover {
    border-color: var(--blue);
    background: #102744;
    transform: translateY(-1px);
}

.definition-drop-icon {
    width: 42px;
    height: 42px;
    margin: 0 auto 10px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: #132b46;
    color: #bfe0ff;
    font-size: 22px;
    font-weight: 800;
}

.definition-drop-title {
    color: var(--text);
    font-size: 14px;
    font-weight: 750;
}

.definition-drop-hint {
    margin-top: 6px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
}

.definition-drop-actions {
    margin-top: 14px;
}

.definition-file-input {
    display: none;
}

.validation-list {
    display: grid;

    gap: 10px;

    margin-top: 12px;
}

.validation-item {
    padding: 11px 12px;

    border:
        1px solid
        var(--line);

    border-left-width: 4px;

    border-radius: 8px;

    background: #0a1828;
}

.validation-item.error {
    border-left-color: var(--red);
}

.validation-item.warning {
    border-left-color: var(--yellow);
}

.validation-path {
    font-family:
        Consolas,
        monospace;

    font-size: 12px;
}

.validation-message {
    margin-top: 4px;

    color: var(--muted);

    font-size: 12px;
}

@media (max-width: 950px) {

    .shell {
        grid-template-columns: 1fr;
    }

    .sidebar {
        position: relative;

        height: auto;
    }

    .sidebar-footer {
        position: static;

        margin-top: 16px;
    }

    .nav {
        grid-template-columns:
            repeat(
                3,
                1fr);
    }

    .sticky {
        left: 0;
    }

    .grid-3,
    .form-grid,
    .form-grid.three {
        grid-template-columns:
            1fr;
    }
}
/* =========================================================
   INLINE VALIDATION / SAVE PREVIEW
   ========================================================= */

.field-validation {
    margin-top: 6px;
    padding: 7px 9px;
    border-radius: 7px;
    font-size: 11px;
    line-height: 1.4;
}

.field-validation.error {
    color: #ffc4c8;
    background: #31171b;
    border: 1px solid #7b3941;
}

.field-validation.warning {
    color: #ffe2a6;
    background: #2e230f;
    border: 1px solid #74582a;
}

.inline-validation-summary {
    margin-top: 12px;
    display: grid;
    gap: 7px;
}

.modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(2, 8, 15, .78);
}

.modal-card {
    width: min(900px, 100%);
    max-height: 86vh;
    overflow: auto;
    background: #0d1e31;
    border: 1px solid #35516f;
    border-radius: 14px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .45);
}

.modal-header,
.modal-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
}

.modal-header {
    border-bottom: 1px solid var(--line);
}

.modal-footer {
    border-top: 1px solid var(--line);
}

.modal-body {
    padding: 18px;
}

/* =========================================================
   ASSISTANT LOCAL CHAT EXPORT
   ========================================================= */

.assistant-export-form {
    display: grid;
    gap: 14px;
}

.assistant-export-local-notice {
    display: grid;
    gap: 6px;
    padding: 12px 14px;
    border: 1px solid #2f7652;
    border-radius: 10px;
    background: rgba(25, 111, 70, .13);
}

.assistant-export-local-notice strong {
    color: #7fe3aa;
}

.assistant-export-field {
    display: grid;
    gap: 6px;
}

.assistant-export-field label {
    font-size: 12px;
    font-weight: 700;
}

.assistant-export-field input {
    width: 100%;
}

.assistant-export-contents {
    display: grid;
    gap: 6px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(255, 255, 255, .025);
    font-size: 12px;
}

.assistant-export-contents span::before {
    content: "✓";
    margin-right: 8px;
    color: #65d696;
    font-weight: 800;
}

.assistant-export-status {
    min-height: 18px;
    font-size: 12px;
}

body[data-site-theme="day"] .assistant-export-local-notice {
    background: #edf9f2;
    border-color: #8bc7a5;
}

body[data-site-theme="day"] .assistant-export-local-notice strong {
    color: #176b42;
}

.change-list {
    display: grid;
    gap: 8px;
    margin-top: 14px;
}

.change-row {
    display: grid;
    grid-template-columns: minmax(220px, .9fr) minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #091725;
    font-size: 12px;
}

.change-path {
    font-family: Consolas, monospace;
    color: #bcd0e6;
}

.change-value {
    overflow-wrap: anywhere;
}

.section-jump {
    color: var(--blue);
    cursor: pointer;
    text-decoration: underline;
}


/* =========================================================
   PRODUCTIZED DEVICE PAGES / ADVANCED JSON
   ========================================================= */

.page-metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
}

.page-metric {
    padding: 14px;
    background: #0a192a;
    border: 1px solid var(--line);
    border-radius: 10px;
}

.page-metric strong {
    display: block;
    font-size: 20px;
    margin-bottom: 3px;
}

.device-context {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

.inline-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
}

.advanced-json-page {
    display: grid;
    gap: 18px;
}

.advanced-json-card {
    min-height: 0;
}

.advanced-json-card .card-body {
    padding-bottom: 12px;
}

/* VS Code-inspired JSON editor ----------------------------------------- */
.json-editor-shell {
    --json-editor-bg: #1e1e1e;
    --json-editor-gutter: #181818;
    --json-editor-text: #d4d4d4;
    --json-editor-line: rgba(255, 255, 255, .045);
    --json-editor-line-number: #858585;
    --json-editor-line-number-active: #c6c6c6;
    --json-editor-key: #9cdcfe;
    --json-editor-string: #ce9178;
    --json-editor-number: #b5cea8;
    --json-editor-keyword: #569cd6;
    --json-editor-punctuation: #d4d4d4;
    --json-editor-border: #3b3b3b;
    --json-editor-focus: #007acc;
    --json-editor-focus-ring: rgba(0, 122, 204, .35);
    --json-editor-divider: #2a2a2a;
    --json-editor-status-bg: #181818;
    --json-editor-status-text: #cccccc;
    --json-editor-status-muted: #969696;
    --json-editor-caret: #aeafad;
    --json-editor-selection: rgba(38, 79, 120, .78);
    --json-editor-change-marker: #e2c08d;

    min-height: 360px;
    height: calc(100vh - 330px);
    max-height: calc(100vh - 250px);
    display: grid;
    grid-template-rows: minmax(0, 1fr) 28px;
    border: 1px solid var(--json-editor-border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--json-editor-bg);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .02);
}

.json-editor-shell:focus-within {
    border-color: var(--json-editor-focus);
    box-shadow: 0 0 0 1px var(--json-editor-focus-ring);
}

.json-editor-frame {
    min-height: 0;
    display: grid;
    grid-template-columns: 58px minmax(0, 1fr);
    overflow: hidden;
}

.json-line-numbers {
    min-width: 0;
    overflow: hidden;
    padding: 12px 10px 12px 0;
    background: var(--json-editor-gutter);
    border-right: 1px solid var(--json-editor-divider);
    color: var(--json-editor-line-number);
    font-family: Consolas, "Courier New", monospace;
    font-size: 14px;
    line-height: 1.55;
    text-align: right;
    user-select: none;
}

.json-line-number {
    display: block;
    height: 1.55em;
    padding-right: 4px;
}

.json-line-number.active {
    color: var(--json-editor-line-number-active);
}

.json-line-number.changed {
    box-shadow: inset -3px 0 0 var(--json-editor-change-marker);
}

.json-change-overview {
    position: absolute;
    top: 2px;
    right: 2px;
    bottom: 2px;
    width: 5px;
    z-index: 4;
    pointer-events: none;
}

.json-change-overview-marker {
    position: absolute;
    right: 0;
    width: 3px;
    min-height: 2px;
    border-radius: 1px;
    background: var(--json-editor-change-marker);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--json-editor-bg) 55%, transparent);
}

.json-code-pane {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: var(--json-editor-bg);
}

.json-highlight,
#raw-json {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 12px 14px;
    border: 0;
    border-radius: 0;
    font-family: Consolas, "Courier New", monospace;
    font-size: 14px;
    line-height: 1.55;
    tab-size: 4;
    white-space: pre;
    overflow-wrap: normal;
    word-break: normal;
}

.json-highlight {
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
    color: var(--json-editor-text);
    background: transparent;
}

.json-code-line {
    display: block;
    min-width: max-content;
    height: 1.55em;
    margin: 0 -14px;
    padding: 0 14px;
}

.json-code-line.active {
    background: var(--json-editor-line);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .012),
                inset 0 -1px 0 rgba(255, 255, 255, .012);
}

#raw-json {
    z-index: 2;
    resize: none;
    overflow: auto;
    outline: none;
    background: transparent;
    color: transparent;
    caret-color: var(--json-editor-caret);
    -webkit-text-fill-color: transparent;
}

#raw-json::selection {
    background: var(--json-editor-selection);
    color: transparent;
    -webkit-text-fill-color: transparent;
}

.json-token-key {
    color: var(--json-editor-key);
}

.json-token-string {
    color: var(--json-editor-string);
}

.json-token-number {
    color: var(--json-editor-number);
}

.json-token-keyword {
    color: var(--json-editor-keyword);
}

.json-token-punctuation {
    color: var(--json-editor-punctuation);
}


/* JSON IntelliSense --------------------------------------------------- */
.json-intellisense {
    position: absolute;
    z-index: 20;
    display: none;
    width: min(420px, calc(100% - 24px));
    max-height: 260px;
    overflow: auto;
    border: 1px solid var(--json-editor-border);
    border-radius: 6px;
    background: var(--json-editor-bg);
    color: var(--json-editor-text);
    box-shadow: 0 10px 28px rgba(0, 0, 0, .28);
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px;
}

.json-intellisense.open {
    display: block;
}

.json-intellisense-item {
    display: grid;
    grid-template-columns: 18px minmax(0, 1fr) auto;
    gap: 8px;
    align-items: center;
    padding: 7px 9px;
    border-bottom: 1px solid var(--json-editor-divider);
    cursor: default;
}

.json-intellisense-item:last-child {
    border-bottom: 0;
}

.json-intellisense-item.active {
    background: var(--json-editor-line);
    outline: 1px solid var(--json-editor-focus);
    outline-offset: -1px;
}

.json-intellisense-kind {
    width: 16px;
    height: 16px;
    display: grid;
    place-items: center;
    border-radius: 3px;
    background: var(--json-editor-focus);
    color: white;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 9px;
    font-weight: 800;
}

.json-intellisense-label {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.json-intellisense-detail {

    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 11px;
    white-space: nowrap;
}

.json-intellisense-empty {

}

.json-editor-status {

    justify-content: flex-end;
    gap: 18px;
    padding: 0 10px;

    background: var(--json-editor-status-bg);
    color: var(--json-editor-status-text);
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 11px;
    user-select: none;
}

.json-editor-status .muted-status {

}

.validation-summary-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
}

@media (max-height: 760px) {
    .json-editor-shell {
        min-height: 300px;
        height: calc(100vh - 270px);
    }
}


/* =========================================================
   SITE SETTINGS / APPEARANCE
   These preferences are browser-local and never touch SystemDefinition.
   ========================================================= */

.nav-site-group {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
}

.nav-group-label {
    padding: 0 12px 7px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
}

.settings-page {
    display: grid;
    gap: 18px;
}

.settings-options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 12px;
}

.setting-choice {
    width: 100%;
    min-height: 112px;
    padding: 15px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: #0a192a;
    color: var(--text);
    text-align: left;
    transition: border-color .15s ease, background .15s ease, transform .15s ease;
}

.setting-choice:hover {
    transform: translateY(-1px);
    border-color: #47729d;
    background: #10233a;
}

.setting-choice.active {
    border-color: var(--blue);
    box-shadow: 0 0 0 2px rgba(88, 166, 255, .13);
    background: #112a45;
}

.setting-choice-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 14px;
    font-weight: 800;
}

.setting-choice-description {
    margin-top: 7px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
}

.setting-check {
    width: 18px;
    height: 18px;
    display: grid;
    place-items: center;
    border: 1px solid #49647e;
    border-radius: 999px;
    color: transparent;
    font-size: 12px;
    flex: 0 0 auto;
}

.setting-choice.active .setting-check {
    color: white;
    background: var(--blue);
    border-color: var(--blue);
}

.editor-theme-preview {
    margin-top: 11px;
    padding: 9px 10px;
    border: 1px solid #3b3b3b;
    border-radius: 7px;
    background: #0a1624;
    color: #d6e2ef;
    font-family: Consolas, "Courier New", monospace;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
}

.editor-theme-preview .preview-key { color: #62c4ff; }
.editor-theme-preview .preview-string { color: #8fe1c0; }
.editor-theme-preview .preview-number { color: #f0b85a; }
.editor-theme-preview .preview-brace { color: #d6e2ef; }

.editor-theme-preview.vscode { background: #1e1e1e; color: #d4d4d4; }
.editor-theme-preview.vscode .preview-key { color: #9cdcfe; }
.editor-theme-preview.vscode .preview-string { color: #ce9178; }
.editor-theme-preview.vscode .preview-number { color: #b5cea8; }
.editor-theme-preview.vscode .preview-brace { color: #ffd700; }
.editor-theme-preview.vscode .preview-brace.alt { color: #da70d6; }

body[data-editor-appearance="day"] .editor-theme-preview {
    border-color: #c8d7e5;
    background: #f7fbff;
    color: #1d3448;
}

body[data-editor-appearance="day"] .editor-theme-preview .preview-key { color: #0067a3; }
body[data-editor-appearance="day"] .editor-theme-preview .preview-string { color: #1c7a5b; }
body[data-editor-appearance="day"] .editor-theme-preview .preview-number { color: #a85f00; }

    background: #ffffff;

}

body[data-editor-appearance="day"] .editor-theme-preview.vscode .preview-string { color: #a31515; }
body[data-editor-appearance="day"] .editor-theme-preview.vscode .preview-number { color: #098658; }
body[data-editor-appearance="day"] .editor-theme-preview.vscode .preview-brace { color: #af00db; }
body[data-editor-appearance="day"] .editor-theme-preview.vscode .preview-brace.alt { color: #0000ff; }

.settings-note {
    margin-top: 10px;

}

.settings-local-pill {
    display: inline-flex;

/* =========================================================
   MAV ASSISTANT — AIR-GAPPED LOCAL AI
   ========================================================= */

.assistant-page {
    display: grid;
    gap: 18px;
}

.assistant-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.55fr) minmax(280px, .75fr);
    gap: 18px;
    align-items: start;
}

.assistant-chat-card {
    min-height: 580px;
}

.assistant-chat-card .card-body {
    padding: 0;
}

.assistant-status-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
}

.assistant-transcript {
    min-height: 390px;
    max-height: 58vh;
    overflow: auto;
    padding: 18px;
    display: grid;
    align-content: start;
    gap: 12px;
    background: color-mix(in srgb, var(--panel) 78%, var(--bg));
    border-bottom: 1px solid var(--line);
}

.assistant-message {
    width: min(86%, 760px);
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: 11px;
    line-height: 1.48;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 13px;
}

.assistant-message.has-copy {
    position: relative;
    padding-right: 46px;
}

.assistant-copy-button {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    opacity: .72;
    display: grid;
    place-items: center;
}

.assistant-copy-button:hover,
.assistant-copy-button:focus-visible {
    opacity: 1;
    color: var(--text);
    border-color: var(--line);
    background: color-mix(in srgb, var(--panel) 76%, transparent);
    outline: none;
}

.assistant-copy-button.copied {
    color: var(--green);
    opacity: 1;
}

.assistant-copy-icon {
    position: relative;
    width: 14px;
    height: 14px;
    display: block;
}

.assistant-copy-icon::before,
.assistant-copy-icon::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 9px;
    border: 1.5px solid currentColor;
    border-radius: 2px;
    box-sizing: border-box;
}

.assistant-copy-icon::before {
    left: 1px;
    top: 1px;
}

.assistant-copy-icon::after {
    left: 5px;
    top: 4px;
    background: var(--panel2);
}

.assistant-message.user .assistant-copy-icon::after {
    background: color-mix(in srgb, var(--blue) 16%, var(--panel2));
}

.assistant-message.user {
    justify-self: end;
    background: color-mix(in srgb, var(--blue) 16%, var(--panel2));
    border-color: color-mix(in srgb, var(--blue) 48%, var(--line));
}

.assistant-message.assistant {
    justify-self: start;
    background: var(--panel2);
}

.assistant-response-meta {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 7px;
}

.assistant-source-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 7px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 10px;
    font-weight: 750;
    letter-spacing: .02em;
    line-height: 1.2;
}

.assistant-source-badge.knowledge {
    color: color-mix(in srgb, var(--green) 78%, var(--text));
    border-color: color-mix(in srgb, var(--green) 55%, var(--line));
    background: color-mix(in srgb, var(--green) 10%, var(--panel2));
}

.assistant-source-badge.ai {
    color: color-mix(in srgb, var(--blue) 82%, var(--text));
    border-color: color-mix(in srgb, var(--blue) 58%, var(--line));
    background: color-mix(in srgb, var(--blue) 10%, var(--panel2));
}

.assistant-source-badge.hybrid {
    color: color-mix(in srgb, #9b7cff 84%, var(--text));
    border-color: color-mix(in srgb, #9b7cff 58%, var(--line));
    background: color-mix(in srgb, #9b7cff 11%, var(--panel2));
}

.assistant-message.system {
    justify-self: stretch;
    width: 100%;
    color: var(--muted);
    background: transparent;
    border-style: dashed;
    font-size: 12px;
}

.assistant-trace-message {
    justify-self: start;
    width: min(86%, 760px);
}

.assistant-interpretation-trace {
    overflow: hidden;
    border: 1px solid color-mix(in srgb, #9b7cff 48%, var(--line));
    border-radius: 10px;
    background: color-mix(in srgb, #9b7cff 7%, var(--panel2));
}

.assistant-interpretation-trace > summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 12px;
    cursor: pointer;
    list-style: none;
    user-select: none;
    color: color-mix(in srgb, #b8a7ff 86%, var(--text));
    font-size: 12px;
    font-weight: 750;
}

.assistant-interpretation-trace > summary::-webkit-details-marker {
    display: none;
}

.assistant-interpretation-trace > summary::after {
    content: "▸";
    margin-left: auto;
    color: var(--muted);
    transition: transform .14s ease;
}

.assistant-interpretation-trace[open] > summary::after {
    transform: rotate(90deg);
}

.assistant-trace-summary-main {
    display: inline-flex;
    align-items: center;
    gap: 7px;
}

.assistant-trace-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #9b7cff;
    box-shadow: 0 0 0 3px color-mix(in srgb, #9b7cff 16%, transparent);
}

.assistant-trace-summary-meta {
    margin-left: auto;
    color: var(--muted);
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
}

.assistant-trace-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 0;
    padding: 0 12px 12px;
    border-top: 1px solid color-mix(in srgb, #9b7cff 25%, var(--line));
}

.assistant-trace-note {
    padding: 10px 0;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.45;
}

.assistant-trace-row {
    display: grid;
    grid-template-columns: 110px minmax(0, 1fr);
    gap: 12px;
    padding: 6px 0;
    border-top: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
    font-size: 11px;
}

.assistant-trace-label {
    color: var(--muted);
    font-weight: 650;
}

.assistant-trace-value {
    min-width: 0;
    overflow-wrap: anywhere;
    color: var(--text);
}

.assistant-trace-value.mono,
.assistant-trace-block pre {
    font-family: Consolas, "Courier New", monospace;
}

.assistant-trace-block {
    margin-top: 10px;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: color-mix(in srgb, var(--bg) 52%, var(--panel2));

<script>
(() => {

"use strict";

/* =========================================================
   VALIDATION HELPERS
   ========================================================= */

function allValidationItems()
{
    if (!state.validation)
    {
        return [];
    }

    return [
        ...(state.validation.Errors || []).map(item => ({...item, _severity: "error"})),
        ...(state.validation.Warnings || []).map(item => ({...item, _severity: "warning"}))
    ];
}

function validationItemsForPath(path, includeChildren = false)
{
    return allValidationItems().filter(item =>
    {
        const itemPath = String(item.Path || "");
        if (path === "" && includeChildren)
        {
            return true;
        }

        return itemPath === path ||
            (includeChildren &&
             (itemPath.startsWith(path + ".") ||
              itemPath.startsWith(path + "[")));
    });
}

function fieldValidation(path)
{
    const items = validationItemsForPath(path, false);
    return items.map(item => `
        <div class="field-validation ${item._severity}">
            ${escapeHtml(item.Message || item.Code || item._severity)}
        </div>`).join("");
}

function inlineValidationSummary(path)
{
    const items = validationItemsForPath(path, true);
    if (!items.length)
    {
        return "";
    }

    return `
        <div class="inline-validation-summary">
            ${items.map(item => `
                <div class="field-validation ${item._severity}">
                    <strong>${escapeHtml(item.Path || path)}</strong><br>
                    ${escapeHtml(item.Message || item.Code || item._severity)}
                </div>`).join("")}
        </div>`;
}


const API =
    "/cws/api/system/definition";

const app =
    document.getElementById(
        "app");

const state =
{
    page: "overview",

    definition: null,

    baseline: null,

    // Snapshot last loaded/saved on the processor. Used for deployment diffs.
    processorBaseline: null,

    status: null,

    dirty: false,

    validation: null,

    displayCatalog: {},

    error: null
};


/* =========================================================
   SITE-LOCAL SETTINGS
   ========================================================= */

const SITE_SETTINGS_KEY =
    "MAV_SYSTEM_DEFINITION_UI_SETTINGS";

const DEFAULT_SITE_SETTINGS =
{
    appearance: "auto",
    editorAppearance: "auto",
    editorTheme: "mav",
    aiModelTier: "auto"
};

const AUTO_DAY_START_HOUR = 7;
const AUTO_NIGHT_START_HOUR = 19;

let siteSettings = loadSiteSettings();
let siteThemeTimer = null;

function loadSiteSettings()
{
    try
    {
        const saved = JSON.parse(
            localStorage.getItem(SITE_SETTINGS_KEY) || "{}");

        return {
            appearance:
                ["auto", "day", "night"].includes(saved.appearance)
                    ? saved.appearance
                    : DEFAULT_SITE_SETTINGS.appearance,

            editorAppearance:
                ["auto", "day", "night"].includes(saved.editorAppearance)
                    ? saved.editorAppearance
                    : DEFAULT_SITE_SETTINGS.editorAppearance,

            editorTheme:
                ["mav", "vscode"].includes(saved.editorTheme)
                    ? saved.editorTheme
                    : DEFAULT_SITE_SETTINGS.editorTheme,

            aiModelTier:
                ["auto", "compat", "balanced", "quality"].includes(saved.aiModelTier)
                    ? saved.aiModelTier
                    : DEFAULT_SITE_SETTINGS.aiModelTier
        };
    }
    catch
    {
        return {...DEFAULT_SITE_SETTINGS};
    }
}

function saveSiteSettings()
{
    try
    {
        localStorage.setItem(
            SITE_SETTINGS_KEY,
            JSON.stringify(siteSettings));
    }
    catch
    {
        // Cosmetic settings should never block SystemDefinition editing.
    }

    applySiteSettings();
}

function resolvedSiteTheme()
{
    if (siteSettings.appearance === "day" ||
        siteSettings.appearance === "night")
    {
        return siteSettings.appearance;
    }

    const hour = new Date().getHours();

    return hour >= AUTO_DAY_START_HOUR &&
           hour < AUTO_NIGHT_START_HOUR
        ? "day"
        : "night";
}

function resolvedEditorAppearance()
{
    if (siteSettings.editorAppearance === "day" ||
        siteSettings.editorAppearance === "night")
    {
        return siteSettings.editorAppearance;
    }

    const hour = new Date().getHours();

    return hour >= AUTO_DAY_START_HOUR &&
           hour < AUTO_NIGHT_START_HOUR
        ? "day"
        : "night";
}

function applySiteSettings()
{
    document.body.dataset.siteTheme =
        resolvedSiteTheme();

    document.body.dataset.editorAppearance =
        resolvedEditorAppearance();

    document.body.dataset.editorTheme =
        siteSettings.editorTheme;

    if (state.page === "settings")
    {
        const activeTheme = document.getElementById(
            "settings-active-theme");

        if (activeTheme)
        {
            activeTheme.textContent =
                resolvedSiteTheme() === "day"
                    ? "Day active"
                    : "Night active";
        }

        const activeEditorTheme = document.getElementById(
            "settings-active-editor-theme");

        if (activeEditorTheme)
        {
            activeEditorTheme.textContent =
                resolvedEditorAppearance() === "day"
                    ? "Day active"
                    : "Night active";
        }
    }
}

function scheduleAutomaticThemeCheck()
{
    if (siteThemeTimer !== null)
    {
        clearInterval(siteThemeTimer);
    }

    siteThemeTimer = setInterval(() =>
    {
        if (siteSettings.appearance === "auto" ||
            siteSettings.editorAppearance === "auto")
        {
            const beforeSite = document.body.dataset.siteTheme;
            const beforeEditor = document.body.dataset.editorAppearance;

            applySiteSettings();

            if ((beforeSite !== document.body.dataset.siteTheme ||
                 beforeEditor !== document.body.dataset.editorAppearance) &&
                state.page === "settings")
            {
                render();
            }
        }
    }, 60 * 1000);
}

applySiteSettings();
scheduleAutomaticThemeCheck();

[

/*
 * Display catalog is provided by the MAV SDK through
 * /cws/api/system/definition/catalog.  The SystemDefinition UI
 * does not maintain an independent hard-coded device list.
 */
function buildDisplayCatalog(entries)
{
    const catalog = {};

    (Array.isArray(entries) ? entries : [])
        .forEach(entry =>
        {
            if (
                !entry ||
                !entry.Type ||
                !entry.Brand ||
                !entry.Model)
            {
                return;
            }

            if (!catalog[entry.Type])
            {
                catalog[entry.Type] = {};
            }

            if (!catalog[entry.Type][entry.Brand])
            {
                catalog[entry.Type][entry.Brand] = [];
            }

            if (!catalog[entry.Type][entry.Brand].includes(entry.Model))
            {
                catalog[entry.Type][entry.Brand].push(entry.Model);
            }
        });

    return catalog;
}

function clone(
    value)
{
    if (value == null)
    {
        return value;
    }

    return JSON.parse(
        JSON.stringify(
            value));
}


function escapeHtml(
    value)
{
    return String(
        value ?? "")
        .replace(
            /[&<>'"]/g,
            character =>
            ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "'": "&#39;",
                "\"": "&quot;"
            }[character]));
}


function optionList(
    values,
    selected)
{
    return values.map(
        value =>
            `<option value="${escapeHtml(value)}"
                ${value === selected ? "selected" : ""}>
                ${escapeHtml(value)}
             </option>`)
        .join("");
}


function modelOptionList(
    values,

{
    const placeholder =
        `<option value="" ${!selected ? "selected" : ""}>

    return placeholder +
        optionList(

function displayBrandsForType(
    type,
    currentBrand = "",
    currentModel = "")
{
    const catalog =
        state.displayCatalog[type] || {};

    const brands =
        Object.keys(catalog)
            .filter(brand =>
                Array.isArray(catalog[brand]) &&
                catalog[brand].length > 0);

    // Preserve a value already present in SystemDefinition even if
    // the local UI catalog has not been updated for it yet.
    if (
        currentBrand &&
        !brands.includes(currentBrand))
    {
        brands.push(currentBrand);
    }

    return brands;
}


function displayModelsForSelection(
    type,
    brand,
    currentModel = "")
{
    const models =
        [
            ...(state.displayCatalog[type]?.[brand] || [])
        ];

    // Preserve an existing SystemDefinition model so opening the
    // editor never silently changes an unlisted deployment model.
    if (
        currentModel &&
        !models.includes(currentModel))
    {
        models.push(currentModel);
    }

    return models;
}


function firstDisplaySelectionForType(
    type)
{
    const brands =
        displayBrandsForType(type);

    const brand =

    const models =

            type,

function getApiValue(
    response)
{
    if (
        response &&
        typeof response === "object" &&
        "Value" in response)
    {
        return response.Value;
    }

    return response;
}


async function api(
    command,
    method = "GET",
    body = undefined)
{
    const options =
    {
        method: method,

        headers:
        {
            "Accept":
                "application/json"
        }
    };


    if (body !== undefined)
    {
        options.headers[
            "Content-Type"] =
            "application/json";

        options.body =
            JSON.stringify(
                body);
    }


    const response =
        await fetch(
            `${API}/${command}`,
            options);


    const responseText =
        await response.text();


    let payload =
        {};


    try
    {
        payload =
            responseText
                ? JSON.parse(
                    responseText)
                : {};
    }
    catch
    {
        throw new Error(
            `HTTP ${response.status}: invalid JSON response.`);
    }


    if (
        !response.ok ||
        (
            "Success" in payload &&
            payload.Success === false
        ))
    {
        throw new Error(
            payload.Message ||
            `HTTP ${response.status}`);
    }


    return payload;
}


function normalizeDefinition(
    definition)
{
    definition =
        definition || {};


    definition.Name =
        definition.Name || "";


    definition.MatrixSwitcher =
        definition.MatrixSwitcher ||
        {
            Name:
                "MatrixSwitcher",

            Type:
                "NVX",

            Encoders:
                [],

            Decoders:
                []
        };


    definition.MatrixSwitcher.Name =
        definition.MatrixSwitcher.Name ||
        "MatrixSwitcher";


    definition.MatrixSwitcher.Type =
        definition.MatrixSwitcher.Type ||
        "NVX";


    definition.MatrixSwitcher.Encoders =
        Array.isArray(
            definition.MatrixSwitcher.Encoders)

            ? definition.MatrixSwitcher.Encoders
            : [];


    definition.MatrixSwitcher.Decoders =
        Array.isArray(
            definition.MatrixSwitcher.Decoders)

            ? definition.MatrixSwitcher.Decoders
            : [];


    definition.Cameras =
        Array.isArray(definition.Cameras)
            ? definition.Cameras
            : [];


    if (definition.Dsp)
    {
        definition.Dsp.Faders =
            Array.isArray(
                definition.Dsp.Faders)

                ? definition.Dsp.Faders
                : [];


        definition.Dsp.Buttons =
            Array.isArray(
                definition.Dsp.Buttons)

                ? definition.Dsp.Buttons
                : [];


        definition.Dsp.Devices =
            Array.isArray(
                definition.Dsp.Devices)

                ? definition.Dsp.Devices
                : [];
    }


    return definition;
}


/* =========================================================
   INITIALIZATION
   ========================================================= */


async function initialize()
{
    app.innerHTML =
        `<div class="loading">
            Checking for SystemDefinition…
         </div>`;


    try
    {
        const catalogResponse =
            await api(
                "catalog");

        state.displayCatalog =
            buildDisplayCatalog(
                getApiValue(
                    catalogResponse));

        const statusResponse =
            await api(
                "status");


        state.status =
            getApiValue(
                statusResponse) ||
            {};


        if (
            state.status.Exists)
        {
            const getResponse =
                await api(
                    "get");


            state.definition =
                normalizeDefinition(
                    getApiValue(
                        getResponse));


            state.baseline =
                clone(
                    state.definition);


            state.processorBaseline =
                clone(
                    state.definition);
        }


        render();
    }
    catch (exception)
    {
        state.error =
            exception.message;

        renderFatal();
    }
}

function bindDefinitionImportSurface(
    dropZoneId,
    fileInputId,
    browseButtonId)
{
    const dropZone =
        document.getElementById(
            dropZoneId);

    const fileInput =
        document.getElementById(
            fileInputId);

    const browseButton =
        document.getElementById(
            browseButtonId);


    if (!fileInput || !browseButton)
    {
        return;
    }


    const clearDragState =
        () =>
        {
            if (dropZone)
            {
                dropZone.classList.remove(
                    "dragover");
            }
        };


    browseButton.onclick =
        event =>
        {
            event.stopPropagation();
            fileInput.click();
        };


    fileInput.onchange =
        async event =>
        {
            const file =
                event.target.files?.[0];

            if (file)
            {
                await importDefinitionFile(
                    file);
            }

            // Allow selecting the same file again after editing it externally.
            event.target.value = "";
        };


    if (!dropZone)
    {
        return;
    }


    dropZone.onclick =
        event =>
        {
            if (
                event.target === browseButton ||
                event.target === fileInput)
            {
                return;
            }

            fileInput.click();
        };


    dropZone.onkeydown =
        event =>
        {
            if (
                event.key === "Enter" ||
                event.key === " ")
            {
                event.preventDefault();
                fileInput.click();
            }
        };


    ["dragenter", "dragover"]
        .forEach(eventName =>
        {
            dropZone.addEventListener(
                eventName,
                event =>
                {
                    event.preventDefault();
                    event.stopPropagation();

                    dropZone.classList.add(
                        "dragover");

                    if (event.dataTransfer)
                    {
                        event.dataTransfer.dropEffect =
                            "copy";
                    }
                });
        });


    ["dragleave", "dragend"]
        .forEach(eventName =>
        {
            dropZone.addEventListener(
                eventName,
                event =>
                {
                    event.preventDefault();
                    event.stopPropagation();
                    clearDragState();
                });
        });


    dropZone.addEventListener(
        "drop",
        async event =>
        {
            event.preventDefault();
            event.stopPropagation();
            clearDragState();

            const files =
                event.dataTransfer?.files;

            if (!files || files.length === 0)
            {
                return;
            }

            if (files.length > 1)
            {
                alert(
                    "Drop one SystemDefinition JSON file at a time.");

                return;
            }

            await importDefinitionFile(
                files[0]);
        });
}


async function importDefinitionFile(
    file)
{
    if (!file)
    {
        return;
    }


    if (
        file.name &&
        !file.name.toLowerCase().endsWith(".json"))
    {
        alert(
            "Select a JSON SystemDefinition file.");

        return;
    }


    try
    {
        const fileText =
            typeof file.text === "function"
                ? await file.text()
                : await readFileAsText(
                    file);


        const parsed =
            JSON.parse(
                fileText);


        if (
            !parsed ||
            typeof parsed !== "object" ||
            Array.isArray(parsed))
        {
            throw new Error(
                "The selected JSON does not contain a SystemDefinition object.");
        }


        state.definition =
            normalizeDefinition(
                parsed);


        state.baseline =
            clone(
                state.definition);


        state.status =
        {
            ...state.status,

            ImportedFileName:
                file.name || "SystemDefinition.json",

            WorkingSystemName:
                state.definition.Name || ""
        };


        state.page =
            "overview";


        state.dirty =
            true;


        state.validation =
            null;


        state.error =
            null;


        render();
    }
    catch (exception)
    {
        alert(
            `Unable to load SystemDefinition: ${exception.message}`);
    }
}


function readFileAsText(
    file)
{
    return new Promise(
        (resolve, reject) =>
        {
            const reader =
                new FileReader();


            reader.onload =
                () =>
                {
                    resolve(
                        String(
                            reader.result ?? ""));
                };


            reader.onerror =
                () =>
                {
                    reject(
                        reader.error ||
                        new Error(
                            "Unable to read the selected file."));
                };


            reader.readAsText(
                file);
        });
}


async function createDefinition()
{
    const roomName =
        document
            .getElementById(
                "new-room-name")
            .value
            .trim();


    if (!roomName)
    {
        alert(
            "Enter a room name.");

        return;
    }


    try
    {
        const response =
            await api(
                "new",
                "POST",
                {
                    Name:
                        roomName
                });


        state.definition =
            normalizeDefinition(
                getApiValue(
                    response));


        state.baseline =
            clone(
                state.definition);


        state.status =
        {
            Exists:
                false,

            SystemName:
                roomName
        };


        state.dirty =
            true;


        render();
    }
    catch (exception)
    {
        alert(
            exception.message);
    }
}

function sourceBoundCameraIndex(source)

                    <div class="subsection">

                        <div class="field">

                            <label>
                                USB Local ID
                            </label>

                            <input
                                data-source="${index}"
                                data-key="UsbLocalId"
                                value="${escapeHtml(
                                    source.UsbLocalId)}">

                        </div>

                    </div>`

                    : ""
                }


                ${renderIptvControl(
                    source,
                    index)}

                ${source.Type === "Camera" || sourceBoundCamera(source) ? renderSourceCameraControl(source, index) : ""}

            </div>

        </section>`;
}


/*
 * v0.1 demonstrates transport editing against a real
 * current MAV schema: SourceDefinition.IPTV.
 *
 * Camera / Display / VTC / ATC will get their own
 * schema-aware editors next.
 */
function renderIptvControl(
    source,
    index)
{
    const enabled =
        !!source.IPTV;


    return `
        <div class="subsection">

            <div class="subsection-title">
                Controlled source device
            </div>


            <label class="check">

                <input
                    type="checkbox"
                    data-iptv-toggle="${index}"

                    ${enabled
                        ? "checked"
                        : ""}>

                Configure as IPTV / tuner

            </label>


            ${
                enabled

                ? `
                <div
                    class="form-grid three"
                    style="margin-top:12px">


                    <div class="field">

                        <label>
                            Device Name
                        </label>

                        <input
                            data-iptv="${index}"
                            data-key="Name"
                            value="${escapeHtml(
                                source.IPTV.Name)}">

                    </div>


                    <div class="field">

                        <label>
                            Brand
                        </label>

                        <input
                            data-iptv="${index}"
                            data-key="Brand"
                            value="${escapeHtml(
                                source.IPTV.Brand)}">

                    </div>


                    <div class="field">

                        <label>
                            Transport
                        </label>

                        <select
                            data-iptv="${index}"
                            data-key="CommunicationMethod">

                            ${optionList(
                                [
                                    "IR",
                                    "Serial",
                                    "TCP",
                                    "UDP",
                                    "HTTP",
                                    "HTTPS"
                                ],

                                source
                                    .IPTV
                                    .CommunicationMethod ||
                                "IR")}

                        </select>

                    </div>


                    <div class="field">

                        <label>
                            IR Port
                        </label>

                        <input
                            type="number"
                            data-iptv="${index}"
                            data-key="IrPort"
                            value="${escapeHtml(
                                source.IPTV.IrPort ?? 1)}">

                    </div>


                    <div class="field">

                        <label>
                            IR Driver
                        </label>

                        <input
                            data-iptv="${index}"
                            data-key="IrDriverFile"
                            value="${escapeHtml(
                                source.IPTV.IrDriverFile)}">

                    </div>


                    <div class="field">

                        <label>
                            Channel
                        </label>

                        <input
                            data-iptv="${index}"
                            data-key="Channel"
                            value="${escapeHtml(
                                source.IPTV.Channel)}">

                    </div>

                </div>`

                : `
                <div
                    class="muted"
                    style="margin-top:8px">

                    v0.1 persists source control where the
                    current MAV schema already exposes a
                    concrete device definition. IPTV is
                    supported here; Camera, Display, VTC
                    and ATC editors are next.

                </div>`
            }

        </div>`;
}

function renderDestinationCard(
    destination,
    index)
{
    const usb =
        "UsbLocalId" in
        destination;

    const hasDisplay =
        !!destination.Display;

    const display =
        destination.Display || {};

    const displayType =
        display.Type ||
        (destination.Type === "Projector"
            ? "Projector"
            : "LCD");

    const displayBrands =
        displayBrandsForType(
            displayType,
            display.Brand || "",
            display.Model || "");

    const displayBrand =
        displayBrands.includes(display.Brand)
            ? display.Brand
            : (displayBrands[0] || "");

    const displayModels =
        displayModelsForSelection(
            displayType,
            displayBrand,
            display.Model || "");

    const displayModel =
        display.Model &&
        displayModels.includes(display.Model)
            ? display.Model
            : "";

    const hasScreen =
        !!display.Screen;


    return `
        <section class="device">

            <header>

                <strong>
                    ${escapeHtml(
                        destination.Name) ||
                      `Decoder ${index + 1}`}
                </strong>

                <button
                    class="btn danger small"
                    data-remove-destination="${index}">

                    Delete

                </button>

            </header>


            <div class="device-body">

                <div class="form-grid three">

                    <div class="field">

                        <label>
                            Destination Name
                        </label>

                        <input
                            data-destination="${index}"
                            data-key="Name"
                            value="${escapeHtml(
                                destination.Name)}">

                    </div>


                    <div class="field">

                        <label>
                            Destination Type
                        </label>

                        <select
                            data-destination="${index}"
                            data-key="Type">

                                destinationTypes,
                                destination.Type ||
                                "Monitor")}

                        </select>

                    </div>


                    <div class="field">

                        <label>
                            Decoder IP ID
                        </label>

                        <input
                            data-destination="${index}"
                            data-key="IPID"
                            value="${escapeHtml(
                                destination.IPID)}">

                    </div>

                </div>


                <div class="subsection">

                    <div class="checks">

                        <span class="pill good">
                            Video Routing
                        </span>

                        <span class="pill">
                            Audio via Decoder Role
                        </span>

                        <label class="check">

                            <input
                                type="checkbox"
                                data-destination-usb="${index}"

                                ${usb
                                    ? "checked"
                                    : ""}>

                            USB

                        </label>

                        <label class="check">

                            <input
                                type="checkbox"
                                data-destination-display="${index}"

                                ${hasDisplay
                                    ? "checked"
                                    : ""}>

                            Controlled Display

                        </label>

                    </div>

                </div>


                ${
                    usb

                    ? `
                    <div class="subsection">

                        <div class="field">

                            <label>
                                USB Local ID
                            </label>

                            <input
                                data-destination="${index}"
                                data-key="UsbLocalId"
                                value="${escapeHtml(
                                    destination.UsbLocalId)}">

                        </div>

                    </div>`

                    : ""
                }


                ${
                    hasDisplay

                    ? `
                    <div class="subsection">

                        <div class="subsection-title">
                            Attached Display
                        </div>

                        <div class="form-grid three">

                            <div class="field">

                                <label>
                                    Display Type
                                </label>

                                <select
                                    data-display="${index}"
                                    data-key="Type">

                                    ${optionList(
                                        displayTypes,
                                        displayType)}

                                </select>

                            </div>

                            <div class="field">

                                <label>
                                    Manufacturer
                                </label>

                                <select
                                    data-display="${index}"
                                    data-key="Brand">

                                    ${optionList(
                                        displayBrands,
                                        displayBrand)}

                                </select>

                            </div>

                            <div class="field">

                                <label>

                                </label>

                                <select
                                    data-display="${index}"

                                        displayModels,

                                </select>

                                <label>
                                    Decoder COM Port
                                </label>

                                <input

                                    data-display="${index}"
                                    data-key="ComPort"

                                        display.ComPort || 1)}">

                            </div>

                            <div class="field">

                                <label>
                                    Polling Interval (ms)
                                </label>

                                <input
                                    type="number"
                                    min="250"

                                                step="100"

                    : ""

            </div>

        </section>`;
